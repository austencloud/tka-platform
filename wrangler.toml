name = "tka-platform"
compatibility_date = "2025-04-01"
compatibility_flags = ["nodejs_compat"]
pages_build_output_dir = ".svelte-kit/cloudflare"

[build]
command = "pnpm build"

[build.environment]
GIT_LFS_SKIP_SMUDGE = "1"

[vars]
PUBLIC_ENVIRONMENT = "production"

[[r2_buckets]]
binding = "QR_VIDEOS"
bucket_name = "qr-videos"
