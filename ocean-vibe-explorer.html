<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ocean Vibe Explorer — TKA 3D Backgrounds</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
    background: #0a0a0f;
    color: #e0e0e0;
    display: flex;
    flex-direction: column;
  }

  /* Top vibe selector bar */
  .vibe-bar {
    display: flex;
    gap: 8px;
    padding: 12px 16px;
    background: #111118;
    border-bottom: 1px solid #222;
    flex-shrink: 0;
    z-index: 10;
  }
  .vibe-card {
    flex: 1;
    padding: 12px 16px;
    border-radius: 10px;
    cursor: pointer;
    border: 2px solid transparent;
    transition: all 0.3s ease;
    position: relative;
    overflow: hidden;
    background: #1a1a24;
  }
  .vibe-card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 3px;
    transition: height 0.3s ease;
  }
  .vibe-card:hover { background: #222233; }
  .vibe-card.active {
    border-color: var(--accent);
    background: #1e1e2e;
  }
  .vibe-card.active::before { height: 4px; }
  .vibe-card h3 {
    font-size: 14px;
    font-weight: 600;
    margin-bottom: 4px;
    color: #fff;
  }
  .vibe-card p {
    font-size: 11px;
    color: #888;
    line-height: 1.3;
  }
  .vibe-card .palette {
    display: flex;
    gap: 4px;
    margin-top: 8px;
  }
  .vibe-card .palette .swatch {
    width: 16px;
    height: 16px;
    border-radius: 4px;
    border: 1px solid rgba(255,255,255,0.1);
  }

  /* Main area */
  .main-area {
    flex: 1;
    display: flex;
    position: relative;
    overflow: hidden;
  }
  #canvas-container {
    flex: 1;
    position: relative;
  }
  #canvas-container canvas {
    display: block;
    width: 100%;
    height: 100%;
  }

  /* Info overlay */
  .scene-info {
    position: absolute;
    bottom: 16px;
    left: 16px;
    right: 16px;
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    pointer-events: none;
    z-index: 5;
  }
  .scene-label {
    background: rgba(0,0,0,0.7);
    backdrop-filter: blur(10px);
    padding: 12px 20px;
    border-radius: 10px;
    border: 1px solid rgba(255,255,255,0.1);
  }
  .scene-label h2 {
    font-size: 20px;
    font-weight: 700;
    margin-bottom: 4px;
  }
  .scene-label p {
    font-size: 12px;
    color: #aaa;
  }

  /* Controls panel (right side) */
  .controls-panel {
    width: 280px;
    background: #111118;
    border-left: 1px solid #222;
    padding: 16px;
    overflow-y: auto;
    flex-shrink: 0;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }
  .controls-panel h4 {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: #666;
    margin-bottom: 8px;
  }
  .control-group {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .control-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .control-row label {
    font-size: 12px;
    color: #aaa;
  }
  .control-row input[type="range"] {
    width: 120px;
    accent-color: var(--accent, #4488ff);
  }
  .control-row .value {
    font-size: 11px;
    color: #666;
    font-family: 'SF Mono', 'Consolas', monospace;
    min-width: 36px;
    text-align: right;
  }

  /* Prompt output */
  .prompt-section {
    margin-top: auto;
    padding-top: 16px;
    border-top: 1px solid #222;
  }
  .prompt-output {
    background: #0a0a12;
    border: 1px solid #333;
    border-radius: 8px;
    padding: 12px;
    font-size: 12px;
    font-family: 'SF Mono', 'Consolas', monospace;
    color: #ccc;
    line-height: 1.5;
    max-height: 160px;
    overflow-y: auto;
    white-space: pre-wrap;
  }
  .copy-btn {
    margin-top: 8px;
    width: 100%;
    padding: 10px;
    background: var(--accent, #4488ff);
    color: #fff;
    border: none;
    border-radius: 8px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
  }
  .copy-btn:hover { filter: brightness(1.15); }
  .copy-btn.copied { background: #22c55e; }

  /* Transition overlay */
  .transition-overlay {
    position: absolute;
    inset: 0;
    background: #000;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.4s ease;
    z-index: 3;
  }
  .transition-overlay.fading { opacity: 1; }
</style>
</head>
<body>

<div class="vibe-bar" id="vibeBar"></div>

<div class="main-area">
  <div id="canvas-container">
    <div class="transition-overlay" id="transitionOverlay"></div>
    <div class="scene-info">
      <div class="scene-label">
        <h2 id="sceneTitle">Deep Sea Abyss</h2>
        <p id="sceneDesc">Dark, bioluminescent, mysterious</p>
      </div>
    </div>
  </div>
  <div class="controls-panel">
    <div class="control-group">
      <h4>Scene Tuning</h4>
      <div class="control-row">
        <label>Caustic Intensity</label>
        <input type="range" id="causticIntensity" min="0" max="100" value="60">
        <span class="value" id="causticIntensityVal">0.6</span>
      </div>
      <div class="control-row">

      </div>
      <div class="control-row">
        <label>Fog Density</label>
        <input type="range" id="fogDensity" min="0" max="100" value="50">
        <span class="value" id="fogDensityVal">0.05</span>
      </div>
      <div class="control-row">
        <label>God Ray Strength</label>
        <input type="range" id="godRayStrength" min="0" max="100" value="50">
        <span class="value" id="godRayStrengthVal">0.5</span>
      </div>
      <div class="control-row">
        <label>Particle Count</label>
        <input type="range" id="particleCount" min="50" max="800" value="300" step="50">
        <span class="value" id="particleCountVal">300</span>
      </div>
      <div class="control-row">
        <label>Creature Count</label>
        <input type="range" id="creatureCount" min="2" max="20" value="8">
        <span class="value" id="creatureCountVal">8</span>
      </div>
      <div class="control-row">
        <label>Camera Speed</label>
        <input type="range" id="cameraSpeed" min="0" max="100" value="30">
        <span class="value" id="cameraSpeedVal">0.3</span>
      </div>
    </div>

    <div class="prompt-section">
      <h4>Vibe Config</h4>
      <div class="prompt-output" id="promptOutput"></div>
      <button class="copy-btn" id="copyBtn" onclick="copyPrompt()">Copy Vibe Config</button>
    </div>
  </div>
</div>

<script>
// ─── Three.js inline (ES module via importmap not needed — use global UMD) ───
// We'll build everything with raw WebGL for zero dependencies

const VIBES = [
  {
    id: 'abyss',
    name: 'Deep Sea Abyss',

    clearColor: [0.0, 0.3, 0.5],
    causticColor: [1.0, 0.9, 0.5],
    causticIntensity: 0.8,
    causticScale: 10.0,

    ambientStrength: 0.6,
    godRayColor: [1.0, 0.85, 0.4],
    godRayStrength: 0.7,

  },
  {

    name: 'Mystical Underwater',
    desc: 'Fantasy-tinged, ethereal',
    accent: '#8b5cf6',
    palette: ['#00ff88', '#8b5cf6', '#38bdf8', '#f472b6'],
    fogColor: [0.05, 0.05, 0.18],
    fogDensity: 0.05,
    clearColor: [0.04, 0.04, 0.14],
    causticColor: [0.0, 1.0, 0.53],
    causticIntensity: 0.7,
    causticScale: 7.0,
    ambientColor: [0.15, 0.1, 0.3],
    ambientStrength: 0.5,
    godRayColor: [0.3, 0.6, 1.0],
    godRayStrength: 0.5,
    particleColors: [[0,1,0.53], [0.55,0.36,0.96], [0.96,0.45,0.71]],
    particleGlow: 2.0,
    creatureType: 'jellyfish',
    creatureColors: [[0.55,0.36,0.96], [0,1,0.53], [0.22,0.74,0.97]],
    groundColor: [0.06, 0.04, 0.12],
    depthFade: 0.7,
  },
  {
    id: 'cinematic',
    name: 'Cinematic Realism',
    desc: 'Nature documentary quality',
    accent: '#ffd166',
    palette: ['#1e6091', '#8b7355', '#ffd166', '#2d6a4f'],
    fogColor: [0.05, 0.15, 0.25],
    fogDensity: 0.04,
    clearColor: [0.04, 0.12, 0.2],
    causticColor: [0.9, 0.8, 0.5],
    causticIntensity: 0.5,
    causticScale: 12.0,
    ambientColor: [0.1, 0.2, 0.3],
    ambientStrength: 0.4,
    godRayColor: [1.0, 0.82, 0.4],
    godRayStrength: 0.6,
    particleColors: [[0.6,0.7,0.8], [0.8,0.8,0.7], [0.5,0.6,0.5]],
    particleGlow: 0.3,
    creatureType: 'fish',
    creatureColors: [[0.5,0.55,0.4], [0.6,0.5,0.35], [0.3,0.5,0.6]],
    groundColor: [0.15, 0.12, 0.08],
    depthFade: 0.5,
  },
];

let currentVibe = 0;
let targetVibe = 0;
let transitionProgress = 1.0;

const state = {
  causticIntensity: 0.6,
  causticScale: 8,
  fogDensity: 0.05,
  godRayStrength: 0.5,
  particleCount: 300,
  creatureCount: 8,
  cameraSpeed: 0.3,
};

// ─── WebGL Setup ───
const container = document.getElementById('canvas-container');
const canvas = document.createElement('canvas');
container.insertBefore(canvas, container.firstChild);

const gl = canvas.getContext('webgl2', { antialias: true, alpha: false });
if (!gl) { alert('WebGL2 required'); }

let W, H;
function resize() {
  const r = window.devicePixelRatio || 1;
  const rect = container.getBoundingClientRect();
  W = rect.width * r;
  H = rect.height * r;
  canvas.width = W;
  canvas.height = H;
  canvas.style.width = rect.width + 'px';
  canvas.style.height = rect.height + 'px';
  gl.viewport(0, 0, W, H);
}
window.addEventListener('resize', resize);
resize();

// ─── Shader compilation ───
function createShader(type, src) {
  const s = gl.createShader(type);
  gl.shaderSource(s, src);
  gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) {
    console.error(gl.getShaderInfoLog(s));
    return null;
  }
  return s;
}

function createProgram(vsSrc, fsSrc) {
  const p = gl.createProgram();
  gl.attachShader(p, createShader(gl.VERTEX_SHADER, vsSrc));
  gl.attachShader(p, createShader(gl.FRAGMENT_SHADER, fsSrc));
  gl.linkProgram(p);
  if (!gl.getProgramParameter(p, gl.LINK_STATUS)) {
    console.error(gl.getProgramInfoLog(p));
  }
  return p;
}

// ─── Math helpers ───
function mat4Perspective(fov, aspect, near, far) {
  const f = 1.0 / Math.tan(fov / 2);
  const nf = 1 / (near - far);
  return new Float32Array([
    f/aspect, 0, 0, 0,
    0, f, 0, 0,
    0, 0, (far+near)*nf, -1,
    0, 0, 2*far*near*nf, 0
  ]);
}

function mat4LookAt(eye, center, up) {
  const zx = eye[0]-center[0], zy = eye[1]-center[1], zz = eye[2]-center[2];
  let len = 1/Math.sqrt(zx*zx+zy*zy+zz*zz);
  const z0 = zx*len, z1 = zy*len, z2 = zz*len;
  const xx = up[1]*z2-up[2]*z1, xy = up[2]*z0-up[0]*z2, xz = up[0]*z1-up[1]*z0;
  len = 1/Math.sqrt(xx*xx+xy*xy+xz*xz);
  const x0 = xx*len, x1 = xy*len, x2 = xz*len;
  const y0 = z1*x2-z2*x1, y1 = z2*x0-z0*x2, y2 = z0*x1-z1*x0;
  return new Float32Array([
    x0, y0, z0, 0,
    x1, y1, z1, 0,
    x2, y2, z2, 0,
    -(x0*eye[0]+x1*eye[1]+x2*eye[2]),
    -(y0*eye[0]+y1*eye[1]+y2*eye[2]),
    -(z0*eye[0]+z1*eye[1]+z2*eye[2]),
    1
  ]);
}

function mat4Multiply(a, b) {
  const out = new Float32Array(16);
  for (let i = 0; i < 4; i++)
    for (let j = 0; j < 4; j++) {
      out[j*4+i] = a[i]*b[j*4]+a[4+i]*b[j*4+1]+a[8+i]*b[j*4+2]+a[12+i]*b[j*4+3];
    }
  return out;
}

function lerp(a, b, t) { return a + (b - a) * t; }
function lerpArr(a, b, t) { return a.map((v, i) => lerp(v, b[i], t)); }

// ─── Fullscreen quad (for background + caustics + god rays) ───
const quadVS = `#version 300 es
in vec2 aPos;
out vec2 vUv;
void main() {
  vUv = aPos * 0.5 + 0.5;
  gl_Position = vec4(aPos, 0.0, 1.0);
}`;

const quadFS = `#version 300 es
precision highp float;
in vec2 vUv;
out vec4 fragColor;

uniform float uTime;
uniform vec3 uFogColor;
uniform vec3 uCausticColor;
uniform float uCausticIntensity;
uniform float uCausticScale;
uniform vec3 uGodRayColor;
uniform float uGodRayStrength;
uniform vec3 uGroundColor;
uniform float uDepthFade;
uniform vec3 uAmbientColor;
uniform float uAmbientStrength;
uniform float uAspect;

// Noise for caustics
vec2 hash2(vec2 p) {
  p = vec2(dot(p, vec2(127.1, 311.7)), dot(p, vec2(269.5, 183.3)));
  return -1.0 + 2.0 * fract(sin(p) * 43758.5453);
}

float voronoi(vec2 p) {
  vec2 i = floor(p);
  vec2 f = fract(p);
  float md = 8.0;
  for (int y = -1; y <= 1; y++)
    for (int x = -1; x <= 1; x++) {
      vec2 n = vec2(float(x), float(y));
      vec2 o = hash2(i + n);
      o = 0.5 + 0.5 * sin(uTime * 0.8 + 6.2831 * o);
      vec2 r = n + o - f;
      float d = dot(r, r);
      md = min(md, d);
    }
  return sqrt(md);
}

float causticPattern(vec2 uv) {
  float scale = uCausticScale;
  vec2 p = uv * scale;
  float v1 = voronoi(p + vec2(uTime * 0.1, uTime * 0.05));
  float v2 = voronoi(p * 1.5 + vec2(-uTime * 0.08, uTime * 0.12) + 3.7);
  float v3 = voronoi(p * 0.7 + vec2(uTime * 0.06, -uTime * 0.09) + 7.3);
  float pattern = v1 * v2 + v3 * 0.3;
  pattern = pow(1.0 - pattern, 3.0);
  return pattern;
}

float godRays(vec2 uv) {
  float rays = 0.0;
  vec2 center = vec2(0.5, 1.0);
  vec2 dir = uv - center;
  float dist = length(dir);
  float angle = atan(dir.x, dir.y);
  rays += sin(angle * 5.0 + uTime * 0.3) * 0.5 + 0.5;
  rays += sin(angle * 8.0 - uTime * 0.2) * 0.3 + 0.3;
  rays += sin(angle * 13.0 + uTime * 0.15) * 0.2 + 0.2;
  rays *= smoothstep(1.2, 0.0, dist);
  rays *= smoothstep(0.3, 0.7, uv.y);
  return rays * 0.5;
}

void main() {
  vec2 uv = vUv;
  uv.x *= uAspect;

  // Depth gradient (top = lighter, bottom = darker = closer to floor)
  float depth = 1.0 - vUv.y;

  // Base underwater color with depth
  vec3 waterColor = mix(uFogColor * 1.5, uFogColor * 0.3, pow(depth, 0.7));

  // Ground plane at bottom
  float groundMask = smoothstep(0.08, 0.0, vUv.y);
  vec3 ground = uGroundColor;

  // Caustics on the ground
  float caustic = causticPattern(uv) * uCausticIntensity;
  caustic *= smoothstep(0.3, 0.0, vUv.y); // Only near the bottom
  vec3 causticLight = uCausticColor * caustic;

  // God rays from above
  float rays = godRays(vUv) * uGodRayStrength;
  vec3 rayColor = uGodRayColor * rays;

  // Ambient fill
  vec3 ambient = uAmbientColor * uAmbientStrength;

  // Compose
  vec3 color = waterColor + ambient;
  color = mix(color, ground + causticLight, groundMask);
  color += causticLight * (1.0 - groundMask) * 0.3;
  color += rayColor;

  // Depth fog fade
  color = mix(color, uFogColor, depth * uDepthFade * 0.5);

  // Subtle vignette
  float vig = 1.0 - smoothstep(0.4, 1.4, length(vUv - 0.5) * 1.5);
  color *= vig * 0.3 + 0.7;

  fragColor = vec4(color, 1.0);
}`;

const quadProg = createProgram(quadVS, quadFS);
const quadBuf = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER, quadBuf);
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), gl.STATIC_DRAW);

// ─── Particle system ───
const particleVS = `#version 300 es
in vec3 aPos;
in vec3 aColor;
in float aSize;
in float aPhase;

uniform mat4 uViewProj;
uniform float uTime;
uniform float uGlow;

out vec3 vColor;
out float vAlpha;

void main() {
  // Animate: float upward, drift sideways
  vec3 pos = aPos;
  float t = uTime * 0.3 + aPhase * 6.28;
  pos.y = mod(pos.y + uTime * 0.15 + aPhase * 0.5, 6.0) - 3.0;
  pos.x += sin(t * 0.7 + aPhase * 3.0) * 0.3;
  pos.z += cos(t * 0.5 + aPhase * 2.0) * 0.3;

  gl_Position = uViewProj * vec4(pos, 1.0);
  gl_PointSize = aSize * (300.0 / gl_Position.w);

  vColor = aColor * (1.0 + uGlow * 0.5);
  float pulse = 0.7 + 0.3 * sin(uTime * 2.0 + aPhase * 6.28);
  vAlpha = pulse * 0.8;
}`;

const particleFS = `#version 300 es
precision highp float;
in vec3 vColor;
in float vAlpha;
out vec4 fragColor;

void main() {
  vec2 center = gl_PointCoord - 0.5;
  float dist = length(center);
  float alpha = smoothstep(0.5, 0.1, dist) * vAlpha;
  // Soft glow
  float glow = exp(-dist * 4.0) * 0.5;
  fragColor = vec4(vColor * (1.0 + glow), alpha);
}`;

const particleProg = createProgram(particleVS, particleFS);

// Generate particle data
const MAX_PARTICLES = 800;
let particleVAO, particlePosBuffer, particleColorBuffer, particleSizeBuffer, particlePhaseBuffer;

function initParticles() {
  particleVAO = gl.createVertexArray();
  gl.bindVertexArray(particleVAO);

  particlePosBuffer = gl.createBuffer();
  particleColorBuffer = gl.createBuffer();
  particleSizeBuffer = gl.createBuffer();
  particlePhaseBuffer = gl.createBuffer();

  // Positions
  gl.bindBuffer(gl.ARRAY_BUFFER, particlePosBuffer);
  gl.bufferData(gl.ARRAY_BUFFER, MAX_PARTICLES * 3 * 4, gl.DYNAMIC_DRAW);
  const posLoc = gl.getAttribLocation(particleProg, 'aPos');
  gl.enableVertexAttribArray(posLoc);
  gl.vertexAttribPointer(posLoc, 3, gl.FLOAT, false, 0, 0);

  // Colors
  gl.bindBuffer(gl.ARRAY_BUFFER, particleColorBuffer);
  gl.bufferData(gl.ARRAY_BUFFER, MAX_PARTICLES * 3 * 4, gl.DYNAMIC_DRAW);
  const colLoc = gl.getAttribLocation(particleProg, 'aColor');
  gl.enableVertexAttribArray(colLoc);
  gl.vertexAttribPointer(colLoc, 3, gl.FLOAT, false, 0, 0);

  // Sizes
  gl.bindBuffer(gl.ARRAY_BUFFER, particleSizeBuffer);
  gl.bufferData(gl.ARRAY_BUFFER, MAX_PARTICLES * 4, gl.DYNAMIC_DRAW);
  const sizeLoc = gl.getAttribLocation(particleProg, 'aSize');
  gl.enableVertexAttribArray(sizeLoc);
  gl.vertexAttribPointer(sizeLoc, 1, gl.FLOAT, false, 0, 0);

  // Phases
  gl.bindBuffer(gl.ARRAY_BUFFER, particlePhaseBuffer);
  gl.bufferData(gl.ARRAY_BUFFER, MAX_PARTICLES * 4, gl.DYNAMIC_DRAW);
  const phaseLoc = gl.getAttribLocation(particleProg, 'aPhase');
  gl.enableVertexAttribArray(phaseLoc);
  gl.vertexAttribPointer(phaseLoc, 1, gl.FLOAT, false, 0, 0);

  gl.bindVertexArray(null);
}

function updateParticleData(vibe, count) {
  const positions = new Float32Array(count * 3);
  const colors = new Float32Array(count * 3);
  const sizes = new Float32Array(count);
  const phases = new Float32Array(count);

  for (let i = 0; i < count; i++) {
    positions[i*3] = (Math.random() - 0.5) * 10;
    positions[i*3+1] = (Math.random() - 0.5) * 6;
    positions[i*3+2] = (Math.random() - 0.5) * 10;

    const c = vibe.particleColors[i % vibe.particleColors.length];
    colors[i*3] = c[0];
    colors[i*3+1] = c[1];
    colors[i*3+2] = c[2];

    sizes[i] = 2 + Math.random() * 6;
    phases[i] = Math.random();
  }

  gl.bindBuffer(gl.ARRAY_BUFFER, particlePosBuffer);
  gl.bufferSubData(gl.ARRAY_BUFFER, 0, positions);
  gl.bindBuffer(gl.ARRAY_BUFFER, particleColorBuffer);
  gl.bufferSubData(gl.ARRAY_BUFFER, 0, colors);
  gl.bindBuffer(gl.ARRAY_BUFFER, particleSizeBuffer);
  gl.bufferSubData(gl.ARRAY_BUFFER, 0, sizes);
  gl.bindBuffer(gl.ARRAY_BUFFER, particlePhaseBuffer);
  gl.bufferSubData(gl.ARRAY_BUFFER, 0, phases);
}

initParticles();

// ─── Creature system (jellyfish / fish as point-based billboards) ───
const creatureVS = `#version 300 es
in vec3 aPos;
in vec3 aColor;
in float aSize;
in float aPhase;
in float aType; // 0 = jellyfish bell, 1 = tentacle, 2 = fish body

uniform mat4 uViewProj;
uniform float uTime;

out vec3 vColor;
out float vAlpha;
out float vType;

void main() {
  vec3 pos = aPos;
  float t = uTime + aPhase * 6.28;

  // Jellyfish: bob and pulse
  if (aType < 1.5) {
    pos.y += sin(t * 0.5) * 0.4;
    pos.x += sin(t * 0.3 + aPhase) * 0.5;
    pos.z += cos(t * 0.25 + aPhase * 2.0) * 0.5;
    // Tentacle sway
    if (aType > 0.5) {
      pos.x += sin(t * 1.5 + aPhase * 4.0) * 0.15;
      pos.z += cos(t * 1.2 + aPhase * 3.0) * 0.15;
    }
  }
  // Fish: swim in circles
  else {
    float swimAngle = t * 0.4 + aPhase * 6.28;
    float radius = 2.0 + aPhase * 2.0;
    pos.x += cos(swimAngle) * radius;
    pos.z += sin(swimAngle) * radius;
    pos.y += sin(t * 0.6 + aPhase * 3.0) * 0.3;
  }

  gl_Position = uViewProj * vec4(pos, 1.0);
  float basePtSize = aSize * (400.0 / max(gl_Position.w, 0.1));
  gl_PointSize = clamp(basePtSize, 2.0, 80.0);

  float pulse = 0.7 + 0.3 * sin(t * 2.0);
  vColor = aColor * pulse;
  vAlpha = aType < 1.5 ? (aType < 0.5 ? 0.8 : 0.4) : 0.9;
  vType = aType;
}`;

const creatureFS = `#version 300 es
precision highp float;
in vec3 vColor;
in float vAlpha;
in float vType;
out vec4 fragColor;

void main() {
  vec2 c = gl_PointCoord - 0.5;
  float dist = length(c);

  if (vType < 0.5) {
    // Jellyfish bell: dome shape
    float bell = smoothstep(0.5, 0.15, dist);
    float rim = smoothstep(0.35, 0.42, dist) * smoothstep(0.5, 0.43, dist);
    float glow = exp(-dist * 3.0) * 0.6;
    float alpha = (bell * 0.6 + rim * 0.4 + glow) * vAlpha;
    fragColor = vec4(vColor * (1.0 + glow * 2.0), alpha);
  } else if (vType < 1.5) {
    // Tentacle: thin vertical strand
    float strand = smoothstep(0.15, 0.0, abs(c.x)) * smoothstep(0.5, 0.0, abs(c.y));
    fragColor = vec4(vColor, strand * vAlpha * 0.6);
  } else {
    // Fish: elongated oval
    vec2 stretch = vec2(c.x * 1.8, c.y);
    float body = smoothstep(0.4, 0.1, length(stretch));
    // Tail
    float tail = smoothstep(0.2, 0.0, abs(c.y)) * smoothstep(0.1, 0.4, c.x) * 0.5;
    fragColor = vec4(vColor, (body + tail) * vAlpha);
  }
}`;

const creatureProg = createProgram(creatureVS, creatureFS);
let creatureVAO, creaturePosBuffer, creatureColorBuffer, creatureSizeBuffer, creaturePhaseBuffer, creatureTypeBuffer;
let creatureVertexCount = 0;

function initCreatures() {
  creatureVAO = gl.createVertexArray();
  gl.bindVertexArray(creatureVAO);

  const MAX_CREATURE_VERTS = 200;
  creaturePosBuffer = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, creaturePosBuffer);
  gl.bufferData(gl.ARRAY_BUFFER, MAX_CREATURE_VERTS * 3 * 4, gl.DYNAMIC_DRAW);
  const posLoc = gl.getAttribLocation(creatureProg, 'aPos');
  gl.enableVertexAttribArray(posLoc);
  gl.vertexAttribPointer(posLoc, 3, gl.FLOAT, false, 0, 0);

  creatureColorBuffer = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, creatureColorBuffer);
  gl.bufferData(gl.ARRAY_BUFFER, MAX_CREATURE_VERTS * 3 * 4, gl.DYNAMIC_DRAW);
  const colLoc = gl.getAttribLocation(creatureProg, 'aColor');
  gl.enableVertexAttribArray(colLoc);
  gl.vertexAttribPointer(colLoc, 3, gl.FLOAT, false, 0, 0);

  creatureSizeBuffer = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, creatureSizeBuffer);
  gl.bufferData(gl.ARRAY_BUFFER, MAX_CREATURE_VERTS * 4, gl.DYNAMIC_DRAW);
  const sizeLoc = gl.getAttribLocation(creatureProg, 'aSize');
  gl.enableVertexAttribArray(sizeLoc);
  gl.vertexAttribPointer(sizeLoc, 1, gl.FLOAT, false, 0, 0);

  creaturePhaseBuffer = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, creaturePhaseBuffer);
  gl.bufferData(gl.ARRAY_BUFFER, MAX_CREATURE_VERTS * 4, gl.DYNAMIC_DRAW);
  const phaseLoc = gl.getAttribLocation(creatureProg, 'aPhase');
  gl.enableVertexAttribArray(phaseLoc);
  gl.vertexAttribPointer(phaseLoc, 1, gl.FLOAT, false, 0, 0);

  creatureTypeBuffer = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, creatureTypeBuffer);
  gl.bufferData(gl.ARRAY_BUFFER, MAX_CREATURE_VERTS * 4, gl.DYNAMIC_DRAW);
  const typeLoc = gl.getAttribLocation(creatureProg, 'aType');
  gl.enableVertexAttribArray(typeLoc);
  gl.vertexAttribPointer(typeLoc, 1, gl.FLOAT, false, 0, 0);

  gl.bindVertexArray(null);
}

function updateCreatureData(vibe, count) {
  const isJellyfish = vibe.creatureType === 'jellyfish';
  const vertsPerCreature = isJellyfish ? 7 : 3; // bell + 6 tentacles, or 3 fish points
  const total = count * vertsPerCreature;
  creatureVertexCount = total;

  const positions = new Float32Array(total * 3);
  const colors = new Float32Array(total * 3);
  const sizes = new Float32Array(total);
  const phases = new Float32Array(total);
  const types = new Float32Array(total);

  let idx = 0;
  for (let c = 0; c < count; c++) {
    const baseX = (Math.random() - 0.5) * 8;
    const baseY = -1.0 + Math.random() * 3.5;
    const baseZ = (Math.random() - 0.5) * 8;
    const col = vibe.creatureColors[c % vibe.creatureColors.length];
    const phase = Math.random();

    if (isJellyfish) {
      // Bell
      positions[idx*3] = baseX;
      positions[idx*3+1] = baseY;
      positions[idx*3+2] = baseZ;
      colors[idx*3] = col[0]; colors[idx*3+1] = col[1]; colors[idx*3+2] = col[2];
      sizes[idx] = 15 + Math.random() * 10;
      phases[idx] = phase;
      types[idx] = 0;
      idx++;

      // Tentacles
      for (let t = 0; t < 6; t++) {
        const angle = (t / 6) * Math.PI * 2;
        positions[idx*3] = baseX + Math.cos(angle) * 0.15;
        positions[idx*3+1] = baseY - 0.3 - Math.random() * 0.4;
        positions[idx*3+2] = baseZ + Math.sin(angle) * 0.15;
        colors[idx*3] = col[0]*0.7; colors[idx*3+1] = col[1]*0.7; colors[idx*3+2] = col[2]*0.7;
        sizes[idx] = 6 + Math.random() * 4;
        phases[idx] = phase + t * 0.05;
        types[idx] = 1;
        idx++;
      }
    } else {
      // Fish: 3 points (body, head glow, tail)
      for (let p = 0; p < 3; p++) {
        positions[idx*3] = baseX + (p - 1) * 0.1;
        positions[idx*3+1] = baseY;
        positions[idx*3+2] = baseZ;
        colors[idx*3] = col[0]; colors[idx*3+1] = col[1]; colors[idx*3+2] = col[2];
        sizes[idx] = p === 0 ? 10 : (p === 1 ? 6 : 4);
        phases[idx] = phase;
        types[idx] = 2;
        idx++;
      }
    }
  }

  gl.bindBuffer(gl.ARRAY_BUFFER, creaturePosBuffer);
  gl.bufferSubData(gl.ARRAY_BUFFER, 0, positions.subarray(0, total * 3));
  gl.bindBuffer(gl.ARRAY_BUFFER, creatureColorBuffer);
  gl.bufferSubData(gl.ARRAY_BUFFER, 0, colors.subarray(0, total * 3));
  gl.bindBuffer(gl.ARRAY_BUFFER, creatureSizeBuffer);
  gl.bufferSubData(gl.ARRAY_BUFFER, 0, sizes.subarray(0, total));
  gl.bindBuffer(gl.ARRAY_BUFFER, creaturePhaseBuffer);
  gl.bufferSubData(gl.ARRAY_BUFFER, 0, phases.subarray(0, total));
  gl.bindBuffer(gl.ARRAY_BUFFER, creatureTypeBuffer);
  gl.bufferSubData(gl.ARRAY_BUFFER, 0, types.subarray(0, total));
}

initCreatures();

// ─── Vibe interpolation ───
function getCurrentVibeParams() {
  const v = VIBES[currentVibe];
  const base = {
    fogColor: v.fogColor,
    clearColor: v.clearColor,
    causticColor: v.causticColor,
    causticIntensity: v.causticIntensity * state.causticIntensity,
    causticScale: v.causticScale * (state.causticScale / 8),
    ambientColor: v.ambientColor,
    ambientStrength: v.ambientStrength,
    godRayColor: v.godRayColor,
    godRayStrength: v.godRayStrength * state.godRayStrength,
    groundColor: v.groundColor,
    depthFade: v.depthFade * (state.fogDensity / 0.05),
    particleGlow: v.particleGlow,
  };
  return base;
}

// ─── Build UI ───
function buildVibeCards() {
  const bar = document.getElementById('vibeBar');
  bar.innerHTML = '';
  VIBES.forEach((v, i) => {
    const card = document.createElement('div');
    card.className = 'vibe-card' + (i === currentVibe ? ' active' : '');
    card.style.setProperty('--accent', v.accent);
    card.style.cssText += `--accent: ${v.accent};`;
    card.innerHTML = `
      <div style="position:absolute;top:0;left:0;right:0;height:${i===currentVibe?4:3}px;background:${v.accent};border-radius:10px 10px 0 0;"></div>
      <h3>${v.name}</h3>
      <p>${v.desc}</p>
      <div class="palette">${v.palette.map(c => `<div class="swatch" style="background:${c}"></div>`).join('')}</div>
    `;
    card.addEventListener('click', () => switchVibe(i));
    bar.appendChild(card);
  });
}

function switchVibe(idx) {
  if (idx === currentVibe) return;
  const overlay = document.getElementById('transitionOverlay');
  overlay.classList.add('fading');
  setTimeout(() => {
    currentVibe = idx;
    const v = VIBES[idx];
    updateParticleData(v, state.particleCount);
    updateCreatureData(v, state.creatureCount);
    buildVibeCards();
    document.getElementById('sceneTitle').textContent = v.name;
    document.getElementById('sceneDesc').textContent = v.desc;
    document.documentElement.style.setProperty('--accent', v.accent);
    updatePrompt();
    overlay.classList.remove('fading');
  }, 400);
}

buildVibeCards();
updateParticleData(VIBES[0], state.particleCount);
updateCreatureData(VIBES[0], state.creatureCount);

// ─── Controls ───
const controls = ['causticIntensity', 'causticScale', 'fogDensity', 'godRayStrength', 'particleCount', 'creatureCount', 'cameraSpeed'];
const controlConfig = {
  causticIntensity: { div: 100, fmt: v => (v/100).toFixed(1), key: 'causticIntensity' },
  causticScale: { div: 1, fmt: v => v, key: 'causticScale' },
  fogDensity: { div: 1000, fmt: v => (v/1000).toFixed(3), key: 'fogDensity' },
  godRayStrength: { div: 100, fmt: v => (v/100).toFixed(1), key: 'godRayStrength' },
  particleCount: { div: 1, fmt: v => v, key: 'particleCount' },
  creatureCount: { div: 1, fmt: v => v, key: 'creatureCount' },
  cameraSpeed: { div: 100, fmt: v => (v/100).toFixed(1), key: 'cameraSpeed' },
};

controls.forEach(id => {
  const el = document.getElementById(id);
  const valEl = document.getElementById(id + 'Val');
  const cfg = controlConfig[id];
  el.addEventListener('input', () => {
    const raw = parseFloat(el.value);
    valEl.textContent = cfg.fmt(raw);
    state[cfg.key] = cfg.div === 1 ? raw : raw / cfg.div;

    if (id === 'particleCount') {
      updateParticleData(VIBES[currentVibe], raw);
    }
    if (id === 'creatureCount') {
      updateCreatureData(VIBES[currentVibe], raw);
    }
    updatePrompt();
  });
});

// ─── Prompt output ───
function updatePrompt() {
  const v = VIBES[currentVibe];
  const config = {
    vibe: v.id,
    name: v.name,
    palette: {
      primary: v.palette[0],
      secondary: v.palette[1],
      accent1: v.palette[2],
      accent2: v.palette[3],
    },
    fog: { color: v.fogColor.map(c => Math.round(c*255)), density: state.fogDensity },
    caustics: {
      color: v.causticColor.map(c => Math.round(c*255)),
      intensity: state.causticIntensity,
      scale: state.causticScale,
    },
    godRays: { color: v.godRayColor.map(c => Math.round(c*255)), strength: state.godRayStrength },
    creatures: { type: v.creatureType, count: state.creatureCount, colors: v.creatureColors },
    particles: { count: state.particleCount, glow: v.particleGlow },
    ground: { color: v.groundColor.map(c => Math.round(c*255)) },
    camera: { orbitSpeed: state.cameraSpeed },
  };
  document.getElementById('promptOutput').textContent = JSON.stringify(config, null, 2);
}
updatePrompt();

function copyPrompt() {
  const text = document.getElementById('promptOutput').textContent;
  navigator.clipboard.writeText(text).then(() => {
    const btn = document.getElementById('copyBtn');
    btn.textContent = 'Copied!';
    btn.classList.add('copied');
    setTimeout(() => {
      btn.textContent = 'Copy Vibe Config';
      btn.classList.remove('copied');
    }, 1500);
  });
}

// ─── Render loop ───
let time = 0;

function render(ts) {
  requestAnimationFrame(render);
  time = ts * 0.001;

  resize();

  const aspect = W / H;
  const params = getCurrentVibeParams();

  // Clear
  gl.clearColor(...params.clearColor, 1);
  gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);
  gl.disable(gl.DEPTH_TEST);

  // Draw background quad
  gl.useProgram(quadProg);
  gl.bindBuffer(gl.ARRAY_BUFFER, quadBuf);
  const qPosLoc = gl.getAttribLocation(quadProg, 'aPos');
  gl.enableVertexAttribArray(qPosLoc);
  gl.vertexAttribPointer(qPosLoc, 2, gl.FLOAT, false, 0, 0);

  gl.uniform1f(gl.getUniformLocation(quadProg, 'uTime'), time);
  gl.uniform3fv(gl.getUniformLocation(quadProg, 'uFogColor'), params.fogColor);
  gl.uniform3fv(gl.getUniformLocation(quadProg, 'uCausticColor'), params.causticColor);
  gl.uniform1f(gl.getUniformLocation(quadProg, 'uCausticIntensity'), params.causticIntensity);
  gl.uniform1f(gl.getUniformLocation(quadProg, 'uCausticScale'), params.causticScale);
  gl.uniform3fv(gl.getUniformLocation(quadProg, 'uGodRayColor'), params.godRayColor);
  gl.uniform1f(gl.getUniformLocation(quadProg, 'uGodRayStrength'), params.godRayStrength);
  gl.uniform3fv(gl.getUniformLocation(quadProg, 'uGroundColor'), params.groundColor);
  gl.uniform1f(gl.getUniformLocation(quadProg, 'uDepthFade'), params.depthFade);
  gl.uniform3fv(gl.getUniformLocation(quadProg, 'uAmbientColor'), params.ambientColor);
  gl.uniform1f(gl.getUniformLocation(quadProg, 'uAmbientStrength'), params.ambientStrength);
  gl.uniform1f(gl.getUniformLocation(quadProg, 'uAspect'), aspect);

  gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);

  // Camera
  const camAngle = time * state.cameraSpeed * 0.3;
  const camDist = 5;
  const camHeight = 1.5 + Math.sin(time * 0.15) * 0.5;
  const eye = [Math.cos(camAngle) * camDist, camHeight, Math.sin(camAngle) * camDist];
  const center = [0, 0, 0];
  const up = [0, 1, 0];
  const view = mat4LookAt(eye, center, up);
  const proj = mat4Perspective(Math.PI / 3, aspect, 0.1, 50);
  const viewProj = mat4Multiply(proj, view);

  gl.enable(gl.BLEND);
  gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);
  gl.enable(gl.DEPTH_TEST);
  gl.depthMask(false);

  // Draw particles
  gl.useProgram(particleProg);
  gl.uniformMatrix4fv(gl.getUniformLocation(particleProg, 'uViewProj'), false, viewProj);
  gl.uniform1f(gl.getUniformLocation(particleProg, 'uTime'), time);
  gl.uniform1f(gl.getUniformLocation(particleProg, 'uGlow'), params.particleGlow);

  gl.bindVertexArray(particleVAO);
  gl.drawArrays(gl.POINTS, 0, state.particleCount);
  gl.bindVertexArray(null);

  // Draw creatures
  gl.useProgram(creatureProg);
  gl.uniformMatrix4fv(gl.getUniformLocation(creatureProg, 'uViewProj'), false, viewProj);
  gl.uniform1f(gl.getUniformLocation(creatureProg, 'uTime'), time);

  // More additive blending for creatures (glow)
  gl.blendFunc(gl.SRC_ALPHA, gl.ONE);

  gl.bindVertexArray(creatureVAO);
  gl.drawArrays(gl.POINTS, 0, creatureVertexCount);
  gl.bindVertexArray(null);

  gl.depthMask(true);
  gl.disable(gl.BLEND);
}

requestAnimationFrame(render);
</script>
