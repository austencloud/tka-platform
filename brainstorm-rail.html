<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rail UI Concepts</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
  :root {
    --theme-panel-bg: #0a0a14;
    --theme-stroke: rgba(255, 255, 255, 0.12);
    --theme-accent: #6366f1;
    --theme-text: #ffffff;
    --theme-text-dim: rgba(255, 255, 255, 0.4);
    --font-size-xs: 11px;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #060610;
    color: var(--theme-text);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    height: 100vh;
    overflow: hidden;
  }

  .concepts {
    display: flex;
    height: 100vh;
  }

  .concept {
    flex: 1;
    display: flex;
    flex-direction: column;
    border-right: 1px solid rgba(255,255,255,0.06);
  }
  .concept:last-child { border-right: none; }

  .concept-label {
    padding: 12px 16px;
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: rgba(255,255,255,0.35);
    background: rgba(255,255,255,0.03);
    border-bottom: 1px solid rgba(255,255,255,0.06);
    text-align: center;
  }

  .viewer-layout {
    flex: 1;
    display: grid;
    grid-template-columns: auto 1fr;
    min-height: 0;
  }

  /* === RAIL === */
  .content-rail {
    width: 140px;
    display: flex;
    flex-direction: column;
    background: var(--theme-panel-bg);
    border-right: 1px solid var(--theme-stroke);
    overflow: hidden;
  }

  .rail-modes {
    flex: 1;
    display: flex;
    flex-direction: column;
  }

  .rail-mode-btn {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 6px;
    background: none;
    border: none;
    border-left: 3px solid transparent;
    color: var(--theme-text-dim);
    cursor: pointer;
    position: relative;
    font-family: inherit;
    transition: background 120ms cubic-bezier(0.2, 0, 0, 1),
                color 120ms cubic-bezier(0.2, 0, 0, 1),
                border-color 120ms cubic-bezier(0.2, 0, 0, 1);
  }

  .rail-mode-btn:hover:not(.active) {
    background: rgba(255, 255, 255, 0.04);
    color: rgba(255, 255, 255, 0.8);
  }

  .rail-mode-btn.active {
    background: color-mix(in srgb, var(--theme-accent) 12%, transparent);
    border-left-color: var(--theme-accent);
    color: var(--theme-text);
  }

  .rail-mode-btn i { font-size: 20px; }

  .rail-mode-label {
    font-size: var(--font-size-xs);
    font-weight: 500;
    letter-spacing: 0.02em;
  }

  /* Section divider for Concept B */
  .rail-divider {
    height: 1px;
    background: var(--theme-stroke);
    margin: 0 12px;
    flex-shrink: 0;
  }

  .rail-section-label {
    padding: 8px 0 4px;
    text-align: center;
    font-size: 9px;
    font-weight: 600;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: rgba(255,255,255,0.2);
    flex-shrink: 0;
  }

  /* === CONTENT AREA === */
  .content-area {
    min-width: 0;
    min-height: 0;
    position: relative;
  }

  /* Split view */
  .split-view {
    display: grid;
    grid-template-rows: 50% 50%;
    height: 100%;
    width: 100%;
  }

  .split-column {
    position: relative;
    overflow: hidden;
  }

  .pane-mock {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 8px;
  }

  .pane-mock.animation {
    background: #0a0a0f;
  }

  .pane-mock.card {
    background: #08080e;
  }

  .pane-mock i {
    font-size: 32px;
    opacity: 0.15;
  }

  .pane-mock span {
    font-size: 11px;
    opacity: 0.2;
    letter-spacing: 0.03em;
  }

  .split-divider {
    height: 1px;
    background: rgba(255,255,255,0.08);
  }

  /* Focused single-pane view */
  .focused-view {
    height: 100%;
    width: 100%;
    position: relative;
  }

  .focused-view .pane-mock {
    position: absolute;
    inset: 0;
  }

  /* Focus mode top border accent */
  .focus-border {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 2px;
    background: var(--theme-accent);
    opacity: 0.6;
    z-index: 1;
  }

  /* Right rail mock */
  .right-rail-mock {
    position: absolute;
    top: 8px;
    right: 8px;
    width: 36px;
    display: flex;
    flex-direction: column;
    gap: 4px;
    align-items: center;
  }

  .right-rail-mock .dot {
    width: 28px;
    height: 28px;
    border-radius: 6px;
    background: rgba(255,255,255,0.06);
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .right-rail-mock .dot i {
    font-size: 12px;
    opacity: 0.3;
  }

  /* Desktop side-by-side (landscape) */
  @media (min-width: 768px) {
    .split-view {
      grid-template-rows: 1fr;
      grid-template-columns: 1fr 1fr;
    }
    .split-divider {
      width: 1px;
      height: auto;
      background: rgba(255,255,255,0.08);
    }
  }
</style>
</head>
<body>

<div class="concepts">

  <!-- CONCEPT A: Current (flat list, no grouping) -->
  <div class="concept">
    <div class="concept-label">Current — Flat list</div>
    <div class="viewer-layout">
      <nav class="content-rail">
        <div class="rail-modes">
          <button class="rail-mode-btn active">
            <i class="fas fa-columns"></i>
            <span class="rail-mode-label">Side by Side</span>
          </button>
          <button class="rail-mode-btn">
            <i class="fas fa-play"></i>
            <span class="rail-mode-label">2D Animation</span>
          </button>
          <button class="rail-mode-btn">
            <i class="fas fa-cube"></i>
            <span class="rail-mode-label">3D Animation</span>
          </button>
          <button class="rail-mode-btn">
            <i class="fas fa-grip"></i>
            <span class="rail-mode-label">Card</span>
          </button>
          <button class="rail-mode-btn">
            <i class="fas fa-video"></i>
            <span class="rail-mode-label">Videos</span>
          </button>
        </div>
      </nav>
      <div class="content-area">
        <div class="split-view">
          <div class="split-column">
            <div class="pane-mock animation">
              <i class="fas fa-play"></i>
              <span>2D Animation</span>
            </div>
          </div>
          <div class="split-column">
            <div class="pane-mock card">
              <i class="fas fa-grip"></i>
              <span>Choreo Card</span>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- CONCEPT B: Section grouping -->
  <div class="concept">
    <div class="concept-label">Section grouping</div>
    <div class="viewer-layout">
      <nav class="content-rail">
        <div class="rail-modes">
          <button class="rail-mode-btn active">
            <i class="fas fa-columns"></i>
            <span class="rail-mode-label">Side by Side</span>
          </button>
          <div class="rail-divider"></div>
          <div class="rail-section-label">Focus</div>
          <button class="rail-mode-btn">
            <i class="fas fa-play"></i>
            <span class="rail-mode-label">2D Animation</span>
          </button>
          <button class="rail-mode-btn">
            <i class="fas fa-cube"></i>
            <span class="rail-mode-label">3D Animation</span>
          </button>
          <button class="rail-mode-btn">
            <i class="fas fa-grip"></i>
            <span class="rail-mode-label">Card</span>
          </button>
          <button class="rail-mode-btn">
            <i class="fas fa-video"></i>
            <span class="rail-mode-label">Videos</span>
          </button>
        </div>
      </nav>
      <div class="content-area">
        <div class="split-view">
          <div class="split-column">
            <div class="pane-mock animation">
              <i class="fas fa-play"></i>
              <span>2D Animation</span>
            </div>
          </div>
          <div class="split-column">
            <div class="pane-mock card">
              <i class="fas fa-grip"></i>
              <span>Choreo Card</span>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- CONCEPT C: Section grouping + focused state -->
  <div class="concept">
    <div class="concept-label">Focused mode (3D selected)</div>
    <div class="viewer-layout">
      <nav class="content-rail">
        <div class="rail-modes">
          <button class="rail-mode-btn">
            <i class="fas fa-columns"></i>
            <span class="rail-mode-label">Side by Side</span>
          </button>
          <div class="rail-divider"></div>
          <div class="rail-section-label">Focus</div>
          <button class="rail-mode-btn">
            <i class="fas fa-play"></i>
            <span class="rail-mode-label">2D Animation</span>
          </button>
          <button class="rail-mode-btn active">
            <i class="fas fa-cube"></i>
            <span class="rail-mode-label">3D Animation</span>
          </button>
          <button class="rail-mode-btn">
            <i class="fas fa-grip"></i>
            <span class="rail-mode-label">Card</span>
          </button>
          <button class="rail-mode-btn">
            <i class="fas fa-video"></i>
            <span class="rail-mode-label">Videos</span>
          </button>
        </div>
      </nav>
      <div class="content-area">
        <div class="focused-view">
          <div class="focus-border"></div>
          <div class="pane-mock animation" style="background: #1a1a2e;">
            <i class="fas fa-cube"></i>
            <span>3D Viewer</span>
          </div>
          <div class="right-rail-mock">
            <div class="dot"><i class="fas fa-gear"></i></div>
            <div class="dot"><i class="fas fa-sliders"></i></div>
            <div class="dot"><i class="fas fa-download"></i></div>
          </div>
        </div>
      </div>
    </div>
  </div>

</div>

</body>
</html>
