<?xml version="1.0" encoding="utf-8"?>
<svg version="1.1"
    id="Layer_1"
    xmlns="http://www.w3.org/2000/svg"
    x="0"
    y="0"
    viewBox="0 0 950 950"
    xml:space="preserve">
  <style>
    /* Default: show normal points, hide strict points */
    .box-outer-ring{fill:none;stroke:#000;stroke-width:13;stroke-miterlimit:10}
    .box-grid-invisible{fill:none}
    .normal-hand-point{fill:currentColor}
    .normal-layer2-point{fill:none}
    .strict-hand-point{fill:none}
    .strict-layer2-point{fill:none}

    /* Strict mode: hide normal points, show strict points */
    .strict-mode .normal-hand-point{fill:none}
    .strict-mode .normal-layer2-point{fill:none}
    .strict-mode .strict-hand-point{fill:currentColor}
    .strict-mode .strict-layer2-point{fill:currentColor}
  </style>

  <!-- Center point -->
  <circle id="center_point" cx="475" cy="475" r="11.2"/>

  <!-- Outer points — hollow rings matching skewed_grid.svg ring weight -->
  <circle id="ne_box_outer_point" class="box-outer-ring" cx="262.9" cy="262.9" r="25"/>
  <circle id="se_box_outer_point" class="box-outer-ring" cx="687.1" cy="262.9" r="25"/>
  <circle id="sw_box_outer_point" class="box-outer-ring" cx="687.1" cy="687.1" r="25"/>
  <circle id="nw_box_outer_point" class="box-outer-ring" cx="262.9" cy="687.1" r="25"/>

  <!-- Hand points -->
  <circle id="nw_box_hand_point" class="normal-hand-point" cx="373.8" cy="373.8" r="4.7"/>
  <circle id="ne_box_hand_point" class="normal-hand-point" cx="576.2" cy="373.8" r="4.7"/>
  <circle id="se_box_hand_point" class="normal-hand-point" cx="576.2" cy="576.2" r="4.7"/>
  <circle id="sw_box_hand_point" class="normal-hand-point" cx="373.8" cy="576.2" r="4.7"/>

  <!-- Layer 2 points -->
  <circle id="n_box_layer2_point" class="normal-layer2-point" cx="475" cy="272.6" r="8.8"/>
  <circle id="e_box_layer2_point" class="normal-layer2-point" cx="677.4" cy="475" r="8.8"/>
  <circle id="s_box_layer2_point" class="normal-layer2-point" cx="475" cy="677.4" r="8.8"/>
  <circle id="w_box_layer2_point" class="normal-layer2-point" cx="272.6" cy="475" r="8.8"/>

  <!-- Layer 2 strict points -->
  <circle id="strict_n_box_layer2_point" class="strict-layer2-point" cx="475" cy="262.9" r="8.8"/>
  <circle id="strict_e_box_layer2_point" class="strict-layer2-point" cx="687.1" cy="475" r="8.8"/>
  <circle id="strict_s_box_layer2_point" class="strict-layer2-point" cx="475" cy="687.1" r="8.8"/>
  <circle id="strict_w_box_layer2_point" class="strict-layer2-point" cx="262.9" cy="475" r="8.8"/>

  <!-- Hand strict points -->
  <circle id="strict_se_box_hand_point" class="strict-hand-point" cx="581.1" cy="581.1" r="4.7"/>
  <circle id="strict_sw_box_hand_point" class="strict-hand-point" cx="368.9" cy="581.1" r="4.7"/>
  <circle id="strict_nw_box_hand_point" class="strict-hand-point" cx="368.9" cy="368.9" r="4.7"/>
  <circle id="strict_ne_box_hand_point" class="strict-hand-point" cx="581.1" cy="368.9" r="4.7"/>
</svg>
