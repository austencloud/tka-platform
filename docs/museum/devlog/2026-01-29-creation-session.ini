● That last point is really important and I think it's easy to underestimate.

  Flow arts has been a niche community for decades with almost zero representation in games, serious software, or mainstream media. The handful of times it appears it's usually:
  - Background dancers in a music video
  - A brief "look at this weird thing" segment
  - Glow poi at a rave scene

  Nobody has ever built something that treats it as a system worth studying, a culture worth documenting, an art form worth the same reverence as dance or music.

  The mere existence of this - a museum, lore, 3D performers, choreography tools - says "this matters." That's the emotional payload before anyone even clicks anything.

