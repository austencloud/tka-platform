 Museum Development Tracking System

 Overview

 Create a parallel Firestore collection (museumDev) with the same proven mechanics as the feedback system, adapted for creative worldbuilding work. The system preserves full session transcripts, enables bidirectional linking between ideas, and keeps rejected concepts
 for historical context.

 10-Year Goals:
 1. Replay the creative process (raw transcripts, not summaries)
 2. Trace any decision back to its source session
 3. Search rejected ideas to understand what was considered
 4. Attach media (concept art, reference images, audio)
 5. Link changes in story docs back to the decisions that caused them

 ---
 Files to Create

 1. Configuration

 config/museum-dev.config.js
 - Item types: session, decision, question, element, reference
 - Element subtypes: wing, artifact, plaque, character, mechanic, audio, visual
 - Link types: spawned, derived, related, contradicts, answers
 - Verdict types: accepted, rejected, deferred, superseded
 - Reuse stale thresholds from feedback.config.js (45min activity, 8hr max)

 2. Main CLI Script

 scripts/museum-dev.js (~800-1000 lines)

 Fork from fetch-feedback.js, adapting:
 - Collection name: museumDev instead of feedback
 - Session collection: museumDevSessions instead of agentSessions
 - Remove notification/messaging (internal tool only)
 - Add linking commands
 - Add transcript attachment
 - Add quick capture commands

 3. Supporting Modules

 scripts/lib/museum-linking.js (~150 lines)
 - addLink(fromId, toId, type, note) - creates bidirectional link
 - removeLink(fromId, toId) - removes link from both sides
 - getLinks(docId) - returns all links to/from item
 - traceToSession(docId) - walks links to find source session

 scripts/lib/museum-attachments.js (~100 lines)
 - addAttachment(docId, type, filePath, description)
 - listAttachments(docId)
 - Uses Firebase Storage (same bucket as feedback images)

 ---
 Firestore Schema

 Collection: museumDev

 {
   // Identity
   id: string,                    // Auto-generated
   type: 'session' | 'decision' | 'question' | 'element' | 'reference',

   // Content
   title: string,
   description: string,

   // Session-specific
   transcript?: string,           // Full conversation text
   sessionDate?: Timestamp,
   participants?: string[],       // ["austen", "claude-opus-4.5"]

   // Decision-specific
   verdict?: 'accepted' | 'rejected' | 'deferred' | 'superseded',
   rationale?: string,
   supersededBy?: string,         // docId

   // Question-specific
   answered?: boolean,
   answer?: string,

   // Element-specific
   elementType?: 'wing' | 'artifact' | 'plaque' | 'character' | 'mechanic',
   docPath?: string,              // "museum-layout.md#wing-3"

   // Bidirectional linking
   linkedFrom: [{ docId, type, addedAt, note }],
   linksTo: [{ docId, type, addedAt, note }],

   // Attachments
   attachments: [{ id, type, name, url, description, addedAt }],

   // Tags & doc references
   tags: string[],
   relatedDocs: string[],         // Auto-detected doc paths

   // Status (same as feedback)
   status: 'new' | 'in-progress' | 'in-review' | 'completed' | 'archived',

   // Claim mechanics (same as feedback)
   claimedAt?: Timestamp,
   claimedBy?: string,
   claimToken?: string,
   lastActivity?: Timestamp,

   // Archive/rejection
   archivedAt?: Timestamp,
   archiveReason?: string,
   rejectionReason?: string,      // Preserved even when archived

   // Timestamps
   createdAt: Timestamp,
   updatedAt: Timestamp,
 }

 Subcollection: museumDev/{id}/journal

 Same structure as feedback journal - append-only activity log.

