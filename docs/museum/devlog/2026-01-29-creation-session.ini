  Level System (Corrected)
  Level: 1
  Name: No Turns
  What It Adds: All 6 types in base form. 0 turns only.
  ────────────────────────────────────────
  Level: 2
  Name: Whole Turns
  What It Adds: Adds 1, 2, 3 turn rotations (either direction)
  ────────────────────────────────────────
  Level: 3
  Name: Half Turns
  What It Adds: Adds 0.5, 1.5, 2.5 turns + float (new motion type - adjacent move with no rotation)
  ────────────────────────────────────────
  Level: 4
  Name: Skews
  What It Adds: Diamond + box mode simultaneously (one hand N, other SE). Mixed grid orientations.
  ────────────────────────────────────────
  Level: 5
  Name: Center
  What It Adds: Center point as valid location. New positions (Terra, Tau). New motion types (hash/half-dash, moo, nu)
  ────────────────────────────────────────
  Level: 6
  Name: Interradial
  What It Adds: All 8 orientations at all 9 grid points. Counter-in, counter-out, clock-in, clock-out. Ultimate freedom.
  So levels are orthogonal to types - they stack complexity on top of whatever types you're using.

