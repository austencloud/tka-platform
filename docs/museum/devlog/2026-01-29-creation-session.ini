  ---
  The 2026 Approach: Creative Work as First-Class Items

  Your feedback system already handles:
  - Items with titles, descriptions, types, priorities
  - Status workflow (new → in-progress → in-review → completed → archived)
  - Claims so agents don't step on each other
  - Journals for activity history
  - Subtasks for breaking down work
  - Swim lanes for categorization

  What if museum brainstorming used the same infrastructure?

  Not as "feedback" - but as a parallel collection with the same mechanics. Call it creative or worldbuilding or museum-dev.

  The items aren't bug reports. They're:
  - Story decisions ("Order motivation: protectors vs gatekeepers")
  - Open questions ("Why hasn't the Order silenced Austen?")
  - Design elements ("Wing 6 reveal moment")
  - Session notes (this conversation, linked to the decisions it spawned)

  The workflow:
  - new = idea captured, not yet discussed
  - in-progress = actively being explored in a session
  - in-review = decision made, needs to be integrated into docs
  - completed = integrated into story bible / timeline / etc
  - archived = rejected ideas (kept for history)

  The power moves:

  1. Sessions become claimable items - "Brainstorm: Order motivation" is an item I claim, work on, resolve
  2. Decisions link to their source session - provenance tracked
  3. Open questions are queryable - "What's unresolved?" is a real query
  4. You can attach images - concept art, reference photos, diagrams
  5. Subtasks work - "Order motivation" breaks into "Why fund Bellweather?", "Why not silence Austen?", etc.
  6. I can run /fb-style commands - claim the next creative item, work it, mark it resolved

