  - A brief "look at this weird thing" segment
  - Glow poi at a rave scene

  Nobody has ever built something that treats it as a system worth studying, a culture worth documenting, an art form
  worth the same reverence as dance or music.

  The mere existence of this - a museum, lore, 3D performers, choreography tools - says "this matters." That's the
  emotional payload before anyone even clicks anything.

