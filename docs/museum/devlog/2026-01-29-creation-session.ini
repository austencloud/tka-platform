● What The Industry Says You Should Do Now

  Based on my research, here's the recommended path:

  1. Finish Your Game Design Document (GDD)

  What we've been doing IS pre-production. But it should live in a structured document, not just captured decisions. A
  modern GDD includes:
  - One-pager (elevator pitch)
  - Design pillars (what experiences drive every decision)
  - Core gameplay loop
  - Visual style guide / mood boards
  - Technical specs (what engine, what platform)
  - Content map (all exhibits, their requirements)

  2. Build a Prototype First

  Before a polished "vertical slice," build a crude prototype of one core mechanic to prove it's fun. For you, this
  might be:
  - A single 3D performer doing one sequence in the Vulcan Cave environment
  - No polish, just: does watching a caveman spin feel right?

  3. Then Build a Vertical Slice

  A 5-minute, polished chunk. The Vulcan Cave exhibit from start to finish:
  - Lobby → lighting transition → cave environment
  - Sound design (fire, drums)
  - One serious caveman doing core VTG patterns
  - One plaque with absurd bureaucratic text
  - Exit to next area (even if it's a dead end)

  This tells you: how long does one exhibit take to build? What's hard? What tools do you need?

  4. Asset Inventory

  Before building, know what you have:
  - 3D spinner models (you have these)
  - Environments (do you have cave assets?)
  - Sound effects (do you have fire/drums?)
  - Austen's original sketches (you mentioned these exist)

  ---
  My recommendation: Create a structured GDD from our captured decisions, then build a prototype of the Vulcan Cave.

  Does that path make sense?

