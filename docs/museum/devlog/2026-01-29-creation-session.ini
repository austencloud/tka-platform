● In 10 years you'll wish you had:

  1. Preserved the raw transcripts
  Not summaries. The actual back-and-forth where ideas emerged. We built the tracker for this but haven't attached a single transcript yet. The planning conversation we're having right now should be saved verbatim.

  2. Recorded the "why" behind rejected ideas
  We're capturing decisions, but are we capturing what we didn't do and why? In 10 years, you'll wonder "why didn't we make the Order actual villains?" and the answer exists only in our conversation right now.

  3. Versioned the vision
  The GDD will evolve. The first version should be frozen somewhere so you can see how far it drifted. "Here's what we thought in January 2026" vs "here's what it became."

  4. Kept a media archive from day one
  Every sketch, every voice memo, every napkin drawing. With dates. With context. The feverish original drawings you mentioned - are they photographed? Tagged? Linked to the tracker?

  5. Built the habit of capture
  The tracker is built but we've only used it in one session. If you don't make it frictionless and habitual, you'll have gaps. The best ideas come at 2am or in the shower - do you have a quick capture flow?

  ---
  The HTML viewer is nice-to-have. The archive habit is essential.

