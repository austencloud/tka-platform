<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Stage Formation Explorer</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
  background: #1a1a2e;
  color: #e0e0e0;
  height: 100vh;
  display: grid;
  grid-template-columns: 280px 1fr;
  grid-template-rows: 1fr auto;
  overflow: hidden;
}
.sidebar {
  grid-row: 1 / 3;
  background: #16213e;
  padding: 16px;
  overflow-y: auto;
  border-right: 1px solid #2a2a4a;
}
.sidebar h2 { font-size: 13px; text-transform: uppercase; letter-spacing: 0.5px; color: #8888aa; margin: 16px 0 8px; }
.sidebar h2:first-child { margin-top: 0; }
.canvas-area {
  position: relative;
  display: flex;
  flex-direction: column;
}
canvas {
  flex: 1;
  cursor: crosshair;
}
.prompt-area {
  background: #0f0f23;
  border-top: 1px solid #2a2a4a;
  padding: 12px 16px;
  display: flex;
  gap: 12px;
  align-items: flex-start;
}
.prompt-text {
  flex: 1;
  font-family: 'SF Mono', 'Fira Code', monospace;
  font-size: 12px;
  line-height: 1.5;
  color: #a0d0ff;
  white-space: pre-wrap;
  max-height: 80px;
  overflow-y: auto;
}
.copy-btn {
  background: #2a4a7a;
  color: #fff;
  border: none;
  padding: 6px 14px;
  border-radius: 4px;
  cursor: pointer;
  font-size: 12px;
  white-space: nowrap;
}
.copy-btn:hover { background: #3a5a9a; }
.copy-btn.copied { background: #2a7a4a; }

/* Controls */
.control-group { margin-bottom: 12px; }
.control-group label {
  display: block;
  font-size: 11px;
  color: #8888aa;
  margin-bottom: 4px;
}
.control-group input[type="range"] { width: 100%; }
.control-group select, .control-group input[type="number"] {
  width: 100%;
  background: #1a1a2e;
  color: #e0e0e0;
  border: 1px solid #3a3a5a;
  padding: 4px 8px;
  border-radius: 4px;
  font-size: 12px;
}
.preset-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 6px;
}
.preset-btn {
  background: #2a2a4a;
  color: #c0c0e0;
  border: 1px solid #3a3a5a;
  padding: 6px 8px;
  border-radius: 4px;
  cursor: pointer;
  font-size: 11px;
  text-align: center;
}
.preset-btn:hover { background: #3a3a6a; border-color: #5a5a8a; }
.preset-btn.active { background: #3a5a9a; border-color: #5a8acc; color: #fff; }

.timeline {
  height: 60px;
  background: #0f0f23;
  border-top: 1px solid #2a2a4a;
  position: relative;
  padding: 8px 16px;
}
.timeline-bar {
  height: 4px;
  background: #2a2a4a;
  border-radius: 2px;
  position: relative;
  top: 20px;
}
.beat-marker {
  position: absolute;
  width: 3px;
  height: 16px;
  background: #4a6a9a;
  top: -6px;
  border-radius: 2px;
  cursor: pointer;
}
.beat-marker.has-formation { background: #7acc7a; }
.beat-marker.active { background: #ffaa44; box-shadow: 0 0 6px #ffaa44; }
.playhead {
  position: absolute;
  width: 2px;
  height: 30px;
  background: #ff6644;
  top: -13px;
  transition: left 0.05s linear;
}
.timeline-labels {
  position: absolute;
  bottom: 4px;
  left: 16px;
  right: 16px;
  display: flex;
  justify-content: space-between;
  font-size: 10px;
  color: #6a6a8a;
}
.info-bar {
  position: absolute;
  top: 8px;
  right: 12px;
  font-size: 11px;
  color: #6a8aaa;
  pointer-events: none;
}
.legend {
  display: flex;
  gap: 12px;
  margin-top: 8px;
  flex-wrap: wrap;
}
.legend-item {
  display: flex;
  align-items: center;
  gap: 4px;
  font-size: 10px;
  color: #8888aa;
}
.legend-dot {
  width: 10px;
  height: 10px;
  border-radius: 50%;
}
.toggle-row {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 8px;
}
.toggle-row label { margin: 0; font-size: 12px; color: #c0c0e0; }
.toggle {
  width: 32px;
  height: 18px;
  background: #3a3a5a;
  border-radius: 9px;
  position: relative;
  cursor: pointer;
  transition: background 0.2s;
}
.toggle.on { background: #3a7acc; }
.toggle::after {
  content: '';
  position: absolute;
  width: 14px;
  height: 14px;
  background: #fff;
  border-radius: 50%;
  top: 2px;
  left: 2px;
  transition: left 0.2s;
}
.toggle.on::after { left: 16px; }
</style>
</head>
<body>

<div class="sidebar">
  <h2>Performers</h2>
  <div class="control-group">
    <label>Count: <span id="countLabel">4</span></label>
    <input type="range" id="performerCount" min="1" max="8" value="4">
  </div>

  <h2>Formation Presets</h2>
  <div class="preset-grid">
    <button class="preset-btn active" data-preset="line">Line</button>
    <button class="preset-btn" data-preset="triangle">Triangle</button>
    <button class="preset-btn" data-preset="diamond">Diamond</button>
    <button class="preset-btn" data-preset="circle">Circle</button>
    <button class="preset-btn" data-preset="v-shape">V-Shape</button>
    <button class="preset-btn" data-preset="grid">Grid</button>
    <button class="preset-btn" data-preset="stagger">Stagger</button>
    <button class="preset-btn" data-preset="cluster">Cluster</button>
  </div>

  <h2>Stage</h2>
  <div class="control-group">
    <label>Width (meters): <span id="stageWLabel">10</span></label>
    <input type="range" id="stageWidth" min="4" max="20" value="10">
  </div>
  <div class="control-group">
    <label>Depth (meters): <span id="stageDLabel">8</span></label>
    <input type="range" id="stageDepth" min="4" max="16" value="8">
  </div>

  <h2>Transition</h2>
  <div class="control-group">
    <label>Interpolation</label>
    <select id="interpType">
      <option value="linear">Linear</option>
      <option value="ease">Ease In-Out</option>
      <option value="spline">Catmull-Rom Spline</option>
      <option value="arc">Arc</option>
    </select>
  </div>
  <div class="control-group">
    <label>Duration (beats): <span id="durLabel">4</span></label>
    <input type="range" id="transitionBeats" min="1" max="16" value="4">
  </div>

  <h2>Display</h2>
  <div class="toggle-row">
    <div class="toggle on" id="showPaths"></div>
    <label>Show paths</label>
  </div>
  <div class="toggle-row">
    <div class="toggle on" id="showGhosts"></div>
    <label>Ghost positions</label>
  </div>
  <div class="toggle-row">
    <div class="toggle" id="showFacing"></div>
    <label>Facing arrows</label>
  </div>
  <div class="toggle-row">
    <div class="toggle on" id="showGrid"></div>
    <label>Stage grid</label>
  </div>

  <h2>Playback</h2>
  <div class="control-group">
    <label>BPM: <span id="bpmLabel">120</span></label>
    <input type="range" id="bpm" min="60" max="180" value="120">
  </div>
  <button class="preset-btn" id="playBtn" style="width:100%;margin-top:4px;">Play Transition</button>

  <div class="legend">
    <div class="legend-item"><div class="legend-dot" style="background:#ff6b6b"></div>1</div>
    <div class="legend-item"><div class="legend-dot" style="background:#4ecdc4"></div>2</div>
    <div class="legend-item"><div class="legend-dot" style="background:#ffe66d"></div>3</div>
    <div class="legend-item"><div class="legend-dot" style="background:#a06cd5"></div>4</div>
    <div class="legend-item"><div class="legend-dot" style="background:#ff9a76"></div>5</div>
    <div class="legend-item"><div class="legend-dot" style="background:#6bcf7f"></div>6</div>
    <div class="legend-item"><div class="legend-dot" style="background:#7eb8da"></div>7</div>
    <div class="legend-item"><div class="legend-dot" style="background:#e87ea1"></div>8</div>
  </div>
</div>

<div class="canvas-area">
  <canvas id="stage"></canvas>
  <div class="info-bar" id="info"></div>
  <div class="timeline">
    <div class="timeline-bar" id="timelineBar"></div>
    <div class="timeline-labels" id="timelineLabels"></div>
  </div>
</div>

<div class="prompt-area">
  <div class="prompt-text" id="promptOutput">Drag performers to set formation positions. Use presets or place manually.</div>
  <button class="copy-btn" id="copyBtn">Copy</button>
</div>

<script>
const COLORS = ['#ff6b6b','#4ecdc4','#ffe66d','#a06cd5','#ff9a76','#6bcf7f','#7eb8da','#e87ea1'];
const canvas = document.getElementById('stage');
const ctx = canvas.getContext('2d');

const state = {
  performers: 4,
  stageWidth: 10,
  stageDepth: 8,
  bpm: 120,
  transitionBeats: 4,
  interpType: 'linear',
  showPaths: true,
  showGhosts: true,
  showFacing: false,
  showGrid: true,
  activePreset: 'line',
  formations: [],  // array of formation keyframes
  currentFormation: 0,
  playProgress: 0,
  isPlaying: false,
  dragging: null,
  positions: [],  // current [{x, z, facing}] in meters (stage coords)
};

// Formation presets (normalized 0-1 coordinates)
const PRESETS = {
  line: (n) => Array.from({length: n}, (_, i) => ({
    x: (i + 1) / (n + 1), z: 0.5, facing: 0
  })),
  triangle: (n) => {
    if (n <= 2) return PRESETS.line(n);
    const rows = [];
    let remaining = n, row = 0, perRow = 1;
    while (remaining > 0) {
      const count = Math.min(perRow, remaining);
      for (let i = 0; i < count; i++) {
        rows.push({ x: 0.5 + (i - (count-1)/2) * 0.15, z: 0.3 + row * 0.2, facing: 0 });
      }
      remaining -= count;
      row++;
      perRow++;
    }
    return rows;
  },
  diamond: (n) => {
    const pts = [];
    for (let i = 0; i < n; i++) {
      const a = (i / n) * Math.PI * 2 - Math.PI/2;
      pts.push({ x: 0.5 + Math.cos(a) * 0.25, z: 0.5 + Math.sin(a) * 0.3, facing: 0 });
    }
    return pts;
  },
  circle: (n) => {
    const pts = [];
    for (let i = 0; i < n; i++) {
      const a = (i / n) * Math.PI * 2 - Math.PI/2;
      pts.push({ x: 0.5 + Math.cos(a) * 0.3, z: 0.5 + Math.sin(a) * 0.3, facing: 0 });
    }
    return pts;
  },
  'v-shape': (n) => {
    const pts = [];
    const half = Math.ceil(n / 2);
    for (let i = 0; i < n; i++) {
      const side = i < half ? -1 : 1;
      const idx = i < half ? i : i - half;
      pts.push({
        x: 0.5 + side * (idx + 1) * 0.12,
        z: 0.3 + (idx) * 0.15,
        facing: 0
      });
    }
    return pts;
  },
  grid: (n) => {
    const cols = Math.ceil(Math.sqrt(n));
    const rows = Math.ceil(n / cols);
    const pts = [];
    for (let i = 0; i < n; i++) {
      const r = Math.floor(i / cols);
      const c = i % cols;
      pts.push({
        x: (c + 1) / (cols + 1),
        z: (r + 1) / (rows + 1),
        facing: 0
      });
    }
    return pts;
  },
  stagger: (n) => {
    const pts = [];
    const rows = 2;
    const perRow = Math.ceil(n / rows);
    for (let i = 0; i < n; i++) {
      const r = Math.floor(i / perRow);
      const c = i % perRow;
      const offset = r % 2 === 1 ? 0.06 : 0;
      pts.push({
        x: (c + 1) / (perRow + 1) + offset,
        z: 0.35 + r * 0.3,
        facing: 0
      });
    }
    return pts;
  },
  cluster: (n) => {
    const pts = [];
    for (let i = 0; i < n; i++) {
      const a = (i / n) * Math.PI * 2;
      const r = 0.08 + Math.random() * 0.1;
      pts.push({ x: 0.5 + Math.cos(a) * r, z: 0.5 + Math.sin(a) * r, facing: 0 });
    }
    return pts;
  }
};

function initPositions() {
  const preset = PRESETS[state.activePreset];
  if (preset) {
    const norm = preset(state.performers);
    state.positions = norm.map(p => ({
      x: p.x * state.stageWidth,
      z: p.z * state.stageDepth,
      facing: p.facing
    }));
  }
  // Store as formation keyframe
  if (state.formations.length === 0) {
    state.formations.push({ beat: 0, positions: JSON.parse(JSON.stringify(state.positions)) });
    state.formations.push({ beat: state.transitionBeats, positions: null }); // placeholder
  }
  state.formations[state.currentFormation] = {
    beat: state.formations[state.currentFormation]?.beat || 0,
    positions: JSON.parse(JSON.stringify(state.positions))
  };
}

function resize() {
  canvas.width = canvas.clientWidth * devicePixelRatio;
  canvas.height = canvas.clientHeight * devicePixelRatio;
  ctx.scale(devicePixelRatio, devicePixelRatio);
  draw();
}

function stageToCanvas(x, z) {
  const w = canvas.clientWidth;
  const h = canvas.clientHeight;
  const margin = 40;
  const scaleX = (w - margin * 2) / state.stageWidth;
  const scaleZ = (h - margin * 2) / state.stageDepth;
  const scale = Math.min(scaleX, scaleZ);
  const ox = (w - state.stageWidth * scale) / 2;
  const oz = (h - state.stageDepth * scale) / 2;
  return { cx: ox + x * scale, cy: oz + z * scale, scale };
}

function canvasToStage(cx, cy) {
  const w = canvas.clientWidth;
  const h = canvas.clientHeight;
  const margin = 40;
  const scaleX = (w - margin * 2) / state.stageWidth;
  const scaleZ = (h - margin * 2) / state.stageDepth;
  const scale = Math.min(scaleX, scaleZ);
  const ox = (w - state.stageWidth * scale) / 2;
  const oz = (h - state.stageDepth * scale) / 2;
  return { x: (cx - ox) / scale, z: (cy - oz) / scale };
}

function draw() {
  const w = canvas.clientWidth;
  const h = canvas.clientHeight;
  ctx.clearRect(0, 0, w, h);

  // Stage outline
  const tl = stageToCanvas(0, 0);
  const br = stageToCanvas(state.stageWidth, state.stageDepth);

  // Stage floor
  ctx.fillStyle = '#1e2a3a';
  ctx.fillRect(tl.cx, tl.cy, br.cx - tl.cx, br.cy - tl.cy);
  ctx.strokeStyle = '#3a5a7a';
  ctx.lineWidth = 2;
  ctx.strokeRect(tl.cx, tl.cy, br.cx - tl.cx, br.cy - tl.cy);

  // Audience indicator
  ctx.fillStyle = '#4a4a6a';
  ctx.font = '11px system-ui';
  ctx.textAlign = 'center';
  ctx.fillText('AUDIENCE', (tl.cx + br.cx) / 2, tl.cy - 10);

  // Backstage
  ctx.fillText('BACKSTAGE', (tl.cx + br.cx) / 2, br.cy + 18);

  // Grid
  if (state.showGrid) {
    ctx.strokeStyle = '#2a3a4a';
    ctx.lineWidth = 0.5;
    for (let x = 0; x <= state.stageWidth; x++) {
      const p = stageToCanvas(x, 0);
      const p2 = stageToCanvas(x, state.stageDepth);
      ctx.beginPath(); ctx.moveTo(p.cx, p.cy); ctx.lineTo(p2.cx, p2.cy); ctx.stroke();
    }
    for (let z = 0; z <= state.stageDepth; z++) {
      const p = stageToCanvas(0, z);
      const p2 = stageToCanvas(state.stageWidth, z);
      ctx.beginPath(); ctx.moveTo(p.cx, p.cy); ctx.lineTo(p2.cx, p2.cy); ctx.stroke();
    }
  }

  // Ghost positions (other formation)
  if (state.showGhosts && state.formations.length > 1) {
    const otherIdx = state.currentFormation === 0 ? 1 : 0;
    const other = state.formations[otherIdx];
    if (other && other.positions) {
      other.positions.forEach((p, i) => {
        if (i >= state.performers) return;
        const {cx, cy} = stageToCanvas(p.x, p.z);
        ctx.beginPath();
        ctx.arc(cx, cy, 12, 0, Math.PI * 2);
        ctx.strokeStyle = COLORS[i] + '44';
        ctx.lineWidth = 2;
        ctx.setLineDash([4, 4]);
        ctx.stroke();
        ctx.setLineDash([]);
      });
    }
  }

  // Paths between formations
  if (state.showPaths && state.formations.length > 1) {
    const f0 = state.formations[0];
    const f1 = state.formations[1];
    if (f0?.positions && f1?.positions) {
      for (let i = 0; i < state.performers; i++) {
        if (!f0.positions[i] || !f1.positions[i]) continue;
        const start = stageToCanvas(f0.positions[i].x, f0.positions[i].z);
        const end = stageToCanvas(f1.positions[i].x, f1.positions[i].z);
        ctx.beginPath();
        ctx.strokeStyle = COLORS[i] + '66';
        ctx.lineWidth = 1.5;
        ctx.setLineDash([3, 5]);
        if (state.interpType === 'arc') {
          const mx = (start.cx + end.cx) / 2;
          const my = (start.cy + end.cy) / 2 - 30;
          ctx.moveTo(start.cx, start.cy);
          ctx.quadraticCurveTo(mx, my, end.cx, end.cy);
        } else {
          ctx.moveTo(start.cx, start.cy);
          ctx.lineTo(end.cx, end.cy);
        }
        ctx.stroke();
        ctx.setLineDash([]);
        // Arrow head at end
        const angle = Math.atan2(end.cy - start.cy, end.cx - start.cx);
        ctx.beginPath();
        ctx.moveTo(end.cx - 14 * Math.cos(angle), end.cy - 14 * Math.sin(angle));
        ctx.lineTo(end.cx - 20 * Math.cos(angle - 0.3), end.cy - 20 * Math.sin(angle - 0.3));
        ctx.lineTo(end.cx - 20 * Math.cos(angle + 0.3), end.cy - 20 * Math.sin(angle + 0.3));
        ctx.fillStyle = COLORS[i] + '66';
        ctx.fill();
      }
    }
  }

  // Animated positions during playback
  let drawPositions = state.positions;
  if (state.isPlaying && state.formations[0]?.positions && state.formations[1]?.positions) {
    drawPositions = interpolateFormations(state.playProgress);
  }

  // Performers
  drawPositions.forEach((p, i) => {
    if (i >= state.performers) return;
    const {cx, cy} = stageToCanvas(p.x, p.z);

    // Glow
    ctx.beginPath();
    ctx.arc(cx, cy, 18, 0, Math.PI * 2);
    ctx.fillStyle = COLORS[i] + '22';
    ctx.fill();

    // Body
    ctx.beginPath();
    ctx.arc(cx, cy, 14, 0, Math.PI * 2);
    ctx.fillStyle = COLORS[i];
    ctx.fill();
    ctx.strokeStyle = '#fff3';
    ctx.lineWidth = 1.5;
    ctx.stroke();

    // Number
    ctx.fillStyle = '#000';
    ctx.font = 'bold 11px system-ui';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(i + 1, cx, cy);

    // Facing arrow
    if (state.showFacing) {
      const fa = p.facing || 0;
      ctx.beginPath();
      ctx.moveTo(cx + Math.sin(fa) * 14, cy - Math.cos(fa) * 14);
      ctx.lineTo(cx + Math.sin(fa) * 24, cy - Math.cos(fa) * 24);
      ctx.strokeStyle = COLORS[i];
      ctx.lineWidth = 2;
      ctx.stroke();
    }
  });

  // Distance annotations
  if (state.performers >= 2) {
    let minDist = Infinity;
    for (let i = 0; i < state.performers; i++) {
      for (let j = i + 1; j < state.performers; j++) {
        const dx = drawPositions[i].x - drawPositions[j].x;
        const dz = drawPositions[i].z - drawPositions[j].z;
        const d = Math.sqrt(dx*dx + dz*dz);
        if (d < minDist) minDist = d;
      }
    }
    document.getElementById('info').textContent =
      `Min spacing: ${minDist.toFixed(1)}m | Stage: ${state.stageWidth}x${state.stageDepth}m | Beat ${state.formations[state.currentFormation]?.beat || 0}`;
  }
}

function interpolateFormations(t) {
  const f0 = state.formations[0].positions;
  const f1 = state.formations[1].positions;
  if (!f0 || !f1) return state.positions;

  let eased = t;
  if (state.interpType === 'ease') {
    eased = t < 0.5 ? 2*t*t : 1 - Math.pow(-2*t + 2, 2) / 2;
  }

  return f0.map((p0, i) => {
    const p1 = f1[i] || p0;
    return {
      x: p0.x + (p1.x - p0.x) * eased,
      z: p0.z + (p1.z - p0.z) * eased,
      facing: p0.facing + (p1.facing - p0.facing) * eased
    };
  });
}

// Drag handling
let dragOffset = {x: 0, z: 0};

canvas.addEventListener('mousedown', (e) => {
  const rect = canvas.getBoundingClientRect();
  const mx = e.clientX - rect.left;
  const my = e.clientY - rect.top;

  for (let i = state.performers - 1; i >= 0; i--) {
    const {cx, cy} = stageToCanvas(state.positions[i].x, state.positions[i].z);
    const dx = mx - cx, dy = my - cy;
    if (dx*dx + dy*dy < 20*20) {
      state.dragging = i;
      const stage = canvasToStage(mx, my);
      dragOffset.x = state.positions[i].x - stage.x;
      dragOffset.z = state.positions[i].z - stage.z;
      canvas.style.cursor = 'grabbing';
      return;
    }
  }
});

canvas.addEventListener('mousemove', (e) => {
  if (state.dragging === null) return;
  const rect = canvas.getBoundingClientRect();
  const stage = canvasToStage(e.clientX - rect.left, e.clientY - rect.top);
  state.positions[state.dragging].x = Math.max(0, Math.min(state.stageWidth, stage.x + dragOffset.x));
  state.positions[state.dragging].z = Math.max(0, Math.min(state.stageDepth, stage.z + dragOffset.z));
  state.formations[state.currentFormation].positions = JSON.parse(JSON.stringify(state.positions));
  draw();
  updatePrompt();
});

canvas.addEventListener('mouseup', () => {
  state.dragging = null;
  canvas.style.cursor = 'crosshair';
});

// Playback
let animFrame = null;
let lastTime = 0;

function playTransition() {
  if (!state.formations[0]?.positions || !state.formations[1]?.positions) return;
  state.isPlaying = true;
  state.playProgress = 0;
  lastTime = performance.now();
  document.getElementById('playBtn').textContent = 'Playing...';
  animate();
}

function animate() {
  const now = performance.now();
  const dt = (now - lastTime) / 1000;
  lastTime = now;

  const beatDuration = 60 / state.bpm;
  const totalDuration = state.transitionBeats * beatDuration;
  state.playProgress += dt / totalDuration;

  if (state.playProgress >= 1) {
    state.playProgress = 0;
    state.isPlaying = false;
    document.getElementById('playBtn').textContent = 'Play Transition';
    draw();
    return;
  }

  draw();
  animFrame = requestAnimationFrame(animate);
}

// Timeline
function updateTimeline() {
  const bar = document.getElementById('timelineBar');
  const labels = document.getElementById('timelineLabels');
  const totalBeats = Math.max(state.transitionBeats + 4, 8);

  bar.innerHTML = '';
  labels.innerHTML = '';

  for (let b = 0; b <= totalBeats; b++) {
    const pct = (b / totalBeats) * 100;
    const marker = document.createElement('div');
    marker.className = 'beat-marker';
    marker.style.left = pct + '%';

    // Check if formation exists at this beat
    const hasFormation = state.formations.some(f => f.beat === b && f.positions);
    if (hasFormation) marker.classList.add('has-formation');
    if (state.formations[state.currentFormation]?.beat === b) marker.classList.add('active');

    marker.onclick = () => {
      state.currentFormation = state.formations.findIndex(f => f.beat === b);
      if (state.currentFormation === -1) {
        state.formations.push({ beat: b, positions: JSON.parse(JSON.stringify(state.positions)) });
        state.currentFormation = state.formations.length - 1;
      }
      state.positions = JSON.parse(JSON.stringify(state.formations[state.currentFormation].positions));
      updateTimeline();
      draw();
    };

    bar.appendChild(marker);

    if (b % 4 === 0 || b === totalBeats) {
      const lbl = document.createElement('span');
      lbl.textContent = b;
      lbl.style.position = 'absolute';
      lbl.style.left = pct + '%';
      lbl.style.transform = 'translateX(-50%)';
      labels.appendChild(lbl);
    }
  }
}

function updatePrompt() {
  const parts = [];
  parts.push(`${state.performers} performers on a ${state.stageWidth}x${state.stageDepth}m stage.`);

  if (state.formations[0]?.positions) {
    parts.push(`\nFormation at beat ${state.formations[0].beat}:`);
    state.formations[0].positions.slice(0, state.performers).forEach((p, i) => {
      parts.push(`  P${i+1}: (${p.x.toFixed(1)}, ${p.z.toFixed(1)})`);
    });
  }

  if (state.formations[1]?.positions) {
    parts.push(`\nFormation at beat ${state.formations[1].beat}:`);
    state.formations[1].positions.slice(0, state.performers).forEach((p, i) => {
      parts.push(`  P${i+1}: (${p.x.toFixed(1)}, ${p.z.toFixed(1)})`);
    });
    parts.push(`\nTransition: ${state.interpType}, ${state.transitionBeats} beats at ${state.bpm} BPM`);
  }

  document.getElementById('promptOutput').textContent = parts.join('\n');
}

// Event bindings
document.getElementById('performerCount').oninput = (e) => {
  state.performers = +e.target.value;
  document.getElementById('countLabel').textContent = state.performers;
  initPositions();
  draw();
  updatePrompt();
};

document.getElementById('stageWidth').oninput = (e) => {
  state.stageWidth = +e.target.value;
  document.getElementById('stageWLabel').textContent = state.stageWidth;
  initPositions();
  draw();
  updatePrompt();
};

document.getElementById('stageDepth').oninput = (e) => {
  state.stageDepth = +e.target.value;
  document.getElementById('stageDLabel').textContent = state.stageDepth;
  initPositions();
  draw();
  updatePrompt();
};

document.getElementById('bpm').oninput = (e) => {
  state.bpm = +e.target.value;
  document.getElementById('bpmLabel').textContent = state.bpm;
  updatePrompt();
};

document.getElementById('transitionBeats').oninput = (e) => {
  state.transitionBeats = +e.target.value;
  document.getElementById('durLabel').textContent = state.transitionBeats;
  if (state.formations[1]) state.formations[1].beat = state.transitionBeats;
  updateTimeline();
  updatePrompt();
};

document.getElementById('interpType').onchange = (e) => {
  state.interpType = e.target.value;
  draw();
  updatePrompt();
};

document.querySelectorAll('.preset-btn[data-preset]').forEach(btn => {
  btn.onclick = () => {
    document.querySelectorAll('.preset-btn[data-preset]').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    state.activePreset = btn.dataset.preset;
    initPositions();
    draw();
    updatePrompt();
  };
});

document.getElementById('playBtn').onclick = playTransition;

// Toggles
['showPaths','showGhosts','showFacing','showGrid'].forEach(id => {
  const el = document.getElementById(id);
  el.onclick = () => {
    state[id] = !state[id];
    el.classList.toggle('on');
    draw();
  };
});

// Copy
document.getElementById('copyBtn').onclick = () => {
  navigator.clipboard.writeText(document.getElementById('promptOutput').textContent);
  const btn = document.getElementById('copyBtn');
  btn.textContent = 'Copied!';
  btn.classList.add('copied');
  setTimeout(() => { btn.textContent = 'Copy'; btn.classList.remove('copied'); }, 1500);
};

// Second formation setup - click a preset while holding Shift to set formation 2
document.addEventListener('keydown', (e) => {
  if (e.key === 'Tab') {
    e.preventDefault();
    state.currentFormation = state.currentFormation === 0 ? 1 : 0;
    if (state.formations[state.currentFormation]?.positions) {
      state.positions = JSON.parse(JSON.stringify(state.formations[state.currentFormation].positions));
    }
    updateTimeline();
    draw();
  }
});

// Init
window.addEventListener('resize', resize);
initPositions();
// Set formation 2 to circle for demo
state.formations[1] = {
  beat: state.transitionBeats,
  positions: PRESETS.circle(state.performers).map(p => ({
    x: p.x * state.stageWidth,
    z: p.z * state.stageDepth,
    facing: 0
  }))
};
resize();
updateTimeline();
updatePrompt();
</script>
</body>
