02 Q 543 740 586 734" fill="none" stroke="#fff4d7" stroke-width="7" stroke-linecap="round"/><path d="M 641 802 Q 651 740 608 734" fill="none" stroke="#fff4d7" stroke-width="7" stroke-linecap="round"/><circle cx="634" cy="793" r="9" fill="#ffd38a"/><text x="516" y="840" class="cardTitle"><tspan x="516" dy="0">Twin Choir and Eroded</tspan><tspan x="516" dy="18">Halo alternating across</tspan><tspan x="516" dy="18">the frame</tspan></text><text x="516" y="902" class="cardBody"><tspan x="516" dy="0">The platforms are related but</tspan><tspan x="516" dy="18">not cloned.</tspan></text></g><g><rect x="709" y="672" width="198" height="286" rx="16" fill="#0a2038" stroke="#355f87"/><circle cx="733" cy="696" r="14" fill="#ffd38a"/><text x="733" y="701" text-anchor="middle" class="number">4</text><rect x="727" y="720" width="162" height="92" rx="10" fill="#6f95c5"/><path d="M 764 802 Q 754 740 797 734" fill="none" stroke="#fff4d7" stroke-width="7" stroke-linecap="round"/><path d="M 852 802 Q 862 740 819 734" fill="none" stroke="#fff4d7" stroke-width="7" stroke-linecap="round"/><circle cx="860" cy="743" r="9" fill="#ffd38a"/><text x="727" y="840" class="cardTitle"><tspan x="727" dy="0">Cloud Crown dissolving</tspan><tspan x="727" dy="18">into the far atmosphere</tspan></text><text x="727" y="902" class="cardBody"><tspan x="727" dy="0">The celestial field continues</tspan><tspan x="727" dy="18">beyond readable architecture.</tspan></text></g>

