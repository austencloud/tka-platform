  <line x1="1337.1264367816093" y1="465.40000000000003" x2="1337.1264367816093" y2="275.1" stroke="#19343e" stroke-dasharray="5 5"/>
  <text x="1337.1264367816093" y="474.05" class="small" text-anchor="middle">FRONT CLIFF</text>
  <text x="1010" y="521" class="small">The terrace is the front lip of one substantial shelf. Three distant mesas rise above it; none are architectural.</text>

  <rect x="48" y="590" width="884" height="430" rx="18" fill="#f7f1df" stroke="#b8aa86" stroke-width="2"/>
  <text x="70" y="621" class="panelTitle">3. Five-beat attention sequence</text>
  <text x="70" y="645" class="small">This fixed-camera background uses an implied physical route and a viewer attention sequence.</text>
  <g><rect x="70" y="665" width="158" height="306" rx="14" fill="#fffaf0" stroke="#b8aa86"/><circle cx="92" cy="687" r="13" fill="#f7bd55"/><text x="92" y="692" class="number" text-anchor="middle">1</text><path d="M 105 745 L 149 705 L 193 745" fill="none" stroke="#ead8ad" stroke-width="10"/><path d="M 149 743 L 149 707" stroke="#f7bd55" stroke-width="3"/><text x="85" y="782" class="cardTitle">GROUNDING</text><text x="85" y="810" class="cardBody" text-anchor="start"><tspan x="85" dy="0">The limestone shelf</tspan><tspan x="85" dy="17">continues beyond the</tspan><tspan x="85" dy="17">camera frame.</tspan></text><text x="85" y="897" class="cardNote" text-anchor="start"><tspan x="85" dy="0">This is one location</tspan><tspan x="85" dy="17">on a larger landmass,</tspan><tspan x="85" dy="17">not a display…</tspan></text></g><g><rect x="241" y="665" width="158" height="306" rx="14" fill="#fffaf0" stroke="#b8aa86"/><circle cx="263" cy="687" r="13" fill="#f7bd55"/><text x="263" y="692" class="number" text-anchor="middle">2</text><ellipse cx="320" cy="730" rx="55" ry="19" fill="#ead8ad"/><circle cx="286" cy="711" r="13" fill="#53633f"/><circle cx="354" cy="711" r="13" fill="#53633f"/><text x="256" y="782" class="cardTitle">OPEN STAGE</text><text x="256" y="810" class="cardBody" text-anchor="start"><tspan x="256" dy="0">The broad dry center</tspan><tspan x="256" dy="17">and paired olive</tspan><tspan x="256" dy="17">trees.</tspan></text><text x="256" y="897" class="cardNote" text-anchor="start"><tspan x="256" dy="0">The performer owns the</tspan><tspan x="256" dy="17">foreground.</tspan></text></g><g><rect x="412" y="665" width="158" height="306" rx="14" fill="#fffaf0" stroke="#b8aa86"/><circle cx="434" cy="687" r="13" fill="#f7bd55"/><text x="434" y="692" class="number" text-anchor="middle">3</text><path d="M 437 743 Q 491 707 545 743" fill="#ead8ad"/><ellipse cx="523" cy="731" rx="24" ry="10" fill="#83b5c8"/><text x="427" y="782" class="cardTitle">ONE LAGOON</text><text x="427" y="810" class="cardBody" text-anchor="start"><tspan x="427" dy="0">A single reflective</tspan><tspan x="427" dy="17">pool sits at the</tspan><tspan x="427" dy="17">right edge.</tspan></text><text x="427" y="897" class="cardNote" text-anchor="start"><tspan x="427" dy="0">Water is an accent,</tspan><tspan x="427" dy="17">not the setting.</tspan></text></g><g><rect x="583" y="665" width="158" height="306" rx="14" fill="#fffaf0" stroke="#b8aa86"/><circle cx="605" cy="687" r="13" fill="#f7bd55"/><text x="605" y="692" class="number" text-anchor="middle">4</text><circle cx="662" cy="700" r="13" fill="#f7bd55"/><path d="M 610 745 L 623 715 L 636 745 M 687 745 L 700 708 L 713 745" fill="#ead8ad" stroke="#b8aa86" stroke-width="3"/><text x="598" y="782" class="cardTitle">DEEP SKY</text><text x="598" y="810" class="cardBody" text-anchor="start"><tspan x="598" dy="0">Raised mesas, thin</tspan><tspan x="598" dy="17">falls, and the far</tspan><tspan x="598" dy="17">sun.</tspan></text><text x="598" y="897" class="cardNote" text-anchor="start"><tspan x="598" dy="0">Natural geology</tspan><tspan x="598" dy="17">replaces castle</tspan><tspan x="598" dy="17">architecture.</tspan></text></g><g><rect x="754" y="665" width="158" height="306" rx="14" fill="#fffaf0" stroke="#b8aa86"/><circle cx="776" cy="687" r="13" fill="#f7bd55"/><text x="776" y="692" class="number" text-anchor="middle">5</text><path d="M 779 743 L 833 703 L 887 743" fill="none" stroke="#ead8ad" stroke-width="10"/><path d="M 833 701 L 833 741" stroke="#f7bd55" stroke-width="3"/><text x="769" y="782" class="cardTitle">WHOLE COMPOSITION</text><text x="769" y="810" class="cardBody" text-anchor="start"><tspan x="769" dy="0">The stage, lagoon,</tspan><tspan x="769" dy="17">mesas, clouds, and</tspan><tspan x="769" dy="17">sun settle into one</tspan><tspan x="769" dy="17">view.</tspan></text><text x="769" y="897" class="cardNote" text-anchor="start"><tspan x="769" dy="0">The environment reads</tspan><tspan x="769" dy="17">as a complete</tspan><tspan x="769" dy="17">celestial location…</tspan></text></g>

  <rect x="988" y="590" width="884" height="430" rx="18" fill="#f7f1df" stroke="#b8aa86" stroke-width="2"/>
  <text x="1010" y="621" class="panelTitle">4. Registered sightline study</text>
  <text x="1010" y="645" class="small">Gold dashed boxes protect the performer. Lagoon stays right; trees frame; sun remains far and central.</text>
