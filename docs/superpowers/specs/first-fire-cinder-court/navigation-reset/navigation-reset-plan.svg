15">One lit path at a time: hub ember cairn is the fixed landmark; only the active gate burns red. Dark rock is solid basalt (collision); fire never owns collision.</text><text x="70" y="1116" fill="#8a7a68" font-size="13">Route: Water → hub → DJ canyon slot → hub → EK sunken bowl → hub → FL chimney rotunda → blackout → green growth → Earth. F1–F5 mark the sightline frames.</text></svg>