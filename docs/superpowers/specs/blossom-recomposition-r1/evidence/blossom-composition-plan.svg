      <text x="1038" y="687" class="cardTitle">Default arrival</text>
      <text class="cardBody"><tspan x="1002" y="733">Performers first; Crown A</tspan><tspan x="1002" y="754">frames the left and Crown B</tspan><tspan x="1002" y="775">stays on the far-right</tspan><tspan x="1002" y="796">edge.</tspan></text>
