      <text x="1038" y="877" class="cardTitle">Right orbit</text>
      <text class="cardBody"><tspan x="1002" y="923">The torii reveals beyond</tspan><tspan x="1002" y="944">the stage while the open</tspan><tspan x="1002" y="965">center remains intact.</tspan></text>
    </g>
