      <text class="cardBody"><tspan x="1294" y="923">Two asymmetric crowns</tspan><tspan x="1294" y="944">contain the garden; no</tspan><tspan x="1294" y="965">blossom wall closes the</tspan><tspan x="1294" y="986">horizon.</tspan></text>
