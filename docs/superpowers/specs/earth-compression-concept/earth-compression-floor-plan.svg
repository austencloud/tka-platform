<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1120" role="img" aria-labelledby="title desc" data-plan-width-metres="34" data-plan-depth-metres="24">
  <title id="title">The Weight: Compression proposed Earth room floor plan</title>
  <desc id="desc">A thirty-four by twenty-four metre cave room. The visitor enters from Fire at the middle of the west wall, follows a zigzag route around three massive north-south stone plates, encounters G, H, and I in separate rock-cut habitats, reaches a registration point where all three performers are visible together through aligned fractures, then passes beneath an overhead megalith to the Air exit near the east end of the south wall.</desc>
  <defs>
    <style>
      .bg { fill: #171a18; }
      .sheet { fill: #ede7da; }
      .room { fill: #d8d0c1; stroke: #282c29; stroke-width: 4; }
      .grid { stroke: #b9b09f; stroke-width: 1; }
      .plate { fill: #4b4c45; stroke: #20231f; stroke-width: 4; }
      .plate-edge { fill: none; stroke: #88816f; stroke-width: 2; }
      .habitat { fill: #807861; stroke: #252822; stroke-width: 3; }
      .performer { fill: #e7d6a8; stroke: #282c29; stroke-width: 3; }
      .route-shadow { fill: none; stroke: #f6f1e8; stroke-opacity: .82; stroke-width: 28; stroke-linecap: round; stroke-linejoin: round; }
      .route { fill: none; stroke: #4b8667; stroke-width: 12; stroke-linecap: round; stroke-linejoin: round; }
      .sight { fill: #d5b755; fill-opacity: .15; stroke: #aa8b2d; stroke-width: 2; stroke-dasharray: 9 7; }
      .overhead { fill: #675663; fill-opacity: .46; stroke: #4d3c4a; stroke-width: 4; stroke-dasharray: 14 8; }
      .door { stroke: #ede7da; stroke-width: 14; }
      .title { fill: #ede7da; font: 700 30px system-ui, sans-serif; letter-spacing: .04em; }
      .subtitle { fill: #b9c0b8; font: 400 17px system-ui, sans-serif; }
      .label { fill: #252822; font: 650 18px system-ui, sans-serif; }
      .small { fill: #454940; font: 500 14px system-ui, sans-serif; }
      .tiny { fill: #565b50; font: 500 12px system-ui, sans-serif; }
      .white { fill: #f6f1e8; }
      .number { fill: #171a18; font: 750 15px system-ui, sans-serif; text-anchor: middle; dominant-baseline: central; }
      .number-ring { fill: #e7d6a8; stroke: #282c29; stroke-width: 2; }
      .measure { fill: #8e978c; font: 600 14px system-ui, sans-serif; }
      .callout { fill: #f8f4ea; stroke: #454940; stroke-width: 2; }
    </style>
    <pattern id="metre-grid" width="35" height="35" patternUnits="userSpaceOnUse">
      <path class="grid" d="M35 0H0V35" fill="none" />
    </pattern>
    <pattern id="mass-hatch" width="16" height="16" patternUnits="userSpaceOnUse" patternTransform="rotate(35)">
      <line x1="0" y1="0" x2="0" y2="16" stroke="#b89bad" stroke-width="5" stroke-opacity=".55" />
    </pattern>
    <marker id="route-arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#4b8667" />
    </marker>
    <marker id="north-arrow" markerWidth="10" markerHeight="10" refX="5" refY="2" orient="auto">
      <path d="M0 10L5 0L10 10Z" fill="#ede7da" />
    </marker>
  </defs>

  <rect class="bg" width="1600" height="1120" />
  <text class="title" x="90" y="54">EARTH REIMAGINING A · THE WEIGHT: COMPRESSION</text>
  <text class="subtitle" x="90" y="82">34 × 24 m existing footprint · Fire west entry · Air south-east exit · proposal, not approved</text>

  <!-- The real 34 x 24 metre Earth footprint, 35 px per metre. -->
  <g id="plan" transform="translate(180 120)">
    <rect class="room" x="0" y="0" width="1190" height="840" rx="8" />
    <rect x="0" y="0" width="1190" height="840" fill="url(#metre-grid)" opacity=".58" />

    <!-- Door openings: local (0, 12 m) and (33.5 m, 24 m). -->
    <line class="door" x1="0" y1="385" x2="0" y2="455" />
    <line class="door" x1="1138" y1="840" x2="1200" y2="840" />

    <!-- Three major strata plates. Their alternating reach produces the S route. -->
    <g id="plate-g">
      <path class="plate" d="M238 44 L350 58 L385 584 L270 610 Z" />
      <path class="plate-edge" d="M270 82 L328 90 M282 170 L342 178 M298 520 L370 504" />
      <path class="habitat" d="M335 270 Q406 286 414 342 Q397 402 345 412 L321 384 L319 296 Z" />
      <circle class="performer" cx="359" cy="341" r="16" />
      <text class="label" x="359" y="347" text-anchor="middle">G</text>
    </g>

    <g id="plate-h">
      <path class="plate" d="M516 230 L625 196 L770 786 L650 818 Z" />
      <path class="plate-edge" d="M552 276 L636 256 M592 438 L684 420 M650 686 L738 664" />
      <path class="habitat" d="M624 350 Q700 348 728 405 Q717 470 666 495 L626 468 L606 390 Z" />
      <circle class="performer" cx="664" cy="417" r="16" />
      <text class="label" x="664" y="423" text-anchor="middle">H</text>
    </g>

    <g id="plate-i">
      <path class="plate" d="M810 42 L924 70 L934 580 L820 620 Z" />
      <path class="plate-edge" d="M844 92 L908 106 M846 222 L918 232 M848 522 L922 502" />
      <path class="habitat" d="M900 430 Q978 418 1010 468 Q1002 529 947 551 L900 526 L881 462 Z" />
      <circle class="performer" cx="946" cy="480" r="16" />
      <text class="label" x="946" y="486" text-anchor="middle">I</text>
    </g>

    <!-- The last route segment passes beneath this mass; footprint is overhead only. -->
    <path class="overhead" d="M1018 596 L1188 572 L1190 840 L1038 840 L1000 718 Z" />
    <path d="M1018 596 L1188 572 L1190 840 L1038 840 L1000 718 Z" fill="url(#mass-hatch)" opacity=".65" />

    <!-- The route is deliberately long enough to encounter each habitat separately. -->
    <path class="route-shadow" d="M0 420 L150 420 L178 690 L438 710 L454 130 L736 116 L766 716 L1035 710 L1088 560 L1080 420 L1160 840" />
    <path class="route" d="M0 420 L150 420 L178 690 L438 710 L454 130 L736 116 L766 716 L1035 710 L1088 560 L1080 420 L1160 840" marker-end="url(#route-arrow)" />

    <!-- Final ensemble registration cone. -->
    <path class="sight" d="M1080 420 L359 341 L664 417 L946 480 Z" />
    <circle cx="1080" cy="420" r="23" fill="#aa8b2d" stroke="#282c29" stroke-width="4" />
    <path d="M1068 420L1092 420M1080 408L1080 432" stroke="#f8f4ea" stroke-width="4" />

    <!-- Numbered beats. -->
    <g><circle class="number-ring" cx="118" cy="390" r="17" /><text class="number" x="118" y="390">1</text></g>
    <g><circle class="number-ring" cx="405" cy="365" r="17" /><text class="number" x="405" y="365">2</text></g>
    <g><circle class="number-ring" cx="712" cy="438" r="17" /><text class="number" x="712" y="438">3</text></g>
    <g><circle class="number-ring" cx="994" cy="510" r="17" /><text class="number" x="994" y="510">4</text></g>
    <g><circle class="number-ring" cx="1118" cy="392" r="17" /><text class="number" x="1118" y="392">5</text></g>
    <g><circle class="number-ring" cx="1090" cy="700" r="17" /><text class="number" x="1090" y="700">6</text></g>

    <text class="label white" x="-38" y="408" text-anchor="end">FIRE</text>
    <text class="subtitle" x="-38" y="430" text-anchor="end">green seam</text>
    <text class="label" x="1118" y="814" text-anchor="middle">AIR EXIT</text>

    <text class="small" x="302" y="34" text-anchor="middle">STRATUM G</text>
    <text class="small" x="644" y="182" text-anchor="middle">STRATUM H</text>
    <text class="small" x="868" y="32" text-anchor="middle">STRATUM I</text>
    <text class="small" x="1080" y="380" text-anchor="middle">REGISTRATION POINT</text>
    <text class="tiny" x="1080" y="454" text-anchor="middle">turn west: G + H + I share one frame</text>
    <text class="small" x="1090" y="742" text-anchor="middle">OVERHEAD MASS</text>
    <text class="tiny" x="1090" y="762" text-anchor="middle">walk beneath it</text>

    <!-- Scale and north. -->
    <g transform="translate(22 782)">
      <path d="M0 0H175" stroke="#282c29" stroke-width="5" />
      <path d="M0 -10V10M175 -10V10" stroke="#282c29" stroke-width="4" />
      <text class="small" x="88" y="-14" text-anchor="middle">5 m</text>
    </g>
    <g transform="translate(1125 55)">
      <path d="M0 42V0" stroke="#282c29" stroke-width="4" marker-end="url(#north-arrow)" />
      <text class="label" x="0" y="67" text-anchor="middle">N</text>
    </g>
  </g>

  <!-- Reading key. -->
  <g transform="translate(90 1054)">
    <rect class="callout" x="0" y="-3" width="1420" height="42" rx="8" />
    <text class="small" x="20" y="23"><tspan font-weight="750">1</tspan> compression cleft</text>
    <text class="small" x="215" y="23"><tspan font-weight="750">2–4</tspan> close performer encounters</text>
    <text class="small" x="520" y="23"><tspan font-weight="750">5</tspan> forced turn + ensemble reveal</text>
    <text class="small" x="850" y="23"><tspan font-weight="750">6</tspan> pass under the heaviest slab</text>
    <text class="small" x="1170" y="23">green line = player route</text>
  </g>
</svg>
