<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>%sveltekit.error.message%</title>

    <style>
      body {
        --bg: white;
        --fg: #222;
        --divider: #ccc;
        background: var(--bg);
        color: var(--fg);
        font-family:
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          Roboto,
          Oxygen,
          Ubuntu,
          Cantarell,
          "Open Sans",
          "Helvetica Neue",
          sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        margin: 0;
      }

      .error {
        display: flex;
        align-items: center;
        max-width: 32rem;
        margin: 0 1rem;
      }

      .status {
        font-weight: 200;
        font-size: 3rem;
        line-height: 1;
        position: relative;
        top: -0.05rem;
      }

      .message {
        border-left: 1px solid var(--divider);
        padding: 0 0 0 1rem;
        margin: 0 0 0 1rem;
        min-height: 2.5rem;
        display: flex;
        align-items: center;
      }

      .message h1 {
        font-weight: 400;
        font-size: 1rem;
        margin: 0;
      }

      @media (prefers-color-scheme: dark) {
        body {
          --bg: #222;
          --fg: #ddd;
          --divider: #666;
        }
      }
    </style>
    <script type="module" src="/svelte-kit-dev-error-recovery.js"></script>
  </head>
  <body>
    <div class="error">
      <span class="status" data-error-status>%sveltekit.status%</span>
      <div class="message">
        <h1 data-error-message>%sveltekit.error.message%</h1>
      </div>
    </div>
  </body>
</html>
