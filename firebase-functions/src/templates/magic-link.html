<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Your Flow Arts Composer sign-in code</title>
  </head>
  <body
    style="
      margin: 0;
      padding: 0;
      background-color: #0f0f1a;
      font-family:
        -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, Roboto,
        &quot;Helvetica Neue&quot;, Arial, sans-serif;
    "
  >
    <table
      role="presentation"
      width="100%"
      cellspacing="0"
      cellpadding="0"
      style="background-color: #0f0f1a"
    >
      <tr>
        <td align="center" style="padding: 40px 20px">
          <table
            role="presentation"
            width="100%"
            cellspacing="0"
            cellpadding="0"
            style="
              max-width: 480px;
              background: linear-gradient(135deg, #1a1a2e 0%, #16162a 100%);
              border-radius: 16px;
              border: 1px solid rgba(139, 92, 246, 0.2);
            "
          >
            <!-- Header with Logo -->
            <tr>
              <td align="center" style="padding: 40px 40px 24px 40px">
                <div
                  style="
                    width: 64px;
                    height: 64px;
                    background: linear-gradient(
                      135deg,
                      rgba(139, 92, 246, 0.2) 0%,
                      rgba(139, 92, 246, 0.1) 100%
                    );
                    border-radius: 16px;
                    display: inline-block;
                    line-height: 64px;
                    font-size: 28px;
                  "
                >
                  &#10024;
                </div>
                <h1
                  style="
                    margin: 24px 0 0 0;
                    font-size: 24px;
                    font-weight: 700;
                    color: #ffffff;
                  "
                >
                  Flow Arts Composer
                </h1>
              </td>
            </tr>

            <!-- Main Content -->
            <tr>
              <td style="padding: 0 40px 32px 40px">
                <p
                  style="
                    margin: 0 0 24px 0;
                    font-size: 16px;
                    line-height: 1.6;
                    color: rgba(255, 255, 255, 0.8);
                    text-align: center;
                  "
                >
                  Your sign-in code
                </p>

                <div
                  style="
                    padding: 18px;
                    color: #ffffff;
                    background: rgba(139, 92, 246, 0.14);
                    border: 1px solid rgba(139, 92, 246, 0.4);
                    border-radius: 8px;
                    font-family:
                      ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas,
                      monospace;
                    font-size: 32px;
                    font-weight: 700;
                    letter-spacing: 0.28em;
                    text-align: center;
                  "
                >
                  {{ONE_TIME_CODE}}
                </div>

                <p
                  style="
                    margin: 18px 0 26px 0;
                    font-size: 16px;
                    line-height: 1.55;
                    color: rgba(255, 255, 255, 0.8);
                    text-align: center;
                  "
                >
                  Return to Flow Arts Composer and enter the code. It expires in
                  30 minutes.
                </p>

                <p
                  style="
                    margin: 0 0 12px 0;
                    font-size: 13px;
                    line-height: 1.5;
                    color: rgba(255, 255, 255, 0.58);
                    text-align: center;
                  "
                >
                  Signing in in a web browser instead?
                </p>

                <!-- Browser fallback -->
                <table
                  role="presentation"
                  width="100%"
                  cellspacing="0"
                  cellpadding="0"
                >
                  <tr>
                    <td align="center">
                      <a
                        href="{{MAGIC_LINK}}"
                        target="_blank"
                        style="
                          display: inline-block;
                          padding: 12px 24px;
                          color: #ffffff;
                          background: rgba(255, 255, 255, 0.08);
                          border: 1px solid rgba(255, 255, 255, 0.18);
                          border-radius: 8px;
                          font-size: 14px;
                          font-weight: 600;
                          text-decoration: none;
                        "
                      >
                        Sign in in a browser
                      </a>
                    </td>
                  </tr>
                </table>
              </td>
            </tr>

            <!-- Divider -->
            <tr>
              <td style="padding: 0 40px">
                <div
                  style="height: 1px; background: rgba(139, 92, 246, 0.15)"
                ></div>
              </td>
            </tr>

            <!-- Footer -->
            <tr>
              <td style="padding: 24px 40px 40px 40px">
                <p
                  style="
                    margin: 0;
                    font-size: 13px;
                    line-height: 1.5;
                    color: rgba(255, 255, 255, 0.4);
                    text-align: center;
                  "
                >
                  Didn't request this? Just ignore it.
                </p>
                <p
                  style="
                    margin: 16px 0 0 0;
                    font-size: 12px;
                    color: rgba(255, 255, 255, 0.3);
                    text-align: center;
                  "
                >
                  <a
                    href="https://tkaflowarts.com"
                    style="
                      color: rgba(139, 92, 246, 0.6);
                      text-decoration: none;
                    "
                    >tkaflowarts.com</a
                  >
                </p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
