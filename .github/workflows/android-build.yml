name: Android Build

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Create .env from .env.example
        run: cp .env.example .env

      - name: Build web app (PWA disabled)
        env:
          DISABLE_PWA: "true"
        run: pnpm run build

      - name: Verify native release surface
        run: node scripts/verify-native-release-surface.mjs

      - name: Trim heavy assets for lean mobile bundle
        run: |
          DIR=.svelte-kit/cloudflare
          echo "Before trim: $(du -sh "$DIR" | cut -f1)"
          # 3D scene models, museum assets, downloadable guide PDFs, and
          # character animation packs are streamed from the CDN on the web and
          # don't belong inside the APK — bundling them blew past Play's 200MB
          # download cap. The interactive guide/ learn content stays. The SSR
          # worker + Cloudflare routing files are dead weight in the native shell.
          rm -rf "$DIR/models" "$DIR/assets/museum" "$DIR/guides" "$DIR/animations"
          rm -f "$DIR/_worker.js" "$DIR/_routes.json" "$DIR/_headers" "$DIR/_redirects"
          echo "After trim:  $(du -sh "$DIR" | cut -f1)"

      - name: Generate native public env (_app/env.js)
        # adapter-cloudflare serves $env/dynamic/public from the Worker at
        # runtime (GET /_app/env.js). The trim step above deletes _worker.js, and
        # the native shell has no Worker regardless — so without a STATIC
        # _app/env.js the client's dynamic import 404s and ALL hydration dies
        # (the app renders prerendered HTML but is frozen — no interactivity, no
        # native boot-into-app). Materialize it from the PUBLIC_* vars. Must run
        # after Trim and before cap sync.
        run: node scripts/generate-native-env.mjs

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 -d > android/app/release.keystore

      - name: Build release AAB
        working-directory: android
        env:
          KEYSTORE_PATH: release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew bundleRelease

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 30
