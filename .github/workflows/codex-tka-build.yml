name: Build Codex TKA

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/codex-tka-build.yml
      - launchers/install-codex-tka.ps1
      - patches/codex-tka-status-bars.patch
  workflow_dispatch:
    inputs:
      publish_release:
        description: Publish or replace the pinned codex-tka release assets
        required: true
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  windows-x64:
    runs-on: windows-2025
    # A clean hosted runner compiles both the targeted tests and release binary.
    # Codex 0.145.0 exceeded the previous 90-minute limit during release linking.
    timeout-minutes: 180

    steps:
      - uses: actions/checkout@v4

      - name: Build and verify the pinned Codex patch
        shell: pwsh
        run: ./launchers/install-codex-tka.ps1 -SourceBuild -Force

      - name: Package the side-by-side executable
        shell: pwsh
        run: |
          $out = Join-Path $env:RUNNER_TEMP 'codex-tka-package'
          New-Item -ItemType Directory -Path $out | Out-Null
          Copy-Item "$env:LOCALAPPDATA\TKA\codex-tka\bin\codex-tka.exe" $out
          Copy-Item "$env:LOCALAPPDATA\TKA\codex-tka\bin\codex-tka.json" $out
          Compress-Archive -Path "$out\*" -DestinationPath codex-tka-windows-x64.zip
          $hash = (Get-FileHash codex-tka-windows-x64.zip -Algorithm SHA256).Hash
          "$hash  codex-tka-windows-x64.zip" | Set-Content codex-tka-windows-x64.zip.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: codex-tka-windows-x64
          path: |
            codex-tka-windows-x64.zip
            codex-tka-windows-x64.zip.sha256
          if-no-files-found: error

      - name: Publish pinned release assets
        if: github.event_name == 'push' || inputs.publish_release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $tag = 'codex-tka-v0.146.0'
          gh release view $tag 2>$null
          if ($LASTEXITCODE -ne 0) {
            $notes = @'
          OpenAI Codex 0.146.0 with TKA's colored usage meters, generated names for bare `/rename`, exact manual terminal titles, and direct slash aliases for enabled skills.

          Upstream 0.146.0 adds names for `/new` and `/clear` sessions, thread pinning, paginated and temporary forks, Agent Plugins manifests, remote Code Mode over WebSocket, wider proxy coverage, live MCP and Apps refresh, Windows navigation and process-tree fixes, and better skill retention when context is tight.

          Full upstream notes: https://github.com/openai/codex/releases/tag/rust-v0.146.0
          '@
            gh release create $tag --title 'Codex TKA 0.146.0' --notes $notes
          }
          gh release upload $tag codex-tka-windows-x64.zip codex-tka-windows-x64.zip.sha256 --clobber
