name: Web App CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "desktop/**"
      - "docs/**"
      - "*.md"
  pull_request:
    branches: [main]
    paths-ignore:
      - "desktop/**"
      - "docs/**"
      - "*.md"

jobs:
  validate:
    name: Type Check, Test, Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Create .env from .env.example
        run: cp .env.example .env

      - name: Build workspace packages
        run: pnpm run build:packages

      - name: Type check (svelte-check)
        run: pnpm run check

      - name: Unit tests (Vitest)
        run: pnpm run test -- --run

      - name: Build
        run: pnpm run build

      # Unit tests prove the code; this proves the artifact. Catches the class
      # of bug where the build/trim pipeline eats part of the offline kit
      # (missing precache manifest, sw.js not copied, fonts trimmed) — invisible
      # to every test above because the code is fine.
      - name: Verify offline kit in build artifact
        run: pnpm run verify:offline

      # A red run on main is also a PRODUCTION OUTAGE, and that half is silent.
      # Deploy Pages (gated) fires on workflow_run and exits `skipped` when the
      # conclusion isn't success — no failure, no notification, just an absent
      # deploy. tkaflowarts.com then serves the last green build indefinitely
      # while main moves on. That has now happened twice (2026-08-04: five days
      # of commits stranded behind one jsdom Blob failure).
      #
      # Nothing here changes the gate. It makes the consequence legible in the
      # failure the developer is already looking at.
      - name: Say that production did not deploy
        if: failure() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          echo "::error title=Production did NOT deploy::Web App CI failed on main, so Deploy Pages (gated) will skip and Cloudflare is never triggered. tkaflowarts.com keeps serving the last green build until this run is fixed and main is green again."
          {
            echo "## :rotating_light: Production did NOT deploy"
            echo
            echo "This run failed on \`main\`. \`Deploy Pages (gated)\` only fires the Cloudflare"
            echo "Deploy Hook when Web App CI concludes \`success\`, so it will exit \`skipped\`"
            echo "and **no production build is queued**."
            echo
            echo "\`tkaflowarts.com\` is serving the last green build — every commit on \`main\`"
            echo "since then is stranded, not just this one."
            echo
            echo "Fix this run and push; the deploy triggers itself once \`main\` is green."
          } >> "$GITHUB_STEP_SUMMARY"

  component-tests:
    name: Component Tests (browser)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Create .env from .env.example
        run: cp .env.example .env

      - name: Build workspace packages
        run: pnpm run build:packages

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Component tests (Vitest browser mode)
        timeout-minutes: 5
        run: pnpm run test:components:ci
        continue-on-error: true # The broader component suite is still being hardened.

      - name: Critical QR regressions
        run: pnpm run test:qr-critical:components
