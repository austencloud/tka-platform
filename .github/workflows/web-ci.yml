name: Web App CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "desktop/**"
      - "docs/**"
      - "*.md"
  pull_request:
    branches: [main]
    paths-ignore:
      - "desktop/**"
      - "docs/**"
      - "*.md"

jobs:
  validate:
    name: Type Check, Test, Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Create .env from .env.example
        run: cp .env.example .env

      - name: Build workspace packages
        run: pnpm run build:packages

      - name: Type check (svelte-check)
        run: pnpm run check

      - name: Unit tests (Vitest)
        run: pnpm run test -- --run

      - name: Build
        run: pnpm run build

      # Unit tests prove the code; this proves the artifact. Catches the class
      # of bug where the build/trim pipeline eats part of the offline kit
      # (missing precache manifest, sw.js not copied, fonts trimmed) — invisible
      # to every test above because the code is fine.
      - name: Verify offline kit in build artifact
        run: pnpm run verify:offline

  component-tests:
    name: Component Tests (browser)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Create .env from .env.example
        run: cp .env.example .env

      - name: Build workspace packages
        run: pnpm run build:packages

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Component tests (Vitest browser mode)
        run: pnpm run test:components:ci
        continue-on-error: true # The broader component suite is still being hardened.

      - name: Critical QR regressions
        run: pnpm run test:qr-critical:components
