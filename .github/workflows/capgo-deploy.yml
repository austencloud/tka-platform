name: Deploy OTA Update

# Never ships code that has not passed CI. This fires only after "Web App CI"
# completes on main, and the job below refuses to run unless that run succeeded.
# Previously this triggered directly on push, so a red test suite still shipped
# an OTA bundle to production users.
on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Web App CI"]
    types: [completed]
    branches: [main]

concurrency:
  group: capgo-ota-production
  cancel-in-progress: false

jobs:
  deploy-ota:
    name: Build & Push to Capgo
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # workflow_run fires on failure too; only a green CI run may deploy.
    # Manual dispatch stays available as the escape hatch.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # workflow_run defaults to the default branch tip, which may already
          # have moved past the commit CI actually validated. Pin to the exact
          # SHA that passed.
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Create .env from .env.example
        run: cp .env.example .env

      - name: Build web app
        run: pnpm run build

      - name: Upload bundle to Capgo
        run: npx @capgo/cli bundle upload --channel production --no-code-check --apikey ${{ secrets.CAPGO_API_KEY }}
