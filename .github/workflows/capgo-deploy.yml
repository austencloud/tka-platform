name: Deploy OTA Update

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "static/**"
      - "packages/**"
      - "svelte.config.js"
      - "vite.config.ts"
      - "package.json"

jobs:
  deploy-ota:
    name: Build & Push to Capgo
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Create .env from .env.example
        run: cp .env.example .env

      - name: Build web app
        run: pnpm run build

      - name: Upload bundle to Capgo
        run: npx @capgo/cli bundle upload --channel production --apikey ${{ secrets.CAPGO_API_KEY }}
