<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TKA Letter A - Egyptian Hieroglyph</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #2a1f0e;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-family: serif;
    }
    canvas {
      display: block;
      image-rendering: pixelated;
    }
    .caption {
      color: #C5A54E;
      font-size: 13px;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      margin-top: 14px;
      opacity: 0.7;
    }
      body.embed { min-height: 0; padding: 0; margin: 0; display: block; }
    body.embed canvas { width: 100%; height: auto; }
    body.embed .caption, body.embed .controls, body.embed .scene > :not(canvas) { display: none; }
  </style>
</head>
<body>
  <canvas id="canvas" width="500" height="500"></canvas>
  <div class="caption">TKA Letter A · Egyptian Scribe · c. 3000 BC</div>

  <script src="./_shared/pictograph-geometry.js"></script>
  <script src="./_shared/pictograph-bridge.js"></script>
  <script src="./_shared/pictograph-stylize.js"></script>
  <script>
  (function () {
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const W = 500, H = 500;

    // ─── Palette ─────────────────────────────────────────────────────────────
    const SAND_LIGHT    = '#D9B97A';
    const SAND_MID      = '#C4A05C';
    const SAND_DARK     = '#A07840';
    const PAPYRUS_GRAIN = '#B8904A';
    const BLACK         = '#1A0F00';
    const LAPIS         = '#2E5090';   // Egyptian blue (blue staff / hand)
    const VERMILLION    = '#C13B2A';   // Egyptian red (red staff / hand)
    const GOLD          = '#C5A54E';
    const GOLD_DARK     = '#8B6914';
    const CREAM         = '#EDD9A0';
    const SHADOW        = 'rgba(26,15,0,0.35)';

    // ─── Canonical-compose palette (Path 1 pipeline) ─────────────────────────
    // Maps the canonical pictograph's class colors onto the era's pigments.
    // When a parent posts a canonical bitmap via PictographBridge, we recolor
    // it with these values instead of redrawing the pictograph from scratch.
    const EGYPTIAN_PALETTE = {
      blue:       LAPIS,       // #2E5090
      red:        VERMILLION,  // #C13B2A
      structural: BLACK,       // #1A0F00
      bg:         null,        // transparent - sandstone shows through
    };

    // ─── Sandstone background with texture ───────────────────────────────────
    function drawBackground() {
      // Base warm sand gradient
      const bg = ctx.createLinearGradient(0, 0, W, H);
      bg.addColorStop(0,    '#D2AA6A');
      bg.addColorStop(0.3,  '#C4985C');
      bg.addColorStop(0.65, '#CEAA72');
      bg.addColorStop(1,    '#BA8F50');
      ctx.fillStyle = bg;
      ctx.fillRect(0, 0, W, H);

      // Papyrus / stone grain lines - horizontal striations
      ctx.save();
      ctx.globalAlpha = 0.08;
      for (let y = 0; y < H; y += 3) {
        const noise = Math.sin(y * 0.7) * 2 + Math.cos(y * 0.31) * 1.5;
        ctx.strokeStyle = (y % 6 < 3) ? '#8B6000' : '#E8CC80';
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(0, y + noise);
        ctx.lineTo(W, y + noise * 0.6);
        ctx.stroke();
      }
      ctx.restore();

      // Scattered grain specks
      ctx.save();
      ctx.globalAlpha = 0.06;
      const seedX = [23, 77, 134, 198, 256, 311, 378, 423, 467, 12, 89, 145, 203, 267, 324, 389, 431, 478, 55, 112, 166, 222, 287, 345, 401, 451, 489];
      const seedY = [18, 45, 88, 133, 176, 221, 267, 312, 358, 401, 447, 482, 29, 74, 119, 164, 209, 254, 299, 344, 389, 434, 479, 38, 83, 128, 173, 218, 263, 308, 353, 398, 443, 488];
      for (let i = 0; i < 200; i++) {
        const sx = seedX[i % seedX.length] * ((i * 17 + 3) % 7) % W;
        const sy = seedY[i % seedY.length] * ((i * 13 + 5) % 5) % H;
        ctx.fillStyle = (i % 3 === 0) ? '#6B4400' : '#F0D080';
        ctx.fillRect(sx, sy, 1, 1);
      }
      ctx.restore();
    }

    // ─── Outer decorative border band ────────────────────────────────────────
    function drawOuterBorder() {
      const margin = 14;
      const bw = 18; // band width

      // Outer rectangle - thick gold frame
      ctx.save();
      ctx.strokeStyle = BLACK;
      ctx.lineWidth = 2;

      // Band fill
      ctx.fillStyle = GOLD_DARK;
      ctx.fillRect(margin, margin, W - margin*2, bw);                     // top
      ctx.fillRect(margin, H - margin - bw, W - margin*2, bw);            // bottom
      ctx.fillRect(margin, margin, bw, H - margin*2);                      // left
      ctx.fillRect(W - margin - bw, margin, bw, H - margin*2);            // right

      // Gold band outlines
      ctx.strokeRect(margin, margin, W - margin*2, bw);
      ctx.strokeRect(margin, H - margin - bw, W - margin*2, bw);
      ctx.strokeRect(margin, margin, bw, H - margin*2);
      ctx.strokeRect(W - margin - bw, margin, bw, H - margin*2);

      // Decorative repeating ankh/lotus pattern along top band
      drawBandPattern(margin + bw, margin, W - margin*2 - bw*2, bw, 'horizontal');
      drawBandPattern(margin + bw, H - margin - bw, W - margin*2 - bw*2, bw, 'horizontal');
      drawBandPattern(margin, margin + bw, bw, H - margin*2 - bw*2, 'vertical');
      drawBandPattern(W - margin - bw, margin + bw, bw, H - margin*2 - bw*2, 'vertical');

      // Corner squares - gold filled
      ctx.fillStyle = GOLD;
      ctx.fillRect(margin, margin, bw, bw);
      ctx.fillRect(W - margin - bw, margin, bw, bw);
      ctx.fillRect(margin, H - margin - bw, bw, bw);
      ctx.fillRect(W - margin - bw, H - margin - bw, bw, bw);

      // Corner rosettes
      drawRosette(margin + bw/2, margin + bw/2, 6);
      drawRosette(W - margin - bw/2, margin + bw/2, 6);
      drawRosette(margin + bw/2, H - margin - bw/2, 6);
      drawRosette(W - margin - bw/2, H - margin - bw/2, 6);

      // Inner border line
      const inner = margin + bw + 4;
      ctx.strokeStyle = BLACK;
      ctx.lineWidth = 1.5;
      ctx.strokeRect(inner, inner, W - inner*2, H - inner*2);
      ctx.restore();
    }

    function drawBandPattern(x, y, w, h, dir) {
      const isH = dir === 'horizontal';
      const step = isH ? h : w;
      const count = Math.floor((isH ? w : h) / step);
      ctx.save();
      for (let i = 0; i < count; i++) {
        const cx = isH ? x + i * step + step/2 : x + w/2;
        const cy = isH ? y + h/2 : y + i * step + step/2;
        // Small ankh cross
        ctx.fillStyle = GOLD;
        ctx.strokeStyle = BLACK;
        ctx.lineWidth = 0.8;
        // Loop top of ankh
        ctx.beginPath();
        ctx.ellipse(cx, cy - 2, 3, 3.5, 0, 0, Math.PI * 2);
        ctx.fillStyle = CREAM;
        ctx.fill();
        ctx.stroke();
        // Cross stem
        ctx.fillStyle = CREAM;
        ctx.fillRect(cx - 1, cy + 1, 2, 4.5);
        ctx.strokeRect(cx - 1, cy + 1, 2, 4.5);
        // Cross arms
        ctx.fillRect(cx - 3.5, cy + 1, 7, 2);
        ctx.strokeRect(cx - 3.5, cy + 1, 7, 2);
      }
      ctx.restore();
    }

    // ─── Cartouche for the letter A ───────────────────────────────────────────
    function drawCartouche() {
      const cx = 250, cy = 68;
      const rx = 44, ry = 20;
      const lw = 3;

      ctx.save();
      ctx.shadowColor = 'rgba(0,0,0,0.4)';
      ctx.shadowBlur = 4;
      ctx.shadowOffsetY = 2;

      // Cartouche fill
      const cartFill = ctx.createLinearGradient(cx - rx, cy - ry, cx + rx, cy + ry);
      cartFill.addColorStop(0, '#E8CC80');
      cartFill.addColorStop(1, '#C5A54E');
      ctx.fillStyle = cartFill;

      // Oval
      ctx.beginPath();
      ctx.ellipse(cx, cy, rx, ry, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = BLACK;
      ctx.lineWidth = lw;
      ctx.stroke();

      // Cartouche base bar
      ctx.fillStyle = GOLD;
      ctx.fillRect(cx - rx, cy + ry - 1, rx * 2, lw + 2);
      ctx.strokeStyle = BLACK;
      ctx.lineWidth = 1;
      ctx.strokeRect(cx - rx, cy + ry - 1, rx * 2, lw + 2);

      // Vertical binding lines (left/right of base)
      ctx.lineWidth = lw;
      ctx.strokeStyle = BLACK;
      ctx.beginPath();
      ctx.moveTo(cx - rx, cy + ry - 1);
      ctx.lineTo(cx - rx, cy + ry + lw + 2);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(cx + rx, cy + ry - 1);
      ctx.lineTo(cx + rx, cy + ry + lw + 2);
      ctx.stroke();

      ctx.shadowColor = 'transparent';

      // Letter glyph - scaled to fit the cartouche
      drawCartoucheLetter(currentLetter, cx, cy);

      ctx.restore();
    }

    function drawCartoucheLetter(letter, cx, cy) {
      // Generic letter rendering - works for any alphabet entry.
      // Falls back to the original ox-arm hieroglyph for Letter A specifically
      // so that canonical Letter A keeps its bespoke look.
      if (letter === 'A') {
        drawHieroglyphA(cx, cy);
        return;
      }
      ctx.save();
      ctx.fillStyle = BLACK;
      ctx.strokeStyle = BLACK;
      ctx.lineWidth = 1;
      ctx.font = 'bold 22px Georgia, serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(String(letter || '?'), cx, cy + 1);
      ctx.restore();
    }

    // Which letter to render inside the cartouche - updated per render(data).
    let currentLetter = 'A';

    function drawHieroglyphA(cx, cy) {
      // Stylized vulture / arm glyph for "A" - simplified as a wedge arm shape
      ctx.save();
      ctx.fillStyle = BLACK;
      ctx.strokeStyle = BLACK;
      ctx.lineWidth = 1;

      // Upper arm stroke (simplified arm glyph)
      // Horizontal bar with angled serif
      const bx = cx - 18, by = cy - 4;

      // Main body wedge
      ctx.beginPath();
      ctx.moveTo(bx, by + 8);
      ctx.lineTo(bx + 36, by + 8);
      ctx.lineTo(bx + 32, by);
      ctx.lineTo(bx + 4, by);
      ctx.closePath();
      ctx.fill();

      // Left serif post
      ctx.fillRect(bx, by - 6, 4, 14);

      // Right short serif
      ctx.fillRect(bx + 32, by - 3, 4, 11);

      // Small dot mark below (phonetic complement)
      ctx.beginPath();
      ctx.arc(cx, by + 14, 2.5, 0, Math.PI * 2);
      ctx.fill();

      ctx.restore();
    }

    // ─── Grid points as lotus rosettes ───────────────────────────────────────
    function drawRosette(x, y, r) {
      ctx.save();
      ctx.fillStyle = GOLD;
      ctx.strokeStyle = BLACK;
      ctx.lineWidth = 0.7;
      // 8 petals
      for (let i = 0; i < 8; i++) {
        const angle = (i / 8) * Math.PI * 2;
        const px = x + Math.cos(angle) * r * 0.55;
        const py = y + Math.sin(angle) * r * 0.55;
        ctx.beginPath();
        ctx.ellipse(px, py, r * 0.32, r * 0.55, angle, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();
      }
      // Center circle
      ctx.beginPath();
      ctx.arc(x, y, r * 0.28, 0, Math.PI * 2);
      ctx.fillStyle = CREAM;
      ctx.fill();
      ctx.stroke();
      ctx.restore();
    }

    function drawGridDot(x, y) {
      // Lotus rosette at each grid point
      drawRosette(x, y, 9);
    }

    // ─── Grid layout ─────────────────────────────────────────────────────────
    // TKA 8-point grid:  N, NE, E, SE, S, SW, W, NW + center
    // Center of composition:
    const GCX = 250, GCY = 268;
    const GR  = 88;  // grid radius

    const gridPoints = {
      N:  { x: GCX,        y: GCY - GR      },
      NE: { x: GCX + GR * Math.SQRT1_2, y: GCY - GR * Math.SQRT1_2 },
      E:  { x: GCX + GR,   y: GCY           },
      SE: { x: GCX + GR * Math.SQRT1_2, y: GCY + GR * Math.SQRT1_2 },
      S:  { x: GCX,        y: GCY + GR      },
      SW: { x: GCX - GR * Math.SQRT1_2, y: GCY + GR * Math.SQRT1_2 },
      W:  { x: GCX - GR,   y: GCY           },
      NW: { x: GCX - GR * Math.SQRT1_2, y: GCY - GR * Math.SQRT1_2 },
    };

    // ─── Draw faint grid lines ────────────────────────────────────────────────
    function drawGrid() {
      ctx.save();
      ctx.strokeStyle = 'rgba(26,15,0,0.12)';
      ctx.lineWidth = 1;
      ctx.setLineDash([3, 4]);

      const pairs = [['N','S'],['E','W'],['NE','SW'],['NW','SE']];
      for (const [a,b] of pairs) {
        ctx.beginPath();
        ctx.moveTo(gridPoints[a].x, gridPoints[a].y);
        ctx.lineTo(gridPoints[b].x, gridPoints[b].y);
        ctx.stroke();
      }

      // Outer ring (simplified octagon)
      ctx.setLineDash([2, 3]);
      ctx.beginPath();
      const pts = ['N','NE','E','SE','S','SW','W','NW','N'];
      ctx.moveTo(gridPoints['N'].x, gridPoints['N'].y);
      for (const k of pts) ctx.lineTo(gridPoints[k].x, gridPoints[k].y);
      ctx.stroke();

      ctx.restore();

      // Grid point rosettes at cardinal & intercardinal positions
      for (const key of ['N','E','S','W','NE','SE','SW','NW']) {
        drawGridDot(gridPoints[key].x, gridPoints[key].y);
      }
      // Center rosette (slightly bigger)
      drawRosette(GCX, GCY, 12);
    }

    // ─── Egyptian-style flat staff ────────────────────────────────────────────
    // Profile view: a flat stick painted like a tomb painting - thick, bold outlines
    function drawStaff(x1, y1, x2, y2, color) {
      const dx = x2 - x1, dy = y2 - y1;
      const len = Math.sqrt(dx*dx + dy*dy);
      const nx = -dy / len, ny = dx / len;
      const hw = 5.5; // half-width of staff

      // Shadow
      ctx.save();
      ctx.globalAlpha = 0.22;
      ctx.fillStyle = BLACK;
      ctx.beginPath();
      ctx.moveTo(x1 + nx*hw + 2, y1 + ny*hw + 2);
      ctx.lineTo(x2 + nx*hw + 2, y2 + ny*hw + 2);
      ctx.lineTo(x2 - nx*hw + 2, y2 - ny*hw + 2);
      ctx.lineTo(x1 - nx*hw + 2, y1 - ny*hw + 2);
      ctx.closePath();
      ctx.fill();
      ctx.restore();

      // Staff body - flat fill, Egyptian style
      ctx.save();
      ctx.fillStyle = color;
      ctx.strokeStyle = BLACK;
      ctx.lineWidth = 2.2;
      ctx.lineJoin = 'round';

      ctx.beginPath();
      ctx.moveTo(x1 + nx*hw, y1 + ny*hw);
      ctx.lineTo(x2 + nx*hw, y2 + ny*hw);
      ctx.lineTo(x2 - nx*hw, y2 - ny*hw);
      ctx.lineTo(x1 - nx*hw, y1 - ny*hw);
      ctx.closePath();
      ctx.fill();
      ctx.stroke();

      // End caps - rounded knob
      ctx.fillStyle = CREAM;
      ctx.beginPath();
      ctx.arc(x1, y1, hw * 0.9, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = BLACK;
      ctx.lineWidth = 1.5;
      ctx.stroke();

      ctx.fillStyle = CREAM;
      ctx.beginPath();
      ctx.arc(x2, y2, hw * 0.9, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();

      // Grip wrap bands (3 diagonal bands near center)
      const midX = (x1+x2)/2, midY = (y1+y2)/2;
      const ux = dx/len, uy = dy/len;
      ctx.strokeStyle = BLACK;
      ctx.lineWidth = 1;
      ctx.globalAlpha = 0.35;
      for (let i = -1; i <= 1; i++) {
        const bx = midX + ux * i * 10;
        const by = midY + uy * i * 10;
        ctx.beginPath();
        ctx.moveTo(bx + nx*(hw+1), by + ny*(hw+1));
        ctx.lineTo(bx - nx*(hw+1), by - ny*(hw+1));
        ctx.stroke();
      }
      ctx.restore();
    }

    // ─── Motion arrow in Egyptian flat style ─────────────────────────────────
    // Takes raw canvas radians for start/end angles plus an explicit
    // `anticlockwise` flag (same meaning as ctx.arc's 6th parameter). The
    // caller resolves motion direction; this function only draws.
    function drawMotionArc(startRad, endRad, anticlockwise, color) {
      ctx.save();
      ctx.strokeStyle = color;
      ctx.lineWidth = 8;
      ctx.lineCap = 'butt';
      ctx.lineJoin = 'round';

      // Shadow
      ctx.shadowColor = 'rgba(0,0,0,0.3)';
      ctx.shadowBlur = 3;
      ctx.shadowOffsetX = 2;
      ctx.shadowOffsetY = 2;

      const arrowR = GR * 0.72;  // slightly inside grid radius
      const ccw = !!anticlockwise;

      ctx.beginPath();
      ctx.arc(GCX, GCY, arrowR, startRad, endRad, ccw);
      ctx.stroke();

      ctx.shadowColor = 'transparent';

      // Black outline pass (slightly wider, drawn beneath)
      ctx.globalCompositeOperation = 'destination-over';
      ctx.strokeStyle = BLACK;
      ctx.lineWidth = 12;
      ctx.beginPath();
      ctx.arc(GCX, GCY, arrowR, startRad, endRad, ccw);
      ctx.stroke();
      ctx.globalCompositeOperation = 'source-over';

      // Re-draw color on top
      ctx.strokeStyle = color;
      ctx.lineWidth = 8;
      ctx.beginPath();
      ctx.arc(GCX, GCY, arrowR, startRad, endRad, ccw);
      ctx.stroke();

      // Egyptian-style arrowhead at end of arc
      // Find tangent direction at endRad (for CCW or CW)
      const arrowTipX = GCX + Math.cos(endRad) * arrowR;
      const arrowTipY = GCY + Math.sin(endRad) * arrowR;

      // Tangent: for CW motion, tangent = (sin, -cos); for CCW = (-sin, cos)
      let tanX, tanY;
      if (ccw) {
        tanX = Math.sin(endRad);
        tanY = -Math.cos(endRad);
      } else {
        tanX = -Math.sin(endRad);
        tanY = Math.cos(endRad);
      }

      drawEgyptianArrowhead(arrowTipX, arrowTipY, tanX, tanY, color);
      ctx.restore();
    }

    function drawEgyptianArrowhead(tx, ty, dirX, dirY, color) {
      // Bold flat triangular arrowhead - Egyptian style, no perspective
      const len = 20, hw = 9;
      const nx = -dirY, ny = dirX;  // perpendicular

      const tip   = { x: tx + dirX * len * 0.5, y: ty + dirY * len * 0.5 };
      const base1 = { x: tx - dirX * len * 0.5 + nx * hw, y: ty - dirY * len * 0.5 + ny * hw };
      const base2 = { x: tx - dirX * len * 0.5 - nx * hw, y: ty - dirY * len * 0.5 - ny * hw };
      // Small notch at base (Egyptian feathered look)
      const notch = { x: tx - dirX * len * 0.15, y: ty - dirY * len * 0.15 };

      ctx.save();
      // Shadow
      ctx.fillStyle = 'rgba(0,0,0,0.3)';
      ctx.beginPath();
      ctx.moveTo(tip.x+2, tip.y+2);
      ctx.lineTo(base1.x+2, base1.y+2);
      ctx.lineTo(notch.x+2, notch.y+2);
      ctx.lineTo(base2.x+2, base2.y+2);
      ctx.closePath();
      ctx.fill();

      // Arrowhead fill
      ctx.fillStyle = color;
      ctx.strokeStyle = BLACK;
      ctx.lineWidth = 2;
      ctx.lineJoin = 'miter';
      ctx.beginPath();
      ctx.moveTo(tip.x, tip.y);
      ctx.lineTo(base1.x, base1.y);
      ctx.lineTo(notch.x, notch.y);
      ctx.lineTo(base2.x, base2.y);
      ctx.closePath();
      ctx.fill();
      ctx.stroke();
      ctx.restore();
    }

    // ─── Hands (profile view Egyptian style) ─────────────────────────────────
    function drawHand(x, y, color, direction) {
      // Flat Egyptian profile hand - simplified to palm + fingers suggestion
      ctx.save();
      ctx.fillStyle = color;
      ctx.strokeStyle = BLACK;
      ctx.lineWidth = 1.8;

      const angle = direction === 'up' ? -Math.PI/2 :
                    direction === 'down' ? Math.PI/2 :
                    direction === 'left' ? Math.PI :
                    0;  // right

      ctx.translate(x, y);
      ctx.rotate(angle);

      // Palm body (rectangle-ish)
      ctx.beginPath();
      ctx.roundRect(-8, -6, 16, 12, 2);
      ctx.fill();
      ctx.stroke();

      // Thumb (smaller rectangle at top)
      ctx.fillStyle = CREAM;
      ctx.beginPath();
      ctx.roundRect(5, -10, 7, 6, 2);
      ctx.fill();
      ctx.stroke();

      // Finger suggestions (3 lines)
      ctx.strokeStyle = BLACK;
      ctx.lineWidth = 1;
      for (let i = -1; i <= 1; i++) {
        ctx.beginPath();
        ctx.moveTo(i * 4, -6);
        ctx.lineTo(i * 4, -11);
        ctx.stroke();
      }
      // Finger tips bar
      ctx.fillStyle = color;
      ctx.beginPath();
      ctx.roundRect(-7, -14, 14, 5, 2);
      ctx.fill();
      ctx.strokeStyle = BLACK;
      ctx.lineWidth = 1.5;
      ctx.stroke();

      ctx.restore();
    }

    // ─── Center Eye of Horus / Ankh ───────────────────────────────────────────
    function drawCenterSymbol() {
      const cx = GCX, cy = GCY;

      ctx.save();

      // Ankh symbol centered on grid
      const s = 18; // scale

      ctx.fillStyle = GOLD;
      ctx.strokeStyle = BLACK;
      ctx.lineWidth = 1.8;

      // Loop (top oval)
      ctx.beginPath();
      ctx.ellipse(cx, cy - s * 0.6, s * 0.45, s * 0.55, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();

      // Interior cutout (lighter)
      ctx.fillStyle = SAND_MID;
      ctx.beginPath();
      ctx.ellipse(cx, cy - s * 0.6, s * 0.28, s * 0.35, 0, 0, Math.PI * 2);
      ctx.fill();

      // Vertical stem
      ctx.fillStyle = GOLD;
      ctx.fillRect(cx - s*0.15, cy - s*0.1, s*0.3, s*1.0);
      ctx.strokeRect(cx - s*0.15, cy - s*0.1, s*0.3, s*1.0);

      // Horizontal cross-bar
      ctx.fillRect(cx - s*0.6, cy + s*0.1, s*1.2, s*0.25);
      ctx.strokeRect(cx - s*0.6, cy + s*0.1, s*1.2, s*0.25);

      ctx.restore();
    }

    // ─── "PRO" label glyph markers ────────────────────────────────────────────
    // Small hieroglyph-like indicators for "pro" motion type
    function drawMotionLabel(x, y, color) {
      ctx.save();
      ctx.fillStyle = color;
      ctx.strokeStyle = BLACK;
      ctx.lineWidth = 1;

      // Simple feather/reed glyph - upright stroke with horizontal cuts
      ctx.fillRect(x - 1.5, y - 10, 3, 20);
      ctx.strokeRect(x - 1.5, y - 10, 3, 20);
      for (let i = -8; i <= 8; i += 4) {
        ctx.beginPath();
        ctx.moveTo(x - 1.5, y + i);
        ctx.lineTo(x - 7, y + i - 2);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(x + 1.5, y + i);
        ctx.lineTo(x + 7, y + i - 2);
        ctx.stroke();
      }
      ctx.restore();
    }

    // ─── Inner panel background ───────────────────────────────────────────────
    function drawInnerPanel() {
      const inner = 36;
      const iw = W - inner * 2, ih = H - inner * 2;

      // Slightly different shade to suggest carved recessed panel
      const panelGrad = ctx.createLinearGradient(inner, inner, inner + iw, inner + ih);
      panelGrad.addColorStop(0, 'rgba(180,140,80,0.18)');
      panelGrad.addColorStop(1, 'rgba(100,70,20,0.12)');
      ctx.fillStyle = panelGrad;
      ctx.fillRect(inner, inner, iw, ih);

      // Inset shadow edges (simulate carved stone)
      ctx.save();
      ctx.strokeStyle = 'rgba(26,15,0,0.25)';
      ctx.lineWidth = 3;
      // Top/left darker (shadow side)
      ctx.beginPath();
      ctx.moveTo(inner, inner + ih);
      ctx.lineTo(inner, inner);
      ctx.lineTo(inner + iw, inner);
      ctx.stroke();
      // Bottom/right lighter (lit side)
      ctx.strokeStyle = 'rgba(240,200,120,0.2)';
      ctx.beginPath();
      ctx.moveTo(inner + iw, inner);
      ctx.lineTo(inner + iw, inner + ih);
      ctx.lineTo(inner, inner + ih);
      ctx.stroke();
      ctx.restore();
    }

    // ─── Title section (top of inner panel) ──────────────────────────────────
    function drawTitleArea() {
      // Horizontal divider line below cartouche
      ctx.save();
      ctx.strokeStyle = BLACK;
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(50, 100);
      ctx.lineTo(450, 100);
      ctx.stroke();

      // Small decorative lotus buds at divider ends
      drawLotus(50, 100);
      drawLotus(450, 100);

      ctx.restore();
    }

    function drawLotus(x, y) {
      ctx.save();
      ctx.fillStyle = GOLD;
      ctx.strokeStyle = BLACK;
      ctx.lineWidth = 1;

      // Stem
      ctx.fillRect(x - 2, y, 4, 10);
      ctx.strokeRect(x - 2, y, 4, 10);

      // Three petals suggestion
      ctx.beginPath();
      ctx.ellipse(x, y - 5, 4, 8, 0, 0, Math.PI * 2);
      ctx.fill(); ctx.stroke();
      ctx.beginPath();
      ctx.ellipse(x - 6, y - 2, 3, 6, -0.4, 0, Math.PI * 2);
      ctx.fill(); ctx.stroke();
      ctx.beginPath();
      ctx.ellipse(x + 6, y - 2, 3, 6, 0.4, 0, Math.PI * 2);
      ctx.fill(); ctx.stroke();
      ctx.restore();
    }

    // ─── Bottom label area ────────────────────────────────────────────────────
    function drawBottomArea() {
      ctx.save();
      // Divider
      ctx.strokeStyle = BLACK;
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(50, 430);
      ctx.lineTo(450, 430);
      ctx.stroke();
      drawLotus(50, 430);
      drawLotus(450, 430);

      // Bottom hieroglyph-style text row (decorative symbolic strip)
      const symbols = ['eye', 'bird', 'wave', 'eye', 'bird', 'wave', 'eye'];
      const startX = 90, y = 454, spacing = 50;
      for (let i = 0; i < symbols.length; i++) {
        const sx = startX + i * spacing;
        drawMiniGlyph(sx, y, symbols[i % 3]);
      }
      ctx.restore();
    }

    function drawMiniGlyph(x, y, type) {
      ctx.save();
      ctx.fillStyle = BLACK;
      ctx.strokeStyle = BLACK;
      ctx.lineWidth = 0.8;
      if (type === 'eye') {
        // Simplified eye of Horus
        ctx.beginPath();
        ctx.ellipse(x, y, 7, 4, 0, 0, Math.PI * 2);
        ctx.stroke();
        ctx.beginPath();
        ctx.arc(x, y, 2, 0, Math.PI * 2);
        ctx.fill();
        ctx.beginPath();
        ctx.moveTo(x + 7, y);
        ctx.lineTo(x + 12, y + 5);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(x - 7, y);
        ctx.lineTo(x - 9, y + 4);
        ctx.lineTo(x - 11, y);
        ctx.stroke();
      } else if (type === 'bird') {
        // Profile bird silhouette (ibis-like)
        ctx.fillStyle = BLACK;
        ctx.beginPath();
        ctx.ellipse(x, y + 2, 6, 4, 0.3, 0, Math.PI * 2);
        ctx.fill();
        // Head
        ctx.beginPath();
        ctx.arc(x + 6, y - 1, 3, 0, Math.PI * 2);
        ctx.fill();
        // Beak
        ctx.beginPath();
        ctx.moveTo(x + 9, y - 1);
        ctx.lineTo(x + 15, y + 2);
        ctx.lineTo(x + 9, y + 1);
        ctx.closePath();
        ctx.fill();
        // Leg
        ctx.beginPath();
        ctx.moveTo(x + 1, y + 6);
        ctx.lineTo(x + 1, y + 10);
        ctx.stroke();
      } else { // wave
        // Water/wave hieroglyph
        ctx.beginPath();
        ctx.moveTo(x - 8, y);
        for (let i = 0; i < 4; i++) {
          ctx.quadraticCurveTo(x - 8 + i*4 + 2, y - 4, x - 8 + i*4 + 4, y);
        }
        ctx.lineWidth = 1.5;
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(x - 8, y + 4);
        for (let i = 0; i < 4; i++) {
          ctx.quadraticCurveTo(x - 8 + i*4 + 2, y, x - 8 + i*4 + 4, y + 4);
        }
        ctx.stroke();
      }
      ctx.restore();
    }

    // ─── Data-driven helpers ─────────────────────────────────────────────────
    //
    // Each hand's arrow and staff are drawn from motion data, not hardcoded
    // letter-A geometry. PictographGeometry (loaded in the head) resolves
    // grid locations, hand direction, and staff axis angles.

    function handLoc(hand) {
      // Accept both lowercase TKA domain names (n, ne, ...) and uppercase
      // compass names used internally by this file.
      return String(hand.location || hand.startLocation || '').toLowerCase();
    }
    function handEndLoc(hand) {
      return String(hand.endLocation || '').toLowerCase();
    }

    function drawArrowForHand(hand, color) {
      if (!hand || hand.motionType === 'static' || !window.PictographGeometry) return;
      const G = window.PictographGeometry;
      const s = G.locationPoint(handLoc(hand),   GCX, GCY, GR);
      const e = G.locationPoint(handEndLoc(hand), GCX, GCY, GR);

      if (hand.motionType === 'dash') {
        // Straight line with Egyptian arrowhead
        ctx.save();
        ctx.strokeStyle = color;
        ctx.lineWidth = 8;
        ctx.lineCap = 'butt';
        ctx.shadowColor = 'rgba(0,0,0,0.3)';
        ctx.shadowBlur = 3;
        ctx.shadowOffsetX = 2;
        ctx.shadowOffsetY = 2;
        ctx.beginPath();
        ctx.moveTo(s.x, s.y);
        ctx.lineTo(e.x, e.y);
        ctx.stroke();
        ctx.shadowColor = 'transparent';
        // Black underlay
        ctx.globalCompositeOperation = 'destination-over';
        ctx.strokeStyle = BLACK;
        ctx.lineWidth = 12;
        ctx.beginPath();
        ctx.moveTo(s.x, s.y);
        ctx.lineTo(e.x, e.y);
        ctx.stroke();
        ctx.globalCompositeOperation = 'source-over';
        ctx.restore();

        const len = Math.hypot(e.x - s.x, e.y - s.y) || 1;
        drawEgyptianArrowhead(e.x, e.y, (e.x - s.x) / len, (e.y - s.y) / len, color);
        return;
      }

      // Arc motion (pro / anti / float)
      const dir = G.handDirection(hand) || 'cw';
      const startA = G.locationAngle(handLoc(hand));
      const endA   = G.locationAngle(handEndLoc(hand));
      if (startA == null || endA == null) return;

      // In canvas (y-down): visual CW = angle increasing = ctx.arc anticlockwise=false.
      const anticlockwise = (dir === 'ccw');
      drawMotionArc(startA, endA, anticlockwise, color);
    }

    function drawStaffForHand(hand, color) {
      if (!hand || !window.PictographGeometry) return;
      const G = window.PictographGeometry;
      const center = G.locationPoint(handEndLoc(hand), GCX, GCY, GR);
      const axis = G.staffAxisAngle(handEndLoc(hand), hand.orientation || 'in');
      const length = GR * 1.2;
      const { a, b } = G.staffEndpoints(center, axis, length);
      drawStaff(a.x, a.y, b.x, b.y, color);
    }

    function handDirectionForHand(hand) {
      // Used to orient the decorative hand profile at the prop's end.
      const endLoc = handEndLoc(hand);
      const a = window.PictographGeometry && window.PictographGeometry.locationAngle(endLoc);
      if (a == null) return 'right';
      // Map radial angle to the closest of up/down/left/right.
      const ax = Math.cos(a), ay = Math.sin(a);
      if (Math.abs(ay) > Math.abs(ax)) return ay < 0 ? 'up' : 'down';
      return ax < 0 ? 'left' : 'right';
    }

    // ─── Render everything ────────────────────────────────────────────────────
    //
    // Two paths:
    //   1. Canonical bitmap available (parent app posted a pre-rendered
    //      pictograph via the bridge): pixelate it to a sharp hieroglyphic
    //      scale, recolor into the Egyptian pigments, apply a hard-edge
    //      treatment. This inherits all correct motion semantics from the
    //      canonical renderer - pro vs anti, dashes, turn indicators, floats.
    //
    //   2. No canonical (page opened directly, or canonical render failed):
    //      fall back to the original data-driven rendering so the standalone
    //      page still produces a complete scene.
    //
    // The Egyptian chrome - sandstone, border band, cartouche, title, motion
    // feather glyphs, center ankh, bottom glyph strip, vignette - is drawn
    // identically either way. That's where the era's voice lives.
    function render(data, canonical, meta) {
      const blue = data.blueHand;
      const red  = data.redHand;

      // Update the cartouche letter BEFORE drawing the cartouche so it picks
      // up the right glyph on this frame.
      currentLetter = String(data.letter || '?');

      // 1. Sandstone background
      drawBackground();

      // 2. Outer decorative border band
      drawOuterBorder();

      // 3. Inner panel (recessed stone)
      drawInnerPanel();

      // 4. Cartouche + letter glyph at top
      drawCartouche();

      // 5. Title divider
      drawTitleArea();

      // 6. Pictograph core - canonical (Path 1) or data-driven fallback
      if (canonical && window.PictographStylize) {
        // Path 1: pixelate + recolor + hard-edge treatment.
        //   1. pixelate - downsample canonical to 180px then upsample with
        //      nearest neighbor. 180 is sharp (crisp hieroglyphic feel), not
        //      blocky the way cave painting's 90 would be.
        //   2. recolor - map canonical's blue/red/structural classes to
        //      lapis / vermillion / black (BG stays transparent so the
        //      sandstone panel shows through).
        //   3. edgeTreatment 'flat' - hard-edged pixels, no soft gradients.
        //      Egyptian flat-profile tomb art has no blur.
        // Single composite pass, alpha 1.0 - crisp, not layered.
        const chunky = window.PictographStylize.pixelate(canonical, W, 180);
        const styled = window.PictographStylize.recolor(chunky, EGYPTIAN_PALETTE, W);
        window.PictographStylize.edgeTreatment(styled, 'flat');
        ctx.drawImage(styled, 0, 0, W, H);
      } else {
        // Fallback: original data-driven pictograph rendering
        drawGrid();
        drawArrowForHand(blue, LAPIS);
        drawArrowForHand(red,  VERMILLION);
        drawStaffForHand(blue, LAPIS);
        drawStaffForHand(red,  VERMILLION);
        if (window.PictographGeometry) {
          const G = window.PictographGeometry;
          const bluePt = G.locationPoint(handEndLoc(blue), GCX, GCY, GR);
          const redPt  = G.locationPoint(handEndLoc(red),  GCX, GCY, GR);
          drawHand(bluePt.x, bluePt.y, LAPIS,     handDirectionForHand(blue));
          drawHand(redPt.x,  redPt.y,  VERMILLION, handDirectionForHand(red));
        }
      }

      // 7. Pro motion labels (feather glyphs beside arrows) - purely
      //    decorative, drawn on top of the pictograph in both paths.
      drawMotionLabel(GCX - GR * 0.8, GCY - GR * 0.5, LAPIS);
      drawMotionLabel(GCX + GR * 0.8, GCY + GR * 0.5, VERMILLION);

      // 8. Center ankh symbol
      drawCenterSymbol();

      // 9. Bottom divider + glyph strip
      drawBottomArea();

      // 10. Aged vignette (dark corners, simulating old stone)
      drawVignette();
    }

    function drawVignette() {
      const vg = ctx.createRadialGradient(W/2, H/2, W*0.3, W/2, H/2, W*0.72);
      vg.addColorStop(0, 'rgba(0,0,0,0)');
      vg.addColorStop(1, 'rgba(26,15,0,0.45)');
      ctx.fillStyle = vg;
      ctx.fillRect(0, 0, W, H);

      // Subtle overall patina
      ctx.fillStyle = 'rgba(180,130,60,0.04)';
      ctx.fillRect(0, 0, W, H);
    }

    // ─── Default pictograph - Letter A (what the page rendered before the
    //     data-driven refactor). Also used when this HTML is opened directly
    //     without a parent posting pictograph data.
    const DEFAULT_PICTOGRAPH = {
      letter: 'A',
      gridMode: 'diamond',
      blueHand: {
        color: 'blue',
        location: 'w', endLocation: 'n',
        motionType: 'pro', rotationDirection: 'cw',
        orientation: 'in', turns: 0,
      },
      redHand: {
        color: 'red',
        location: 'e', endLocation: 's',
        motionType: 'pro', rotationDirection: 'cw',
        orientation: 'in', turns: 0,
      },
    };

    render(DEFAULT_PICTOGRAPH, null, null);

    if (window.PictographBridge) {
      window.PictographBridge.onPictograph(function(data, canonical, meta) {
        render(data, canonical, meta);
      });
    }
  })();
  </script>
<script>if(location.search.includes("embed"))document.body.classList.add("embed")</script>
</body>
