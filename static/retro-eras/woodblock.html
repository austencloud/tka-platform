<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TKA Letter A — Ukiyo-e Woodblock Print</title>
  <style>
    body {
      margin: 0;
      background: #2a1f14;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-family: serif;
    }
    canvas {
      display: block;
      box-shadow: 0 8px 40px rgba(0,0,0,0.7), 0 2px 8px rgba(0,0,0,0.5);
    }
      body.embed { min-height: 0; padding: 0; margin: 0; display: block; }
    body.embed canvas { width: 100%; height: auto; }
    body.embed .caption, body.embed .controls, body.embed .scene > :not(canvas) { display: none; }
  </style>
</head>
<body>
<canvas id="c" width="500" height="500"></canvas>
<script src="./_shared/pictograph-geometry.js"></script>
<script src="./_shared/pictograph-bridge.js"></script>
<script src="./_shared/pictograph-stylize.js"></script>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

// ─── Grid geometry (shared across all draw functions) ──────────────────────
const CX = 250;
const CY = 250;
const OUTER_R = 150;

// ─── Palette ───────────────────────────────────────────────────────────────
const WASHI    = '#F5EDDC';
const INDIGO   = '#264E70';
const VERMIL   = '#D14836';
const SUMI     = '#1A1A1A';
const SEAL_RED = '#C0291A';
const GOLD_HNT = '#C8974A';  // warm ochre accent

// Palette used by Path 1 (canonical recolor pipeline). Maps the canonical
// renderer's blue/red/structural classes into this era's ink palette.
const WOODBLOCK_PALETTE = {
  blue:       '#1E3A6A',  // indigo
  red:        '#B82410',  // sumi red
  structural: '#1A0F08',  // sumi black
  bg:         null,       // transparent — washi paper shows through
};

// ─── Utilities ─────────────────────────────────────────────────────────────
function lerp(a, b, t) { return a + (b - a) * t; }

// ── Seeded PRNG (Mulberry32) — reseeded per render for determinism ────────
let rng = mulberry32(0xF00DBABE);
function mulberry32(seed) {
  return function() {
    seed |= 0; seed = seed + 0x6D2B79F5 | 0;
    let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

function seedFor(data) {
  // Stable hash so navigating forward/back reproduces the same pigment
  // scatter/wobble for each letter.
  const b = data && data.blueHand ? data.blueHand : {};
  const r = data && data.redHand  ? data.redHand  : {};
  const s = `${data && data.letter}|${b.location}|${b.endLocation}|${b.motionType}|${r.location}|${r.endLocation}|${r.motionType}`;
  let h = 0xF00DBABE;
  for (let i = 0; i < s.length; i++) {
    h = (h ^ s.charCodeAt(i)) * 16777619 >>> 0;
  }
  return h;
}

// Draw a stroke that varies width along its length — simulates wood-cut pressure
function woodStroke(pts, widths, color, grain = true) {
  ctx.save();
  for (let i = 0; i < pts.length - 1; i++) {
    const t  = i / (pts.length - 2);
    const w  = lerp(widths[0], widths[1], t);
    const x0 = pts[i][0],   y0 = pts[i][1];
    const x1 = pts[i+1][0], y1 = pts[i+1][1];

    ctx.beginPath();
    ctx.moveTo(x0, y0);
    ctx.lineTo(x1, y1);
    ctx.strokeStyle = color;
    ctx.lineWidth   = w;
    ctx.lineCap     = 'round';
    ctx.lineJoin    = 'round';
    ctx.stroke();

    // Subtle wood grain "slip" on thick areas
    if (grain && w > 5 && Math.random() < 0.25) {
      ctx.beginPath();
      const dx = x1 - x0, dy = y1 - y0;
      const len = Math.sqrt(dx*dx + dy*dy) || 1;
      const nx = -dy/len, ny = dx/len;
      const slip = (Math.random() - 0.5) * w * 0.3;
      ctx.moveTo(x0 + nx*slip, y0 + ny*slip);
      ctx.lineTo(x1 + nx*slip*0.5, y1 + ny*slip*0.5);
      ctx.strokeStyle = color + '55';
      ctx.lineWidth   = 0.5 + Math.random() * 0.8;
      ctx.stroke();
    }
  }
  ctx.restore();
}

// Parametric arc points (for arrows)
function arcPoints(cx, cy, r, startA, endA, n = 32) {
  const pts = [];
  for (let i = 0; i <= n; i++) {
    const a = lerp(startA, endA, i / n);
    pts.push([cx + Math.cos(a) * r, cy + Math.sin(a) * r]);
  }
  return pts;
}

// ─── Step 1: Washi paper background ─────────────────────────────────────────
function drawWashi() {
  // Base tone
  ctx.fillStyle = WASHI;
  ctx.fillRect(0, 0, 500, 500);

  // Fiber texture — fine horizontal and diagonal lines of varying opacity
  ctx.save();
  for (let y = 0; y < 500; y += 2.5) {
    const alpha = 0.03 + Math.random() * 0.04;
    ctx.strokeStyle = `rgba(160,130,90,${alpha})`;
    ctx.lineWidth   = 0.4 + Math.random() * 0.4;
    ctx.beginPath();
    ctx.moveTo(0, y + Math.random() * 1.5);
    ctx.lineTo(500, y + Math.random() * 1.5);
    ctx.stroke();
  }
  // Occasional diagonal fibers
  for (let i = 0; i < 60; i++) {
    const x = Math.random() * 600 - 50;
    const y = Math.random() * 600 - 50;
    ctx.strokeStyle = `rgba(140,110,70,${0.02 + Math.random() * 0.03})`;
    ctx.lineWidth   = 0.3;
    ctx.beginPath();
    ctx.moveTo(x, y);
    ctx.lineTo(x + 40 + Math.random()*80, y + 5 + Math.random()*15);
    ctx.stroke();
  }
  // Subtle age spots
  for (let i = 0; i < 20; i++) {
    const x = Math.random() * 500, y = Math.random() * 500;
    const r = 1 + Math.random() * 4;
    const g = ctx.createRadialGradient(x, y, 0, x, y, r);
    g.addColorStop(0, 'rgba(160,120,70,0.12)');
    g.addColorStop(1, 'rgba(160,120,70,0)');
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(x, y, r, 0, Math.PI*2);
    ctx.fill();
  }
  ctx.restore();
}

// ─── Step 2: Border ──────────────────────────────────────────────────────────
function drawBorder() {
  ctx.save();

  // Outer rectangle
  ctx.strokeStyle = SUMI;
  ctx.lineWidth   = 3;
  ctx.beginPath();
  ctx.roundRect(14, 14, 472, 472, 4);
  ctx.stroke();

  // Inner rectangle (registration mark feel)
  ctx.lineWidth = 1.2;
  ctx.strokeStyle = SUMI + 'AA';
  ctx.beginPath();
  ctx.roundRect(20, 20, 460, 460, 2);
  ctx.stroke();

  // Corner ticks (registration marks)
  const corners = [[14,14],[486,14],[486,486],[14,486]];
  const signs   = [[1,1],[-1,1],[-1,-1],[1,-1]];
  ctx.strokeStyle = SUMI;
  ctx.lineWidth   = 1.5;
  for (let i = 0; i < 4; i++) {
    const [cx, cy] = corners[i];
    const [sx, sy] = signs[i];
    ctx.beginPath();
    ctx.moveTo(cx + sx*8, cy);
    ctx.lineTo(cx + sx*18, cy);
    ctx.moveTo(cx, cy + sy*8);
    ctx.lineTo(cx, cy + sy*18);
    ctx.stroke();
  }

  ctx.restore();
}

// ─── Step 3: Subtle bokashi gradient on background ──────────────────────────
function drawBokashi() {
  ctx.save();
  // Soft top-left blue tint (sky suggestion)
  const gBl = ctx.createRadialGradient(60, 60, 0, 60, 60, 250);
  gBl.addColorStop(0,   'rgba(38,78,112,0.08)');
  gBl.addColorStop(0.6, 'rgba(38,78,112,0.03)');
  gBl.addColorStop(1,   'rgba(38,78,112,0)');
  ctx.fillStyle = gBl;
  ctx.fillRect(0, 0, 500, 500);

  // Soft bottom-right warm tint
  const gWm = ctx.createRadialGradient(440, 440, 0, 440, 440, 220);
  gWm.addColorStop(0,   'rgba(200,151,74,0.09)');
  gWm.addColorStop(0.7, 'rgba(200,151,74,0.03)');
  gWm.addColorStop(1,   'rgba(200,151,74,0)');
  ctx.fillStyle = gWm;
  ctx.fillRect(0, 0, 500, 500);
  ctx.restore();
}

// ─── Step 4: 8-point grid dots ───────────────────────────────────────────────
function drawGridDots() {
  // Diamond grid: 8 cardinal/intercardinal points on a radius around center.
  // Locations resolved via PictographGeometry so the grid matches every other
  // era renderer exactly.
  const G = window.PictographGeometry;
  const locs = ['n', 'ne', 'e', 'se', 's', 'sw', 'w', 'nw'];

  ctx.save();
  locs.forEach((loc) => {
    const pt = G ? G.locationPoint(loc, CX, CY, OUTER_R) : { x: CX, y: CY };
    const x = pt.x;
    const y = pt.y;

    // Outer glow ring (mon-style)
    ctx.beginPath();
    ctx.arc(x, y, 8, 0, Math.PI*2);
    ctx.strokeStyle = SUMI + '30';
    ctx.lineWidth   = 1;
    ctx.stroke();

    // Filled dot
    ctx.beginPath();
    ctx.arc(x, y, 5, 0, Math.PI*2);
    ctx.fillStyle = SUMI + 'AA';
    ctx.fill();

    // Inner dot highlight
    ctx.beginPath();
    ctx.arc(x, y, 2, 0, Math.PI*2);
    ctx.fillStyle = SUMI;
    ctx.fill();

    // Grain lines through dot
    ctx.strokeStyle = SUMI + '33';
    ctx.lineWidth   = 0.5;
    for (let i = 0; i < 3; i++) {
      const gy = y - 3 + i * 3;
      ctx.beginPath();
      ctx.moveTo(x - 4, gy);
      ctx.lineTo(x + 4, gy);
      ctx.stroke();
    }
  });

  // Center dot
  ctx.beginPath();
  ctx.arc(CX, CY, 4, 0, Math.PI*2);
  ctx.fillStyle = SUMI + '55';
  ctx.fill();

  ctx.restore();
}

// ─── Step 5: Staff lines (thick ink strokes) ─────────────────────────────────
// Data-driven helpers so both hands are drawn the same way. Staff position
// comes from the hand's endLocation + orientation via PictographGeometry.

function handLoc(h)    { return String((h && (h.location    || h.startLocation)) || '').toLowerCase(); }
function handEndLoc(h) { return String((h && h.endLocation)    || '').toLowerCase(); }

function drawStaffForHand(hand, mainColor) {
  if (!hand || !window.PictographGeometry) return;
  const G = window.PictographGeometry;
  const endLoc = handEndLoc(hand);
  const center = G.locationPoint(endLoc, CX, CY, OUTER_R);
  const axis   = G.staffAxisAngle(endLoc, hand.orientation || 'in');
  const length = OUTER_R * 1.1;
  const { a, b } = G.staffEndpoints(center, axis, length);

  // Build a slightly S-curved polyline along the axis for that brush-stroke
  // warble. The sine is applied PERPENDICULAR to the staff axis so the curve
  // reads the same regardless of orientation.
  const steps = 60;
  const pts = [];
  const dx = b.x - a.x, dy = b.y - a.y;
  const len = Math.sqrt(dx*dx + dy*dy) || 1;
  const nx = -dy / len, ny = dx / len; // perpendicular unit vector
  for (let i = 0; i <= steps; i++) {
    const t  = i / steps;
    const bend = Math.sin(t * Math.PI) * 2;
    const bx = a.x + dx * t + nx * bend;
    const by = a.y + dy * t + ny * bend;
    pts.push([bx, by]);
  }

  // Main shaft — thick ink
  woodStroke(pts, [12, 7], mainColor, true);

  // Bokashi wash — linear gradient along the shaft
  const grad = ctx.createLinearGradient(a.x, a.y, b.x, b.y);
  grad.addColorStop(0,   mainColor + 'FF');
  grad.addColorStop(0.5, mainColor + 'CC');
  grad.addColorStop(1,   mainColor + '88');
  woodStroke(pts, [8, 4], grad, false);

  // Tapered end caps — small ellipses oriented along the axis
  const capAngle = Math.atan2(dy, dx);
  ctx.save();
  ctx.fillStyle = mainColor;
  ctx.beginPath();
  ctx.ellipse(a.x, a.y, 7, 4, capAngle, 0, Math.PI*2);
  ctx.fill();
  ctx.fillStyle = mainColor + 'BB';
  ctx.beginPath();
  ctx.ellipse(b.x, b.y, 5, 3, capAngle, 0, Math.PI*2);
  ctx.fill();
  ctx.restore();
}

// ─── Step 6: Motion arrows (calligraphic curves) ─────────────────────────────
// Blue: pro motion, curves from W to N (counterclockwise quarter arc, upper-left)
// Red:  pro motion, curves from E to S (clockwise quarter arc, lower-right)

function drawArrowhead(x, y, angle, size, color) {
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(angle);
  // Bold decisive arrowhead — woodblock style
  ctx.beginPath();
  ctx.moveTo(0, 0);                   // tip
  ctx.lineTo(-size * 0.9, -size * 0.5);
  ctx.lineTo(-size * 0.5, 0);
  ctx.lineTo(-size * 0.9,  size * 0.5);
  ctx.closePath();
  ctx.fillStyle   = color;
  ctx.strokeStyle = color;
  ctx.lineWidth   = 1;
  ctx.fill();
  ctx.stroke();
  ctx.restore();
}

function addGrainToPath(pts, color, baseAlpha = 0.15) {
  // Overlay grain lines along the arrow path
  for (let i = 0; i < pts.length - 1; i += 6) {
    if (Math.random() > 0.5) continue;
    const [x0, y0] = pts[i];
    const [x1, y1] = pts[Math.min(i+3, pts.length-1)];
    const dx = x1 - x0, dy = y1 - y0;
    const len = Math.sqrt(dx*dx + dy*dy) || 1;
    const nx = -dy/len, ny = dx/len;
    const slip = (Math.random() - 0.5) * 10;
    ctx.save();
    ctx.strokeStyle = color + Math.floor(baseAlpha*255).toString(16).padStart(2,'0');
    ctx.lineWidth   = 0.4 + Math.random() * 0.5;
    ctx.beginPath();
    ctx.moveTo(x0 + nx*slip,     y0 + ny*slip);
    ctx.lineTo(x0 + nx*slip*0.3, y0 + ny*slip*0.3);
    ctx.stroke();
    ctx.restore();
  }
}

// Per-hand arrow painter. Preserves the four-pass woodblock style:
//   1. Sumi shadow underlay
//   2. Bold main-color stroke, tapering thick → thin
//   3. Bokashi wash in the hand's "light" color
//   4. Wood grain ticks + arrowhead + origin dot
// Handles dash motions as a straight shadow/stroke/wash/arrowhead set.

function paintWoodblockPath(pts, mainColor, lightColor) {
  // Shadow underlay
  ctx.save();
  ctx.strokeStyle = SUMI + '33';
  ctx.lineWidth   = 18;
  ctx.lineCap     = 'round';
  ctx.beginPath();
  ctx.moveTo(pts[0][0], pts[0][1]);
  for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i][0], pts[i][1]);
  ctx.stroke();
  ctx.restore();

  // Main stroke — thick at start, thin at end
  for (let i = 0; i < pts.length - 1; i++) {
    const t  = i / (pts.length - 2);
    const w  = lerp(14, 3, t);
    ctx.beginPath();
    ctx.moveTo(pts[i][0], pts[i][1]);
    ctx.lineTo(pts[i+1][0], pts[i+1][1]);
    ctx.strokeStyle = mainColor;
    ctx.lineWidth   = w;
    ctx.lineCap     = 'round';
    ctx.stroke();
  }

  // Bokashi — lighter wash layer in the hand's "light" shade
  for (let i = 0; i < pts.length - 1; i++) {
    const t  = i / (pts.length - 2);
    const w  = lerp(8, 1.5, t);
    ctx.beginPath();
    ctx.moveTo(pts[i][0], pts[i][1]);
    ctx.lineTo(pts[i+1][0], pts[i+1][1]);
    const alpha = Math.floor(lerp(0.4, 0.13, t) * 255).toString(16).padStart(2,'0');
    ctx.strokeStyle = lightColor + alpha;
    ctx.lineWidth   = w * 0.7;
    ctx.lineCap     = 'round';
    ctx.stroke();
  }

  addGrainToPath(pts, mainColor, 0.12);
}

function drawArrowForHand(hand, mainColor, lightColor) {
  if (!hand || hand.motionType === 'static' || !window.PictographGeometry) return;
  const G = window.PictographGeometry;

  // Dash — straight line across the grid
  if (hand.motionType === 'dash') {
    const s = G.locationPoint(handLoc(hand),    CX, CY, OUTER_R);
    const e = G.locationPoint(handEndLoc(hand), CX, CY, OUTER_R);
    // Build a straight polyline so the same paint pipeline applies.
    const steps = 48;
    const pts = [];
    for (let i = 0; i <= steps; i++) {
      const t = i / steps;
      pts.push([lerp(s.x, e.x, t), lerp(s.y, e.y, t)]);
    }
    paintWoodblockPath(pts, mainColor, lightColor);

    // Arrowhead at destination
    const last  = pts[pts.length - 1];
    const prev  = pts[pts.length - 5];
    const angle = Math.atan2(last[1] - prev[1], last[0] - prev[0]);
    drawArrowhead(last[0], last[1], angle, 18, mainColor);

    // Origin dot at start
    ctx.beginPath();
    ctx.arc(pts[0][0], pts[0][1], 7, 0, Math.PI*2);
    ctx.fillStyle = mainColor + 'BB';
    ctx.fill();
    ctx.beginPath();
    ctx.arc(pts[0][0], pts[0][1], 4, 0, Math.PI*2);
    ctx.fillStyle = mainColor;
    ctx.fill();
    return;
  }

  // Arc — pro / anti / float
  const dir = G.handDirection(hand) || 'cw';
  const angles = G.arcAngles(handLoc(hand), handEndLoc(hand), dir);
  if (!angles) return;
  const pts = arcPoints(CX, CY, OUTER_R, angles.startA, angles.endA, 48);

  paintWoodblockPath(pts, mainColor, lightColor);

  // Arrowhead at destination end of the arc
  const last  = pts[pts.length - 1];
  const prev  = pts[pts.length - 5];
  const angle = Math.atan2(last[1] - prev[1], last[0] - prev[0]);
  drawArrowhead(last[0], last[1], angle, 18, mainColor);

  // Origin dot at starting grid location
  ctx.beginPath();
  ctx.arc(pts[0][0], pts[0][1], 7, 0, Math.PI*2);
  ctx.fillStyle = mainColor + 'BB';
  ctx.fill();
  ctx.beginPath();
  ctx.arc(pts[0][0], pts[0][1], 4, 0, Math.PI*2);
  ctx.fillStyle = mainColor;
  ctx.fill();
}

// ─── Step 7: Letter glyph in calligraphic brush style ───────────────────────
// Renders in upper-right. For letter 'A' we keep the handcrafted brush-stroke
// glyph. For any other letter we fall back to a bold serif fillText in the
// same ink color, positioned at the same spot.

function brushLine(x0, y0, x1, y1, w0, w1, color, steps = 20) {
  const pts = [];
  for (let i = 0; i <= steps; i++) {
    const t = i / steps;
    pts.push([lerp(x0, x1, t), lerp(y0, y1, t)]);
  }
  woodStroke(pts, [w0, w1], color, true);
}

function drawLetter(letter) {
  const bx = 390, by = 60;
  ctx.save();

  if (letter === 'A') {
    const scale = 1.0;
    const ox = bx, oy = by;

    // Left stroke: top → bottom-left
    brushLine(ox, oy+2,       ox-20, oy+52, 3*scale, 8*scale, SUMI);
    // Right stroke: top → bottom-right
    brushLine(ox, oy+2,       ox+20, oy+52, 3*scale, 8*scale, SUMI);
    // Crossbar
    brushLine(ox-12, oy+28,   ox+12, oy+28, 5*scale, 5*scale, SUMI);
    // Serif ticks on left foot
    brushLine(ox-22, oy+52,   ox-30, oy+52, 5*scale, 1*scale, SUMI);
    brushLine(ox-22, oy+52,   ox-14, oy+52, 5*scale, 1*scale, SUMI);
    // Serif ticks on right foot
    brushLine(ox+20, oy+52,   ox+28, oy+52, 5*scale, 1*scale, SUMI);
    brushLine(ox+20, oy+52,   ox+12, oy+52, 5*scale, 1*scale, SUMI);
  } else {
    // Fallback for other letters — bold serif rendered in sumi ink, centered
    // roughly in the same footprint as the brush-stroke A (~60px tall).
    ctx.font = 'bold 54px "Times New Roman", serif';
    ctx.fillStyle = SUMI;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'alphabetic';
    ctx.fillText(String(letter || '?'), bx, by + 50);
  }

  // Subtle red accent mark (like a Japanese character reading mark) — kept
  // for both branches as part of the decorative print framing.
  ctx.fillStyle = VERMIL + 'CC';
  ctx.beginPath();
  ctx.arc(bx + 28, by + 12, 3, 0, Math.PI * 2);
  ctx.fill();

  ctx.restore();
}

// ─── Step 8: Hanko (red seal stamp) ─────────────────────────────────────────
function drawHanko() {
  const x = 60, y = 430;
  const w = 46, h = 50;

  ctx.save();

  // Outer stamp square with rough edge (woodblock feel)
  ctx.strokeStyle = SEAL_RED;
  ctx.lineWidth   = 3.5;
  ctx.fillStyle   = SEAL_RED + '18';

  // Slightly imperfect rectangle
  ctx.beginPath();
  ctx.moveTo(x + 2,     y);
  ctx.lineTo(x + w - 1, y + 1);
  ctx.lineTo(x + w,     y + h - 2);
  ctx.lineTo(x + 1,     y + h);
  ctx.closePath();
  ctx.fill();
  ctx.stroke();

  // Inner content: simplified kanji-style character for "motion" or "A"
  // Rendered as bold sumi brush strokes inside the seal
  ctx.strokeStyle = SEAL_RED;
  ctx.lineCap     = 'round';

  const sx = x + 8, sy = y + 7;

  // Top horizontal stroke
  ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.moveTo(sx, sy + 4);
  ctx.lineTo(sx + 28, sy + 4);
  ctx.stroke();

  // Vertical center stroke
  ctx.lineWidth = 3.5;
  ctx.beginPath();
  ctx.moveTo(sx + 14, sy + 4);
  ctx.lineTo(sx + 14, sy + 36);
  ctx.stroke();

  // Left diagonal
  ctx.lineWidth = 2.5;
  ctx.beginPath();
  ctx.moveTo(sx + 4, sy + 16);
  ctx.lineTo(sx + 14, sy + 28);
  ctx.stroke();

  // Right diagonal
  ctx.beginPath();
  ctx.moveTo(sx + 24, sy + 16);
  ctx.lineTo(sx + 14, sy + 28);
  ctx.stroke();

  // Bottom horizontal
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(sx + 2,  sy + 36);
  ctx.lineTo(sx + 26, sy + 36);
  ctx.stroke();

  // "Ink bleed" effect — extra blob at intersections
  ctx.fillStyle = SEAL_RED;
  [[sx+14, sy+4],[sx+14, sy+28]].forEach(([px, py]) => {
    ctx.beginPath();
    ctx.arc(px, py, 2.5, 0, Math.PI*2);
    ctx.fill();
  });

  ctx.restore();
}

// ─── Step 9: Supplementary decorative elements ──────────────────────────────
function drawDecoration() {
  ctx.save();

  // Small mon-style circular decoration near top-left
  const mx = 68, my = 68;
  ctx.strokeStyle = SUMI + '55';
  ctx.lineWidth   = 1.2;
  ctx.beginPath();
  ctx.arc(mx, my, 18, 0, Math.PI*2);
  ctx.stroke();
  ctx.beginPath();
  ctx.arc(mx, my, 12, 0, Math.PI*2);
  ctx.stroke();

  // Simple kamon-like flower in the circle
  for (let i = 0; i < 6; i++) {
    const a = (i / 6) * Math.PI * 2;
    const x = mx + Math.cos(a) * 7;
    const y = my + Math.sin(a) * 7;
    ctx.beginPath();
    ctx.arc(x, y, 4, 0, Math.PI*2);
    ctx.strokeStyle = SUMI + '44';
    ctx.lineWidth   = 1;
    ctx.stroke();
  }
  ctx.beginPath();
  ctx.arc(mx, my, 3, 0, Math.PI*2);
  ctx.fillStyle = SUMI + '44';
  ctx.fill();

  // Thin horizontal title area line at top (like a print title band)
  ctx.strokeStyle = SUMI + '33';
  ctx.lineWidth   = 0.8;
  ctx.beginPath();
  ctx.moveTo(30, 42);
  ctx.lineTo(470, 42);
  ctx.stroke();

  // Thin bottom band
  ctx.beginPath();
  ctx.moveTo(30, 458);
  ctx.lineTo(470, 458);
  ctx.stroke();

  // Small ochre accent dots along top band
  for (let x = 50; x < 470; x += 30) {
    ctx.beginPath();
    ctx.arc(x, 42, 1.5, 0, Math.PI*2);
    ctx.fillStyle = GOLD_HNT + '88';
    ctx.fill();
  }

  // Series title text (small, top-right area)
  ctx.font = 'italic 11px serif';
  ctx.fillStyle = SUMI + '77';
  ctx.textAlign = 'right';
  ctx.fillText('TKA · Letter A · Pro', 470, 37);

  // Bottom notation
  ctx.font = '10px serif';
  ctx.fillStyle = SUMI + '55';
  ctx.textAlign = 'center';
  ctx.fillText('青 · 北  |  赤 · 南', 250, 474);

  ctx.restore();
}

// ─── Step 10: Final vignette (age/print feel) ────────────────────────────────
function drawVignette() {
  ctx.save();
  const g = ctx.createRadialGradient(250, 250, 160, 250, 250, 360);
  g.addColorStop(0, 'rgba(0,0,0,0)');
  g.addColorStop(1, 'rgba(30,20,10,0.22)');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, 500, 500);
  ctx.restore();
}

// ─── Compose everything ──────────────────────────────────────────────────────
//
// Two paths:
//   1. Canonical bitmap available — pixelate + recolor into the woodblock
//      palette, apply a grain edge treatment, then composite. The canonical
//      renderer carries all motion semantics (pro/anti, turns, dashes,
//      floats) so they're inherited for free.
//
//   2. No canonical — fall back to the hand-crafted woodblock pipeline so
//      the page still renders when opened standalone.
//
// Era chrome (washi, bokashi, border, decoration, letter, hanko, vignette)
// is drawn identically either way — that's where this era's voice lives.
function render(data, canonical, meta) {
  drawWashi();
  drawBokashi();
  drawBorder();
  drawDecoration();

  // Reseed so each pictograph produces stable scatter
  rng = mulberry32(seedFor(data));

  if (canonical && window.PictographStylize) {
    // Path 1: pixelate to 160px blocks, recolor into this era's ink palette,
    // apply a fiber-grain edge treatment, then composite onto the washi.
    const chunky = window.PictographStylize.pixelate(canonical, 500, 160);
    const styled = window.PictographStylize.recolor(chunky, WOODBLOCK_PALETTE, 500);
    window.PictographStylize.edgeTreatment(styled, 'grain', rng);
    ctx.drawImage(styled, 0, 0, 500, 500);
  } else {
    // Fallback: hand-crafted woodblock pipeline
    drawGridDots();
    drawStaffForHand(data.blueHand, INDIGO);
    drawStaffForHand(data.redHand,  VERMIL);
    drawArrowForHand(data.blueHand, INDIGO, '#6BA3C8');
    drawArrowForHand(data.redHand,  VERMIL, '#E8806A');
  }

  drawLetter(String(data.letter || 'A'));
  drawHanko();
  drawVignette();
}

// Default pictograph — Letter A (what the page rendered before the data-driven
// refactor). Also used when this HTML is opened directly without a parent.
const DEFAULT_PICTOGRAPH = {
  letter: 'A',
  gridMode: 'diamond',
  blueHand: {
    color: 'blue',
    location: 'w', endLocation: 'n',
    motionType: 'pro', rotationDirection: 'cw',
    orientation: 'in', turns: 0,
  },
  redHand: {
    color: 'red',
    location: 'e', endLocation: 's',
    motionType: 'pro', rotationDirection: 'cw',
    orientation: 'in', turns: 0,
  },
};

render(DEFAULT_PICTOGRAPH, null, null);

if (window.PictographBridge) {
  window.PictographBridge.onPictograph(function(data, canonical, meta) {
    render(data, canonical, meta);
  });
}
</script>
<script>if(location.search.includes("embed"))document.body.classList.add("embed")</script>
