<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bauhaus Pictograph A — TKA</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #2A2A2A;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }
    canvas { display: block; image-rendering: crisp-edges; }
  </style>
</head>
<body>
<canvas id="canvas" width="500" height="500"></canvas>
<script>
const canvas = document.getElementById('canvas');
const ctx    = canvas.getContext('2d');

// ─── Bauhaus Palette ──────────────────────────────────────────────────────────
const C = {
  cream:  '#F2EDE4',
  black:  '#1A1A1A',
  red:    '#D93025',
  blue:   '#1E3F8A',
  yellow: '#F0C400',
};

const W = 500, H = 500;

// Grid center — shifted left for asymmetric Bauhaus composition
const CX = 210, CY = 240;
const R  = 130;  // radius to grid points

// Convert compass direction to {x,y}
function gp(dir) {
  const deg = { N:-90, NE:-45, E:0, SE:45, S:90, SW:135, W:180, NW:-135 };
  const a = deg[dir] * Math.PI / 180;
  return { x: CX + R * Math.cos(a), y: CY + R * Math.sin(a) };
}

// Draw a solid arrowhead whose TIP is at (tipX, tipY) pointing in direction (tx, ty)
function arrowhead(tipX, tipY, tx, ty, len, wid, color) {
  const nx = -ty, ny = tx;
  const bx = tipX - tx * len, by = tipY - ty * len;
  ctx.beginPath();
  ctx.moveTo(tipX, tipY);
  ctx.lineTo(bx + nx * wid, by + ny * wid);
  ctx.lineTo(bx - nx * wid, by - ny * wid);
  ctx.closePath();
  ctx.fillStyle = color;
  ctx.fill();
}

// ─── 1. Cream background ──────────────────────────────────────────────────────
ctx.fillStyle = C.cream;
ctx.fillRect(0, 0, W, H);

// ─── 2. Bauhaus structural elements ──────────────────────────────────────────
// Thick vertical black bar — right compositional anchor
ctx.fillStyle = C.black;
ctx.fillRect(430, 0, 70, H);

// Yellow block — bottom-left
ctx.fillStyle = C.yellow;
ctx.fillRect(0, 415, 55, 85);

// Red accent bar — top right
ctx.fillStyle = C.red;
ctx.fillRect(340, 55, 90, 12);

// Frame rules — top and left edges (open composition, Bauhaus style)
ctx.strokeStyle = C.black;
ctx.lineWidth = 2.5;
ctx.beginPath();
ctx.moveTo(0, 0); ctx.lineTo(430, 0);
ctx.moveTo(0, 0); ctx.lineTo(0, H);
ctx.stroke();

// Thin horizontal rule below header
ctx.fillStyle = C.black;
ctx.fillRect(0, 50, 430, 2);

// Thin rule above footer
ctx.fillRect(0, 418, 430, 1.5);

// ─── 3. Header text ───────────────────────────────────────────────────────────
ctx.fillStyle = C.black;
ctx.font = '700 11px "Futura", "Century Gothic", "Gill Sans MT", sans-serif';
ctx.textAlign = 'left';
ctx.textBaseline = 'middle';
ctx.fillText('KINETIC ALPHABET', 16, 30);

// ─── 4. "PICTOGRAPH A" vertically in black bar ────────────────────────────────
ctx.save();
ctx.translate(462, 400);
ctx.rotate(-Math.PI / 2);
ctx.fillStyle = C.cream;
ctx.font = '700 10px "Futura", "Century Gothic", "Gill Sans MT", sans-serif';
ctx.textAlign = 'left';
ctx.textBaseline = 'middle';
ctx.fillText('PICTOGRAPH  A', 0, 0);
ctx.restore();

// ─── 5. Footer text ───────────────────────────────────────────────────────────
ctx.fillStyle = C.black;
ctx.font = '600 9.5px "Futura", "Century Gothic", "Gill Sans MT", sans-serif';
ctx.textAlign = 'left';
ctx.textBaseline = 'middle';
ctx.fillText('1923', 16, 432);
ctx.fillText('TYPE 1  ·  PRO', 65, 432);
ctx.textAlign = 'right';
ctx.fillText('NO. 01', 422, 432);

// ─── 6. Grid dots ─────────────────────────────────────────────────────────────
function drawDots() {
  ['N','NE','E','SE','S','SW','W','NW'].forEach(dir => {
    const p = gp(dir);
    ctx.beginPath();
    ctx.arc(p.x, p.y, 5, 0, Math.PI * 2);
    ctx.fillStyle = C.black;
    ctx.fill();
  });
}
drawDots();

// ─── 7. Compass labels ────────────────────────────────────────────────────────
ctx.font = '700 8px "Futura", "Century Gothic", "Gill Sans MT", sans-serif';
ctx.fillStyle = C.black;
ctx.textAlign = 'center';
ctx.textBaseline = 'middle';
[
  { dir:'N', ox: 0,   oy:-17 },
  { dir:'E', ox: 17,  oy:  0 },
  { dir:'S', ox: 0,   oy: 17 },
  { dir:'W', ox:-17,  oy:  0 },
].forEach(({ dir, ox, oy }) => {
  const p = gp(dir);
  ctx.fillText(dir, p.x + ox, p.y + oy);
});

// ─── 8. Staves — clean flat rectangles ───────────────────────────────────────
function drawStave(dir, color) {
  const p   = gp(dir);
  const ang = Math.atan2(p.y - CY, p.x - CX);
  const startD = 14, endD = R - 10, halfW = 7, capW = 10;

  ctx.save();
  ctx.translate(CX, CY);
  ctx.rotate(ang);
  ctx.fillStyle = color;
  ctx.fillRect(startD, -halfW, endD - startD, halfW * 2);
  ctx.fillRect(endD - capW, -halfW - 3, capW, halfW * 2 + 6);
  ctx.restore();
}

drawStave('N', C.blue);
drawStave('S', C.red);

// ─── 9. Center hub — solid black square ──────────────────────────────────────
const hs = 18;
ctx.fillStyle = C.black;
ctx.fillRect(CX - hs/2, CY - hs/2, hs, hs);

// ─── 10. Pro motion arcs ─────────────────────────────────────────────────────
//
// Blue hand: W → N  (NW quarter arc)
//   Draw from N(270°) to W(180°), CCW (decreasing angle: 270→225→180)
//   Arrowhead tip lands at N, tangent direction at N for CCW = east (+x)
//
// Red hand: E → S  (SE quarter arc)
//   Draw from E(0°) to S(90°), CW (increasing angle: 0→45→90)
//   Arrowhead tip lands at S, tangent direction at S for CW = west (-x)
//   [d/dθ(cosθ, sinθ) at θ=90° = (-sin90, cos90) = (-1, 0)]

// Arc radius equals grid radius — arcs run exactly from grid dot to grid dot
const arcR = R;

// Blue: NW arc — N(270°) to W(180°) CCW
// Tail at W, tip at N. Draw from N→W CCW (270→225→180).
// Arrowhead tip at N, pointing east (+x) — the direction of arc travel at N for CCW.
// CCW tangent at θ: (-sinθ, cosθ). At θ=270°: (1, 0) = east. ✓
{
  const sa = 270 * Math.PI / 180;  // N
  const ea = 180 * Math.PI / 180;  // W

  ctx.save();
  ctx.strokeStyle = C.blue;
  ctx.lineWidth = 6;
  ctx.lineCap = 'butt';
  ctx.beginPath();
  ctx.arc(CX, CY, arcR, sa, ea, true);
  ctx.stroke();
  ctx.restore();

  const tipX = CX + arcR * Math.cos(sa);
  const tipY = CY + arcR * Math.sin(sa);
  arrowhead(tipX, tipY, 1, 0, 18, 11, C.blue);
}

// Red: SE arc — E(0°) to S(90°) CW
// Tail at E, tip at S. Draw from E→S CW (0→45→90).
// Arrowhead tip at S, pointing west (-x) — CW tangent at θ=90°: (-sin90, cos90) = (-1,0). ✓
{
  const sa = 0  * Math.PI / 180;  // E
  const ea = 90 * Math.PI / 180;  // S

  ctx.save();
  ctx.strokeStyle = C.red;
  ctx.lineWidth = 6;
  ctx.lineCap = 'butt';
  ctx.beginPath();
  ctx.arc(CX, CY, arcR, sa, ea, false);
  ctx.stroke();
  ctx.restore();

  const tipX = CX + arcR * Math.cos(ea);
  const tipY = CY + arcR * Math.sin(ea);
  arrowhead(tipX, tipY, -1, 0, 18, 11, C.red);
}

// ─── 11. Redraw staves and dots on top of arcs ────────────────────────────────
drawStave('N', C.blue);
drawStave('S', C.red);
ctx.fillStyle = C.black;
ctx.fillRect(CX - hs/2, CY - hs/2, hs, hs);
drawDots();

// ─── 12. Bauhaus geometric letter "A" ────────────────────────────────────────
// Constructed from filled polygons — diagonal legs + horizontal crossbar
// No curves, no serifs. Pure geometric form.

function drawBauhausA(ox, oy, size, color) {
  ctx.save();
  ctx.fillStyle = color;

  const w  = size * 0.62;
  const h  = size;
  const sw = size * 0.10;
  const cx = ox + w / 2;

  function thickLine(x1, y1, x2, y2, half) {
    const dx = x2 - x1, dy = y2 - y1;
    const len = Math.hypot(dx, dy);
    const nx = -dy / len * half, ny = dx / len * half;
    ctx.beginPath();
    ctx.moveTo(x1 + nx, y1 + ny);
    ctx.lineTo(x1 - nx, y1 - ny);
    ctx.lineTo(x2 - nx, y2 - ny);
    ctx.lineTo(x2 + nx, y2 + ny);
    ctx.closePath();
    ctx.fill();
  }

  thickLine(ox,      oy + h, cx,    oy,    sw / 2);
  thickLine(ox + w,  oy + h, cx,    oy,    sw / 2);

  const t = 0.56;
  const leftX  = cx + (ox      - cx) * t - sw * 0.1;
  const rightX = cx + (ox + w  - cx) * t + sw * 0.1;
  const crossY = oy + h * t;
  ctx.fillRect(leftX, crossY - sw * 0.38, rightX - leftX, sw * 0.76);

  ctx.restore();
}

// Large A — black, lower right
drawBauhausA(305, 312, 102, C.black);

// Small red A — top left (catalog marker)
drawBauhausA(18, 62, 28, C.red);

// ─── 13. Compositional accent circle ─────────────────────────────────────────
ctx.beginPath();
ctx.arc(385, 372, 22, 0, Math.PI * 2);
ctx.strokeStyle = C.black;
ctx.lineWidth = 3;
ctx.stroke();
ctx.beginPath();
ctx.arc(385, 372, 5, 0, Math.PI * 2);
ctx.fillStyle = C.black;
ctx.fill();

// ─── 14. Diagonal tension line ────────────────────────────────────────────────
ctx.strokeStyle = C.black;
ctx.lineWidth = 1.5;
ctx.beginPath();
ctx.moveTo(0, 418);
ctx.lineTo(55, 390);
ctx.stroke();

</script>
</body>
</html>
