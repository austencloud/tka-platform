<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bauhaus Pictograph — TKA</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #2A2A2A;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }
    canvas { display: block; image-rendering: crisp-edges; }
      body.embed { min-height: 0; padding: 0; margin: 0; display: block; }
    body.embed canvas { width: 100%; height: auto; }
    body.embed .caption, body.embed .controls, body.embed .scene > :not(canvas) { display: none; }
  </style>
</head>
<body>
<canvas id="canvas" width="500" height="500"></canvas>

<script src="./_shared/pictograph-geometry.js"></script>
<script src="./_shared/pictograph-bridge.js"></script>
<script src="./_shared/pictograph-stylize.js"></script>

<script>
const canvas = document.getElementById('canvas');
const ctx    = canvas.getContext('2d');

// ─── Bauhaus Palette ──────────────────────────────────────────────────────────
const C = {
  cream:  '#F2EDE4',
  black:  '#1A1A1A',
  red:    '#D93025',
  blue:   '#1E3F8A',
  yellow: '#F0C400',
};

// Palette handed to PictographStylize.recolor() when the canonical pipeline
// is available. These are the pure Bauhaus primaries the threshold edge
// treatment will snap every pixel to.
const BAUHAUS_PALETTE = {
  blue:       '#0046D4',   // primary blue
  red:        '#D0282C',   // primary red
  structural: '#0A0A0A',   // black
  bg:         null,
};

const W = 500, H = 500;

// Grid center — shifted left for asymmetric Bauhaus composition
const CX = 210, CY = 240;
const R  = 130;  // radius to grid points

// Convert uppercase compass direction to {x,y} — preserved for the grid dot /
// compass label layout below.
function gp(dir) {
  const deg = { N:-90, NE:-45, E:0, SE:45, S:90, SW:135, W:180, NW:-135 };
  const a = deg[dir] * Math.PI / 180;
  return { x: CX + R * Math.cos(a), y: CY + R * Math.sin(a) };
}

// Draw a solid arrowhead whose TIP is at (tipX, tipY) pointing in direction (tx, ty)
function arrowhead(tipX, tipY, tx, ty, len, wid, color) {
  const nx = -ty, ny = tx;
  const bx = tipX - tx * len, by = tipY - ty * len;
  ctx.beginPath();
  ctx.moveTo(tipX, tipY);
  ctx.lineTo(bx + nx * wid, by + ny * wid);
  ctx.lineTo(bx - nx * wid, by - ny * wid);
  ctx.closePath();
  ctx.fillStyle = color;
  ctx.fill();
}

// ─── Data-driven helpers ─────────────────────────────────────────────────────
// Normalize the TKA location fields to the lowercase keys PictographGeometry
// expects. The hand object may carry `location` or `startLocation`.
function handLoc(hand)    { return String(hand.location    || hand.startLocation || '').toLowerCase(); }
function handEndLoc(hand) { return String(hand.endLocation || '').toLowerCase(); }

// Map the hand's color to the Bauhaus palette, with a sensible default.
function paletteColorFor(hand, fallback) {
  if (!hand) return fallback;
  if (hand.color === 'blue') return C.blue;
  if (hand.color === 'red')  return C.red;
  return fallback;
}

// ─── Draw a flat, block-style stave at the hand's end location ──────────────
// Matches the original Bauhaus stave aesthetic: solid rectangle along the
// staff's long axis, with a perpendicular cap at the outer end.
function drawStaffForHand(hand, color) {
  if (!hand || !window.PictographGeometry) return;
  const G = window.PictographGeometry;
  const endLoc = handEndLoc(hand);
  const center = G.locationPoint(endLoc, CX, CY, R);
  const axisAngle = G.staffAxisAngle(endLoc, hand.orientation || 'in');

  // Dimensions chosen to match the original drawStave():
  //   shaft runs from 14px off-center out to (R - 10)px, with a perpendicular
  //   cap at the outer end.
  const startD = 14, endD = R - 10, halfW = 7, capW = 10;

  ctx.save();
  ctx.translate(CX, CY);
  ctx.rotate(axisAngle);
  ctx.fillStyle = color;
  // Shaft
  ctx.fillRect(startD, -halfW, endD - startD, halfW * 2);
  // Outer cap
  ctx.fillRect(endD - capW, -halfW - 3, capW, halfW * 2 + 6);
  ctx.restore();
}

// ─── Draw an arrow (arc or dash) for a hand's motion ─────────────────────────
function drawArrowForHand(hand, color) {
  if (!hand || hand.motionType === 'static' || !window.PictographGeometry) return;
  const G = window.PictographGeometry;
  const startLoc = handLoc(hand);
  const endLoc   = handEndLoc(hand);
  const s = G.locationPoint(startLoc, CX, CY, R);
  const e = G.locationPoint(endLoc,   CX, CY, R);

  if (hand.motionType === 'dash') {
    // Straight Bauhaus-style line with arrowhead — thick, flat, no curves.
    ctx.save();
    ctx.strokeStyle = color;
    ctx.lineWidth = 6;
    ctx.lineCap = 'butt';
    ctx.beginPath();
    ctx.moveTo(s.x, s.y);
    ctx.lineTo(e.x, e.y);
    ctx.stroke();
    ctx.restore();
    const len = Math.hypot(e.x - s.x, e.y - s.y) || 1;
    arrowhead(e.x, e.y, (e.x - s.x) / len, (e.y - s.y) / len, 18, 11, color);
    return;
  }

  // Arc — pro / anti / float. Resolve visual direction, then draw via
  // ctx.arc with the correct `anticlockwise` flag.
  const dir = G.handDirection(hand) || 'cw';
  const startA = G.locationAngle(startLoc);
  const endA   = G.locationAngle(endLoc);
  if (startA == null || endA == null) return;

  // In canvas coords (y-down): visual CW = angle increasing = ctx.arc
  // anticlockwise=false. Visual CCW = anticlockwise=true.
  const anticlockwise = (dir === 'ccw');

  ctx.save();
  ctx.strokeStyle = color;
  ctx.lineWidth = 6;
  ctx.lineCap = 'butt';
  ctx.beginPath();
  ctx.arc(CX, CY, R, startA, endA, anticlockwise);
  ctx.stroke();
  ctx.restore();

  // Arrowhead at the arc's END, tangent to the circle at that point.
  // Derivative of (cos θ, sin θ) at θ is (-sin θ, cos θ) — that's the CCW
  // tangent. Negate for CW.
  let tanX, tanY;
  if (anticlockwise) { tanX =  Math.sin(endA); tanY = -Math.cos(endA); }
  else               { tanX = -Math.sin(endA); tanY =  Math.cos(endA); }
  arrowhead(e.x, e.y, tanX, tanY, 18, 11, color);
}

// ─── Bauhaus geometric letter "A" ────────────────────────────────────────────
// Constructed from filled polygons — diagonal legs + horizontal crossbar.
// No curves, no serifs. Pure geometric form. Kept for legacy use if we want
// to fall back to drawing the letter glyph directly; the data-driven render
// below uses plain text for arbitrary letters.
function drawBauhausA(ox, oy, size, color) {
  ctx.save();
  ctx.fillStyle = color;

  const w  = size * 0.62;
  const h  = size;
  const sw = size * 0.10;
  const cx = ox + w / 2;

  function thickLine(x1, y1, x2, y2, half) {
    const dx = x2 - x1, dy = y2 - y1;
    const len = Math.hypot(dx, dy);
    const nx = -dy / len * half, ny = dx / len * half;
    ctx.beginPath();
    ctx.moveTo(x1 + nx, y1 + ny);
    ctx.lineTo(x1 - nx, y1 - ny);
    ctx.lineTo(x2 - nx, y2 - ny);
    ctx.lineTo(x2 + nx, y2 + ny);
    ctx.closePath();
    ctx.fill();
  }

  thickLine(ox,      oy + h, cx,    oy,    sw / 2);
  thickLine(ox + w,  oy + h, cx,    oy,    sw / 2);

  const t = 0.56;
  const leftX  = cx + (ox      - cx) * t - sw * 0.1;
  const rightX = cx + (ox + w  - cx) * t + sw * 0.1;
  const crossY = oy + h * t;
  ctx.fillRect(leftX, crossY - sw * 0.38, rightX - leftX, sw * 0.76);

  ctx.restore();
}

// Big letter glyph — uses the geometric A construction for the letter 'A',
// and falls back to a heavy Futura-style fill for any other character so
// every pictograph in the alphabet renders something readable.
function drawBigLetter(letter, ox, oy, size, color) {
  const ch = String(letter || '').trim().charAt(0).toUpperCase();
  if (ch === 'A') {
    drawBauhausA(ox, oy, size, color);
    return;
  }
  ctx.save();
  ctx.fillStyle = color;
  // Approximate the Bauhaus A's visual weight (size ≈ cap height).
  ctx.font = `900 ${size}px "Futura", "Century Gothic", "Gill Sans MT", sans-serif`;
  ctx.textAlign = 'left';
  ctx.textBaseline = 'top';
  ctx.fillText(ch, ox, oy);
  ctx.restore();
}

function drawSmallLetter(letter, ox, oy, size, color) {
  const ch = String(letter || '').trim().charAt(0).toUpperCase();
  if (ch === 'A') {
    drawBauhausA(ox, oy, size, color);
    return;
  }
  ctx.save();
  ctx.fillStyle = color;
  ctx.font = `900 ${size}px "Futura", "Century Gothic", "Gill Sans MT", sans-serif`;
  ctx.textAlign = 'left';
  ctx.textBaseline = 'top';
  ctx.fillText(ch, ox, oy);
  ctx.restore();
}

// ─── Chrome primitives ───────────────────────────────────────────────────────
// Each of these paints one piece of the Bauhaus frame. They're factored out
// so the canonical and fallback render paths can share the same structural
// composition.

function drawBackground() {
  ctx.fillStyle = C.cream;
  ctx.fillRect(0, 0, W, H);
}

function drawBlackBar() {
  // Thick vertical black bar — right compositional anchor.
  ctx.fillStyle = C.black;
  ctx.fillRect(430, 0, 70, H);
}

function drawYellowBlock() {
  // Yellow block — bottom-left.
  ctx.fillStyle = C.yellow;
  ctx.fillRect(0, 415, 55, 85);
}

function drawRedAccent() {
  // Red accent bar — top right.
  ctx.fillStyle = C.red;
  ctx.fillRect(340, 55, 90, 12);
}

function drawFrameRules() {
  // Frame rules — top and left edges (open composition, Bauhaus style).
  ctx.strokeStyle = C.black;
  ctx.lineWidth = 2.5;
  ctx.beginPath();
  ctx.moveTo(0, 0); ctx.lineTo(430, 0);
  ctx.moveTo(0, 0); ctx.lineTo(0, H);
  ctx.stroke();

  // Thin horizontal rule below header
  ctx.fillStyle = C.black;
  ctx.fillRect(0, 50, 430, 2);

  // Thin rule above footer
  ctx.fillRect(0, 418, 430, 1.5);
}

function drawHeader() {
  ctx.fillStyle = C.black;
  ctx.font = '700 11px "Futura", "Century Gothic", "Gill Sans MT", sans-serif';
  ctx.textAlign = 'left';
  ctx.textBaseline = 'middle';
  ctx.fillText('KINETIC ALPHABET', 16, 30);
}

function drawVerticalLabel(letter) {
  const ch = String(letter || '').toUpperCase() || 'A';
  ctx.save();
  ctx.translate(462, 400);
  ctx.rotate(-Math.PI / 2);
  ctx.fillStyle = C.cream;
  ctx.font = '700 10px "Futura", "Century Gothic", "Gill Sans MT", sans-serif';
  ctx.textAlign = 'left';
  ctx.textBaseline = 'middle';
  ctx.fillText(`PICTOGRAPH  ${ch}`, 0, 0);
  ctx.restore();
}

function drawFooter() {
  ctx.fillStyle = C.black;
  ctx.font = '600 9.5px "Futura", "Century Gothic", "Gill Sans MT", sans-serif';
  ctx.textAlign = 'left';
  ctx.textBaseline = 'middle';
  ctx.fillText('1923', 16, 432);
  ctx.fillText('TYPE 1  ·  PRO', 65, 432);
  ctx.textAlign = 'right';
  ctx.fillText('NO. 01', 422, 432);
}

function drawGridDots() {
  ['N','NE','E','SE','S','SW','W','NW'].forEach(dir => {
    const p = gp(dir);
    ctx.beginPath();
    ctx.arc(p.x, p.y, 5, 0, Math.PI * 2);
    ctx.fillStyle = C.black;
    ctx.fill();
  });
}

function drawCompassLabels() {
  ctx.font = '700 8px "Futura", "Century Gothic", "Gill Sans MT", sans-serif';
  ctx.fillStyle = C.black;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  [
    { dir:'N', ox: 0,   oy:-17 },
    { dir:'E', ox: 17,  oy:  0 },
    { dir:'S', ox: 0,   oy: 17 },
    { dir:'W', ox:-17,  oy:  0 },
  ].forEach(({ dir, ox, oy }) => {
    const p = gp(dir);
    ctx.fillText(dir, p.x + ox, p.y + oy);
  });
}

function drawCenterHub() {
  const hs = 18;
  ctx.fillStyle = C.black;
  ctx.fillRect(CX - hs/2, CY - hs/2, hs, hs);
}

function drawBigLetterGlyph(letter) {
  const ch = String(letter || '').toUpperCase() || 'A';
  drawBigLetter(ch, 305, 312, 102, C.black);
}

function drawSmallLetterGlyph(letter) {
  const ch = String(letter || '').toUpperCase() || 'A';
  drawSmallLetter(ch, 18, 62, 28, C.red);
}

function drawAccentCircle() {
  ctx.beginPath();
  ctx.arc(385, 372, 22, 0, Math.PI * 2);
  ctx.strokeStyle = C.black;
  ctx.lineWidth = 3;
  ctx.stroke();
  ctx.beginPath();
  ctx.arc(385, 372, 5, 0, Math.PI * 2);
  ctx.fillStyle = C.black;
  ctx.fill();
}

function drawDiagonalTensionLine() {
  ctx.strokeStyle = C.black;
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.moveTo(0, 418);
  ctx.lineTo(55, 390);
  ctx.stroke();
}

// ─── Full scene render ───────────────────────────────────────────────────────
// Two paths:
//
//   1. Canonical bitmap available (parent rendered via Canvas2DDirectRenderer):
//      recolor into pure Bauhaus primaries, run the threshold edge treatment
//      so every pixel snaps to blue / red / structural black with no
//      anti-aliased halos, then composite in a single full-opacity pass.
//      This gives the clean geometric shapes Bauhaus demands while inheriting
//      correct motion semantics (pro vs anti, dashes, turns indicators) from
//      the canonical renderer.
//
//   2. No canonical (standalone page open, or canonical render failed):
//      fall back to the original data-driven arrow + staff rendering so the
//      page still produces a meaningful image.
//
// Era chrome (background, black bar, yellow block, red accent, frame rules,
// header, footer, big letter, accent circle, tension line) is drawn
// identically either way.
function render(data, canonical /* ImageBitmap | null */, meta /* object | null */) {
  const letter = String((data && data.letter) || '').toUpperCase() || 'A';
  const blue = data && data.blueHand;
  const red  = data && data.redHand;
  const blueColor = paletteColorFor(blue, C.blue);
  const redColor  = paletteColorFor(red,  C.red);

  // Background + geometric chrome (always drawn first)
  drawBackground();
  drawBlackBar();
  drawYellowBlock();
  drawRedAccent();
  drawFrameRules();
  drawHeader();
  drawVerticalLabel(letter);
  drawFooter();

  // Grid chrome
  drawGridDots();
  drawCompassLabels();

  if (canonical && window.PictographStylize) {
    // Path 1: recolor canonical to Bauhaus primaries, threshold to hard
    // edges, composite once at full opacity. No pixelation — Bauhaus is
    // about clean geometric shapes, not chunky blocks.
    const styled = window.PictographStylize.recolor(canonical, BAUHAUS_PALETTE, W);
    window.PictographStylize.edgeTreatment(styled, 'threshold');
    ctx.drawImage(styled, 0, 0, W, H);
  } else {
    // Fallback: original data-driven arrow + staff rendering
    if (blue) drawArrowForHand(blue, blueColor);
    if (red)  drawArrowForHand(red,  redColor);
    if (blue) drawStaffForHand(blue, blueColor);
    if (red)  drawStaffForHand(red,  redColor);
  }

  // Chrome on top of pictograph
  drawCenterHub();
  drawGridDots();  // redraw so dots sit above arcs at the grid points
  drawBigLetterGlyph(letter);
  drawSmallLetterGlyph(letter);
  drawAccentCircle();
  drawDiagonalTensionLine();
}

// ─── Default pictograph — Letter A. Rendered immediately so the page isn't
//     blank when opened standalone; replaced by whatever the parent posts.
const DEFAULT_PICTOGRAPH = {
  letter: 'A',
  gridMode: 'diamond',
  blueHand: {
    color: 'blue',
    location: 'w', endLocation: 'n',
    motionType: 'pro', rotationDirection: 'cw',
    orientation: 'in', turns: 0,
  },
  redHand: {
    color: 'red',
    location: 'e', endLocation: 's',
    motionType: 'pro', rotationDirection: 'cw',
    orientation: 'in', turns: 0,
  },
};

render(DEFAULT_PICTOGRAPH, null, null);

if (window.PictographBridge) {
  window.PictographBridge.onPictograph(function(data, canonical, meta) {
    render(data, canonical, meta);
  });
}
</script>
<script>if(location.search.includes("embed"))document.body.classList.add("embed")</script>
</body>
</html>
