<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TKA — Cave Painting (~40,000 BC)</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #1a1510;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-family: serif;
    }

    .scene {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 18px;
    }

    canvas {
      display: block;
    }

    .caption {
      color: #7a6248;
      font-size: 12px;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      opacity: 0.85;
      text-align: center;
    }
      body.embed { min-height: 0; padding: 0; margin: 0; display: block; }
    body.embed canvas { width: 100%; height: auto; }
    body.embed .caption, body.embed .controls, body.embed .scene > :not(canvas) { display: none; }
  </style>
</head>
<body>
<div class="scene">
  <canvas id="cave" width="500" height="500"></canvas>
  <div class="caption">Grotte des Séquences — Parietal Period — ~38,000 BCE</div>
</div>

<script src="./_shared/pictograph-geometry.js"></script>
<script src="./_shared/pictograph-bridge.js"></script>
<script src="./_shared/pictograph-stylize.js"></script>

<script>
// ─────────────────────────────────────────────────────────────────────────────
// Cave Painting Renderer — paints any pictograph in Lascaux mineral pigments.
//
// Receives RetroPictographData via PictographBridge and redraws on each change.
// Uses PictographGeometry to resolve staff orientations and arc directions.
// ─────────────────────────────────────────────────────────────────────────────

const canvas = document.getElementById('cave');
const ctx = canvas.getContext('2d');
const W = 500, H = 500;

// Offscreen cache for the stone wall background — it's expensive to compute
// and identical for every pictograph, so we prepare it once.
const bgCanvas = document.createElement('canvas');
bgCanvas.width = W;
bgCanvas.height = H;
const bgCtx = bgCanvas.getContext('2d');

// ── Seeded PRNG (Mulberry32) — reseeded per render for determinism ───────────
let rng = mulberry32(0xDEADBEEF);
function mulberry32(seed) {
  return function() {
    seed |= 0; seed = seed + 0x6D2B79F5 | 0;
    let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

function seedFor(data) {
  // Any stable hash of the pictograph identity — so navigating forward/back
  // reproduces the same scatter/wobble for each letter.
  const s = `${data.letter}|${data.blueHand.location}|${data.blueHand.endLocation}|${data.blueHand.motionType}|${data.redHand.location}|${data.redHand.endLocation}|${data.redHand.motionType}`;
  let h = 0xDEADBEEF;
  for (let i = 0; i < s.length; i++) {
    h = (h ^ s.charCodeAt(i)) * 16777619 >>> 0;
  }
  return h;
}

// ── Noise helpers ─────────────────────────────────────────────────────────────
function hash(x, y) {
  let n = Math.sin(x * 127.1 + y * 311.7) * 43758.5453123;
  return n - Math.floor(n);
}
function smoothstep(t) { return t * t * (3 - 2 * t); }
function lerp(a, b, t) { return a + (b - a) * t; }
function noise2d(x, y) {
  const ix = Math.floor(x), iy = Math.floor(y);
  const fx = x - ix, fy = y - iy;
  const ux = smoothstep(fx), uy = smoothstep(fy);
  return lerp(
    lerp(hash(ix, iy),   hash(ix + 1, iy),   ux),
    lerp(hash(ix, iy+1), hash(ix + 1, iy+1), ux),
    uy
  );
}
function fbm(x, y, octaves = 5) {
  let val = 0, amp = 0.5, freq = 1, max = 0;
  for (let i = 0; i < octaves; i++) {
    val += noise2d(x * freq, y * freq) * amp;
    max += amp;
    amp *= 0.5;
    freq *= 2.1;
  }
  return val / max;
}

// ── Stone wall — drawn once into bgCanvas ────────────────────────────────────
function drawStoneWall(targetCtx) {
  targetCtx.fillStyle = '#b08060';
  targetCtx.fillRect(0, 0, W, H);

  const imgData = targetCtx.getImageData(0, 0, W, H);
  const d = imgData.data;

  for (let y = 0; y < H; y++) {
    for (let x = 0; x < W; x++) {
      const nx = x / W * 4.3;
      const ny = y / H * 4.3;

      const base   = fbm(nx, ny, 6);
      const detail = fbm(nx * 3.7 + 1.1, ny * 3.7 + 0.9, 4);
      const crack  = fbm(nx * 0.8 + 5.2, ny * 1.2 + 3.1, 3);
      const fine   = noise2d(nx * 12, ny * 12);

      const combined = base * 0.5 + detail * 0.3 + crack * 0.15 + fine * 0.05;

      const r0 = 100, g0 = 75,  b0 = 50;
      const r1 = 155, g1 = 118, b1 = 78;
      const r2 = 178, g2 = 142, b2 = 98;
      const r3 = 200, g3 = 168, b3 = 125;

      let t = Math.pow(combined, 0.75);
      t = 0.35 + t * 0.65;

      let r, g, b;
      if (t < 0.5) {
        const u = t * 2;
        r = lerp(r0, r1, u); g = lerp(g0, g1, u); b = lerp(b0, b1, u);
      } else if (t < 0.8) {
        const u = (t - 0.5) / 0.3;
        r = lerp(r1, r2, u); g = lerp(g1, g2, u); b = lerp(b1, b2, u);
      } else {
        const u = (t - 0.8) / 0.2;
        r = lerp(r2, r3, u); g = lerp(g2, g3, u); b = lerp(b2, b3, u);
      }

      const vein = fbm(nx * 6 + 2.2, ny * 1.4 + 7.3, 2);
      const veinStrength = Math.max(0, vein - 0.62) * 2.2;
      r += veinStrength * 25;
      g += veinStrength * 20;
      b += veinStrength * 15;

      const ochreN = fbm(nx * 2.1 + 9.1, ny * 2.5 + 4.3, 3);
      const ochre = Math.max(0, ochreN - 0.54) * 2.5;
      r += ochre * 18;
      g += ochre * 8;
      b -= ochre * 5;

      const edgeDx = (x / W) * 2 - 1;
      const edgeDy = (y / H) * 2 - 1;
      const edgeDist = Math.sqrt(edgeDx * edgeDx + edgeDy * edgeDy);
      const vignetteFactor = Math.max(0, edgeDist - 1.05) * 0.9;
      const vignette = 1 - Math.min(0.35, vignetteFactor);

      r *= vignette; g *= vignette; b *= vignette;

      const idx = (y * W + x) * 4;
      d[idx]     = Math.min(255, Math.max(0, r | 0));
      d[idx + 1] = Math.min(255, Math.max(0, g | 0));
      d[idx + 2] = Math.min(255, Math.max(0, b | 0));
      d[idx + 3] = 255;
    }
  }

  targetCtx.putImageData(imgData, 0, 0);
}

// ── Pigment primitives (opacity used DIRECTLY, no hidden multiplier) ─────────
function pigmentStroke(x1, y1, x2, y2, color, width, opacity, roughness = 1.0) {
  const dist = Math.hypot(x2 - x1, y2 - y1);
  const steps = Math.max(18, dist * 1.6 | 0);
  const angle = Math.atan2(y2 - y1, x2 - x1);

  ctx.save();

  for (let s = 0; s < steps; s++) {
    const t = s / Math.max(1, steps - 1);
    const wobble = (rng() - 0.5) * width * roughness * 0.7;
    const perpX = -Math.sin(angle) * wobble;
    const perpY =  Math.cos(angle) * wobble;
    const cx = lerp(x1, x2, t) + perpX + (rng() - 0.5) * roughness * 1.5;
    const cy = lerp(y1, y2, t) + perpY + (rng() - 0.5) * roughness * 1.5;

    const blobW = (width * 0.5 + rng() * width * 0.6) * (0.7 + t * 0.3);
    const blobH = blobW * (0.45 + rng() * 0.4);
    const blobAngle = angle + (rng() - 0.5) * 0.7;

    ctx.globalAlpha = opacity * (0.55 + rng() * 0.45);
    ctx.fillStyle = color;
    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(blobAngle);
    ctx.beginPath();
    ctx.ellipse(0, 0, blobW, blobH, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }

  ctx.restore();
}

function pigmentDaub(x, y, r, color, opacity) {
  ctx.save();
  ctx.globalAlpha = opacity * 0.85;
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.ellipse(x, y, r * 0.9, r * 0.75, rng() * Math.PI, 0, Math.PI * 2);
  ctx.fill();

  const rings = 3 + (rng() * 2 | 0);
  for (let i = 0; i < rings; i++) {
    const jx = (rng() - 0.5) * r * 0.5;
    const jy = (rng() - 0.5) * r * 0.5;
    const jr = r * (0.55 + rng() * 0.55);
    ctx.globalAlpha = opacity * (0.3 + rng() * 0.35);
    ctx.beginPath();
    ctx.ellipse(x + jx, y + jy, jr, jr * (0.65 + rng() * 0.35), rng() * Math.PI, 0, Math.PI * 2);
    ctx.fill();
  }

  ctx.strokeStyle = color;
  ctx.lineWidth = 1.0 + rng() * 0.8;
  for (let arc = 0; arc < 4; arc++) {
    ctx.globalAlpha = opacity * (0.45 + rng() * 0.2);
    const startA = rng() * Math.PI;
    ctx.beginPath();
    ctx.arc(
      x + (rng() - 0.5) * 3,
      y + (rng() - 0.5) * 3,
      r * (0.3 + arc * 0.12),
      startA,
      startA + Math.PI * (0.5 + rng() * 0.9)
    );
    ctx.stroke();
  }
  ctx.restore();
}

function pigmentArc(cx, cy, radius, startAngle, endAngle, color, width, opacity) {
  const steps = 60;
  const points = [];
  for (let i = 0; i <= steps; i++) {
    const t = i / steps;
    const a = lerp(startAngle, endAngle, t);
    const r = radius + (rng() - 0.5) * width * 0.8;
    points.push({ x: cx + Math.cos(a) * r, y: cy + Math.sin(a) * r });
  }

  ctx.save();

  const passes = [
    { widthMult: 1.6, alpha: opacity * 0.35 },
    { widthMult: 1.1, alpha: opacity * 0.65 },
    { widthMult: 0.7, alpha: opacity * 0.85 },
  ];

  for (const pass of passes) {
    ctx.globalAlpha = pass.alpha;
    ctx.strokeStyle = color;
    ctx.lineWidth = width * pass.widthMult + rng() * width * 0.3;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';

    ctx.beginPath();
    for (let i = 0; i < points.length; i++) {
      const jx = (rng() - 0.5) * width * 0.3;
      const jy = (rng() - 0.5) * width * 0.3;
      if (i === 0) ctx.moveTo(points[i].x + jx, points[i].y + jy);
      else ctx.lineTo(points[i].x + jx, points[i].y + jy);
    }
    ctx.stroke();
  }

  // Arrowhead — solid
  const endPt  = points[points.length - 1];
  const prevPt = points[points.length - 7];
  const headAngle = Math.atan2(endPt.y - prevPt.y, endPt.x - prevPt.x);
  const headLen = width * 3.2;

  ctx.globalAlpha = opacity * 0.92;
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.moveTo(endPt.x, endPt.y);
  ctx.lineTo(
    endPt.x - Math.cos(headAngle - 0.52) * headLen + (rng() - 0.5) * 4,
    endPt.y - Math.sin(headAngle - 0.52) * headLen + (rng() - 0.5) * 4
  );
  ctx.lineTo(
    endPt.x - Math.cos(headAngle + 0.52) * headLen + (rng() - 0.5) * 4,
    endPt.y - Math.sin(headAngle + 0.52) * headLen + (rng() - 0.5) * 4
  );
  ctx.closePath();
  ctx.fill();

  ctx.restore();
}

function pigmentArrowhead(fromX, fromY, toX, toY, color, width, opacity) {
  const angle = Math.atan2(toY - fromY, toX - fromX);
  const headLen = width * 3.2;
  ctx.save();
  ctx.globalAlpha = opacity * 0.92;
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.moveTo(toX, toY);
  ctx.lineTo(
    toX - Math.cos(angle - 0.52) * headLen + (rng() - 0.5) * 4,
    toY - Math.sin(angle - 0.52) * headLen + (rng() - 0.5) * 4
  );
  ctx.lineTo(
    toX - Math.cos(angle + 0.52) * headLen + (rng() - 0.5) * 4,
    toY - Math.sin(angle + 0.52) * headLen + (rng() - 0.5) * 4
  );
  ctx.closePath();
  ctx.fill();
  ctx.restore();
}

function carvedScratch(x1, y1, x2, y2, opacity = 0.55) {
  const dist = Math.hypot(x2 - x1, y2 - y1);
  const steps = Math.max(3, dist / 10 | 0);

  ctx.save();
  ctx.lineCap = 'round';

  ctx.strokeStyle = '#3a2a18';
  ctx.lineWidth = 1.8 + rng() * 1.0;
  ctx.globalAlpha = opacity;
  ctx.beginPath();
  for (let i = 0; i <= steps; i++) {
    const t = i / steps;
    const px = lerp(x1, x2, t) + (rng() - 0.5) * 2.0;
    const py = lerp(y1, y2, t) + (rng() - 0.5) * 2.0;
    if (i === 0) ctx.moveTo(px, py);
    else ctx.lineTo(px, py);
  }
  ctx.stroke();

  ctx.strokeStyle = '#c8a870';
  ctx.lineWidth = 0.7;
  ctx.globalAlpha = opacity * 0.55;
  ctx.beginPath();
  for (let i = 0; i <= steps; i++) {
    const t = i / steps;
    const px = lerp(x1 + 1, x2 + 1, t) + (rng() - 0.5) * 1.2;
    const py = lerp(y1 + 1, y2 + 1, t) + (rng() - 0.5) * 1.2;
    if (i === 0) ctx.moveTo(px, py);
    else ctx.lineTo(px, py);
  }
  ctx.stroke();

  ctx.restore();
}

function gridDot(x, y) {
  pigmentDaub(x, y, 8, '#7a5228', 0.75);
  pigmentDaub(x, y, 4, '#4a2e12', 0.85);
}

function handprint(cx, cy, scale = 1.0, color = '#8b3a1a', opacity = 0.80) {
  ctx.save();
  ctx.translate(cx, cy);
  ctx.scale(scale, scale);
  ctx.globalAlpha = opacity;
  ctx.fillStyle = color;

  ctx.beginPath();
  ctx.ellipse(0, 8, 13, 17, 0.1, 0, Math.PI * 2);
  ctx.fill();

  const fingers = [
    { x: -11, y: -6,  rx: 4.5, ry: 10, rot: -0.35 },
    { x: -4,  y: -13, rx: 4,   ry: 11, rot: -0.12 },
    { x:  4,  y: -14, rx: 4,   ry: 11, rot:  0.08 },
    { x: 11,  y: -10, rx: 4,   ry: 10, rot:  0.28 },
    { x: 16,  y:  -2, rx: 3.5, ry:  8, rot:  0.55 },
  ];
  fingers.forEach(f => {
    ctx.save();
    ctx.translate(f.x, f.y);
    ctx.rotate(f.rot);
    ctx.beginPath();
    ctx.ellipse(0, 0, f.rx + rng() * 1.2, f.ry + rng() * 1.8, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  });

  ctx.globalAlpha = opacity * 0.35;
  ctx.strokeStyle = '#2a1208';
  ctx.lineWidth = 1.5;
  fingers.slice(0, 4).forEach(f => {
    ctx.beginPath();
    ctx.arc(f.x + (rng()-0.5)*2, f.y + 5 + (rng()-0.5)*2, 3 + rng()*1.5, 0.3, Math.PI - 0.3);
    ctx.stroke();
  });

  ctx.restore();
}

// ─────────────────────────────────────────────────────────────────────────────
// Grid layout
// ─────────────────────────────────────────────────────────────────────────────
const CX = 248, CY = 250;
const R  = 88;

// ── Color palettes ────────────────────────────────────────────────────────────
const CHAR_DARK = '#1e1a2e';
const CHAR_MID  = '#2e2848';
const CHAR_BLUE = '#3a3560';

const OCHRE       = '#9b621e';
const SIENNA      = '#8a3a1a';
const SIENNA_DARK = '#6a2610';

// ─────────────────────────────────────────────────────────────────────────────
// Glyph rendering — uses PictographGeometry to resolve every location/angle.
// ─────────────────────────────────────────────────────────────────────────────
function drawGrid() {
  const G = PictographGeometry;
  const N  = G.locationPoint('n',  CX, CY, R);
  const E  = G.locationPoint('e',  CX, CY, R);
  const S  = G.locationPoint('s',  CX, CY, R);
  const Wp = G.locationPoint('w',  CX, CY, R);
  const NE = G.locationPoint('ne', CX, CY, R);
  const SE = G.locationPoint('se', CX, CY, R);
  const SW = G.locationPoint('sw', CX, CY, R);
  const NW = G.locationPoint('nw', CX, CY, R);

  const gridLineOpacity = 0.35;
  carvedScratch(Wp.x - 12, CY,        E.x + 12,  CY,        gridLineOpacity);
  carvedScratch(CX,        N.y - 12,  CX,        S.y + 12,  gridLineOpacity);
  carvedScratch(NW.x - 8,  NW.y - 8,  SE.x + 8,  SE.y + 8,  gridLineOpacity * 0.65);
  carvedScratch(NE.x + 8,  NE.y - 8,  SW.x - 8,  SW.y + 8,  gridLineOpacity * 0.65);

  [N, NE, E, SE, S, SW, Wp, NW].forEach(pt => gridDot(pt.x, pt.y));
  gridDot(CX, CY);
}

function drawArrow(hand, softColor, boldColor) {
  const G = PictographGeometry;
  const archetype = G.motionArchetype(hand);
  if (archetype === 'none' || archetype === 'static') return;

  if (archetype === 'arc') {
    const dir = G.handDirection(hand);
    if (!dir) return;
    const angles = G.arcAngles(hand.location, hand.endLocation, dir);
    if (!angles) return;
    pigmentArc(CX, CY, R, angles.startA, angles.endA, softColor, 14, 0.55);
    pigmentArc(CX, CY, R, angles.startA, angles.endA, boldColor, 10, 0.80);
    return;
  }

  if (archetype === 'dash') {
    const s = G.locationPoint(hand.location,   CX, CY, R);
    const e = G.locationPoint(hand.endLocation, CX, CY, R);
    for (let p = 0; p < 3; p++) pigmentStroke(s.x, s.y, e.x, e.y, boldColor, 10, 0.72, 0.9);
    for (let p = 0; p < 2; p++) pigmentStroke(s.x, s.y, e.x, e.y, softColor,  6, 0.55, 0.7);
    pigmentArrowhead(s.x, s.y, e.x, e.y, boldColor, 10, 0.85);
  }
}

function drawStaff(hand, mainColor, darkColor, tipColor) {
  const G = PictographGeometry;
  const center = G.locationPoint(hand.endLocation, CX, CY, R);
  const axis = G.staffAxisAngle(hand.endLocation, hand.orientation);
  const length = R * 1.25; // total staff length in pixels

  const { a, b } = G.staffEndpoints(center, axis, length);

  for (let pass = 0; pass < 4; pass++) {
    pigmentStroke(a.x, a.y, b.x, b.y, darkColor, 11, 0.75, 1.1);
  }
  for (let pass = 0; pass < 2; pass++) {
    pigmentStroke(a.x, a.y, b.x, b.y, mainColor, 6, 0.60, 0.7);
  }

  // End caps — thumb end (a) vs pinky end (b). We don't distinguish which is
  // which at this fidelity; both are drawn with the tip color.
  pigmentDaub(a.x, a.y, 6, tipColor,  0.80);
  pigmentDaub(b.x, b.y, 6, darkColor, 0.80);
}

// ── Letter glyph — "scratched into the stone" in the upper-right corner ─────
function scratchedLetter(letter, cx, cy, size, opacity) {
  if (!letter) return;
  ctx.save();
  ctx.globalAlpha = opacity;
  ctx.fillStyle = '#3a2a18';
  ctx.strokeStyle = '#c8a870';
  ctx.lineWidth = 1.2;
  ctx.font = `${size}px "Times New Roman", serif`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';

  // Jitter a few times for a carved feel
  for (let j = 0; j < 4; j++) {
    ctx.fillStyle = j < 2 ? '#3a2a18' : '#2a1c0e';
    ctx.globalAlpha = opacity * (0.4 + rng() * 0.3);
    ctx.fillText(letter, cx + (rng() - 0.5) * 2, cy + (rng() - 0.5) * 2);
  }
  // Light-catch stroke on top for the carved groove highlight
  ctx.globalAlpha = opacity * 0.35;
  ctx.strokeStyle = '#c8a870';
  ctx.strokeText(letter, cx + 1, cy + 1);
  ctx.restore();
}

function drawSurfaceTexture() {
  const overlay = ctx.getImageData(0, 0, W, H);
  const od = overlay.data;
  for (let y = 0; y < H; y++) {
    for (let x = 0; x < W; x++) {
      const nx = x / W * 9.7;
      const ny = y / H * 9.7;
      const grain  = noise2d(nx * 22, ny * 22);
      const micro  = noise2d(nx * 68, ny * 68);
      const spatter = Math.pow(
        Math.max(0, fbm(nx * 1.4 + 12.1, ny * 1.4 + 8.7, 4) - 0.72),
        1.6
      ) * 2.5;

      const grainVal = (grain - 0.5) * 12 + (micro - 0.5) * 4;
      const idx = (y * W + x) * 4;
      od[idx]     = Math.min(255, Math.max(0, od[idx]     + grainVal     | 0));
      od[idx + 1] = Math.min(255, Math.max(0, od[idx + 1] + grainVal * 0.92 | 0));
      od[idx + 2] = Math.min(255, Math.max(0, od[idx + 2] + grainVal * 0.82 | 0));

      if (spatter > 0.02) {
        const s = spatter * 22;
        od[idx]     = Math.min(255, od[idx]     + s | 0);
        od[idx + 1] = Math.min(255, od[idx + 1] + s | 0);
        od[idx + 2] = Math.min(255, od[idx + 2] + s * 0.8 | 0);
      }
    }
  }
  ctx.putImageData(overlay, 0, 0);
}

function drawVignette() {
  const grd = ctx.createRadialGradient(CX, CY, W * 0.5, CX, CY, W * 0.82);
  grd.addColorStop(0,   'rgba(0,0,0,0)');
  grd.addColorStop(0.7, 'rgba(0,0,0,0.04)');
  grd.addColorStop(1,   'rgba(0,0,0,0.18)');
  ctx.fillStyle = grd;
  ctx.fillRect(0, 0, W, H);
}

// ─────────────────────────────────────────────────────────────────────────────
// Render — called on every pictograph update
//
// Two paths:
//   1. Canonical bitmap available (parent rendered via Canvas2DDirectRenderer):
//      recolor into charcoal/iron-oxide palette, apply pigment edge jitter,
//      composite onto the stone background. This path inherits all correct
//      motion semantics — pro vs anti, turns indicators, dashes, floats — from
//      the canonical renderer without reimplementing them here.
//
//   2. No canonical (standalone page open, or canonical render failed):
//      fall back to the original data-driven pigment rendering so the page
//      still produces a meaningful image.
//
// Era chrome (stone wall, scratched letter, handprint, texture, vignette) is
// drawn identically either way — that's where this era's voice lives.
// ─────────────────────────────────────────────────────────────────────────────
const CAVE_PALETTE = {
  blue:       CHAR_DARK,
  red:        SIENNA_DARK,
  structural: '#3a2a18',
  bg:         null,  // transparent — stone wall shows through
};

function render(data, canonical /* ImageBitmap | null */) {
  // Blit cached stone background
  ctx.drawImage(bgCanvas, 0, 0);

  // Reseed so each pictograph produces stable scatter
  rng = mulberry32(seedFor(data));

  if (canonical && window.PictographStylize) {
    // Path 1: pixelate + recolor + pigment pixel treatment + layered composite.
    //   1. pixelate — downsample canonical to 90px then upsample with nearest
    //      neighbor so clean SVG edges become chunky pigment-scale blocks
    //   2. recolor — map the canonical's blue/red/structural classes to
    //      charcoal / iron-oxide / dark-ochre
    //   3. pigment treatment — displace pixels along a noise field, vary
    //      alpha for thickness variation, scatter darker flecks
    //   4. multi-pass composite — draw the styled canvas three times at
    //      slightly different offsets and opacities so strokes feel layered
    const chunky = window.PictographStylize.pixelate(canonical, W, 90);
    const styled = window.PictographStylize.recolor(chunky, CAVE_PALETTE, W);
    window.PictographStylize.edgeTreatment(styled, 'pigment', rng);

    const offsets = [
      { dx:  0, dy:  0, alpha: 0.85 },
      { dx:  2, dy: -1, alpha: 0.45 },
      { dx: -1, dy:  2, alpha: 0.35 },
    ];
    for (const off of offsets) {
      ctx.save();
      ctx.globalAlpha = off.alpha;
      ctx.drawImage(styled, off.dx, off.dy, W, H);
      ctx.restore();
    }
  } else {
    // Fallback: original data-driven pigment rendering
    drawGrid();
    drawArrow(data.blueHand, CHAR_BLUE, CHAR_DARK);
    drawArrow(data.redHand,  SIENNA,    SIENNA_DARK);
    drawStaff(data.blueHand, CHAR_BLUE, CHAR_DARK, CHAR_MID);
    drawStaff(data.redHand,  SIENNA,    SIENNA_DARK, OCHRE);
  }

  // Era chrome (same for both paths)
  scratchedLetter(String(data.letter || ''), CX + 148, CY - 135, 34, 0.85);
  handprint(72, 418, 1.05, '#8a3518', 0.80);
  handprint(70, 416, 1.05, '#6a2510', 0.45);

  drawSurfaceTexture();
  drawVignette();
}

// ─────────────────────────────────────────────────────────────────────────────
// Boot
// ─────────────────────────────────────────────────────────────────────────────

// Default pictograph — rendered immediately so the page isn't blank before a
// parent posts data. Also used when this HTML is opened directly.
const DEFAULT_PICTOGRAPH = {
  letter: 'A',
  gridMode: 'diamond',
  blueHand: {
    color: 'blue',
    location: 'w', endLocation: 'n',
    motionType: 'pro', rotationDirection: 'cw',
    orientation: 'in', turns: 0,
  },
  redHand: {
    color: 'red',
    location: 'e', endLocation: 's',
    motionType: 'pro', rotationDirection: 'cw',
    orientation: 'in', turns: 0,
  },
};

drawStoneWall(bgCtx);
render(DEFAULT_PICTOGRAPH, null);

PictographBridge.onPictograph(function(data, canonical, meta) {
  render(data, canonical);
});
</script>
<script>if(location.search.includes("embed"))document.body.classList.add("embed")</script>
</body>
