<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TKA — Litera A — Studio di Moto Circolare</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #2a1f0e;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      font-family: serif;
    }
    canvas {
      display: block;
      image-rendering: high-quality;
    }
      body.embed { min-height: 0; padding: 0; margin: 0; display: block; }
    body.embed canvas { width: 100%; height: auto; }
    body.embed .caption, body.embed .controls, body.embed .scene > :not(canvas) { display: none; }
  </style>
</head>
<body>
<canvas id="c" width="500" height="500"></canvas>
<script src="./_shared/pictograph-geometry.js"></script>
<script src="./_shared/pictograph-bridge.js"></script>
<script src="./_shared/pictograph-stylize.js"></script>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

// ─── Palette ────────────────────────────────────────────────────────────────
const INK_DARK    = '#3B2A1A';   // primary ink — darkest sepia
const INK_MED     = '#6B4E32';   // secondary ink — medium sepia
const INK_LIGHT   = '#9B7A55';   // construction lines
const INK_GHOST   = '#C4A882';   // faintest annotations
const PAPER_BASE  = '#F0E0C0';   // warm cream
const PAPER_AGED  = '#E8D0A0';   // slightly more amber patches
const FOX_SPOT    = '#C8A86840'; // foxing spots (semi-transparent)

// ─── Canonical-compose Path 1 palette ─────────────────────────────────────────
// Maps the canonical renderer's blue/red/structural classes onto the studio's
// ink palette — iron gall ink for blue, sepia for red, pencil graphite for the
// structural strokes (grid lines, crosshairs, axes from the canonical render).
// bg is null so the aged paper shows through.
const RENAISSANCE_PALETTE = {
  blue:       '#2A3258',  // iron gall ink
  red:        '#6A2A18',  // sepia ink
  structural: '#5A4028',  // pencil graphite
  bg:         null,
};

const CX = 250, CY = 250;       // canvas center = pictograph center
const W = 500, H = 500;         // canvas dimensions
const GRID_R = 130;             // radius to grid points

// ─── Utility helpers ─────────────────────────────────────────────────────────
function pt(angleDeg, r = GRID_R) {
  const a = (angleDeg - 90) * Math.PI / 180;
  return { x: CX + r * Math.cos(a), y: CY + r * Math.sin(a) };
}

// "Hand-drawn" jitter — very subtle to preserve precision aesthetic
function jitter(v, amt = 0.6) {
  return v + (Math.random() - 0.5) * amt;
}

function lineVar(x1, y1, x2, y2, segments = 12, drift = 0.7) {
  // Slightly wavering line simulating pen drag
  ctx.beginPath();
  ctx.moveTo(jitter(x1, drift), jitter(y1, drift));
  for (let i = 1; i <= segments; i++) {
    const t = i / segments;
    const x = x1 + (x2 - x1) * t;
    const y = y1 + (y2 - y1) * t;
    ctx.lineTo(jitter(x, drift), jitter(y, drift));
  }
  ctx.stroke();
}

// Draw a slight-pressure-variation circle
function circleVar(cx, cy, r, segments = 60, drift = 0.5) {
  ctx.beginPath();
  for (let i = 0; i <= segments; i++) {
    const a = (i / segments) * Math.PI * 2;
    const rx = cx + (r + (Math.random() - 0.5) * drift) * Math.cos(a);
    const ry = cy + (r + (Math.random() - 0.5) * drift) * Math.sin(a);
    i === 0 ? ctx.moveTo(rx, ry) : ctx.lineTo(rx, ry);
  }
  ctx.closePath();
  ctx.stroke();
}

// ─── Renaissance hand colors ──────────────────────────────────────────────────
// The era's ink palette is sepia, not RGB — so blue/red are mapped onto the
// darkest and medium sepia inks the original Letter A study used.
const BLUE_COLOR = INK_DARK;
const RED_COLOR  = INK_MED;

// ─── Data-driven hand helpers ─────────────────────────────────────────────────
// These read the pictograph's blue/red hand data and draw each prop's staff
// and motion arrow. The era's hand-drawn aesthetic (jittered lineVar, pressure
// circleVar) is preserved — only the positions come from data now.

function handLoc(hand)    { return String(hand.location    || hand.startLocation || '').toLowerCase(); }
function handEndLoc(hand) { return String(hand.endLocation || '').toLowerCase(); }

function drawArrowForHand(hand, color) {
  if (!hand || hand.motionType === 'static' || !window.PictographGeometry) return;
  const G = window.PictographGeometry;
  const s = G.locationPoint(handLoc(hand),    CX, CY, GRID_R);
  const e = G.locationPoint(handEndLoc(hand), CX, CY, GRID_R);
  if (!s || !e) return;

  // Construction radii — faint dashed pen strokes to the arc's endpoints,
  // the kind a Renaissance draftsman would leave on the page.
  ctx.save();
  ctx.strokeStyle = INK_GHOST;
  ctx.lineWidth = 0.5;
  ctx.setLineDash([3, 5]);
  lineVar(CX, CY, s.x, s.y, 8, 0.4);
  lineVar(CX, CY, e.x, e.y, 8, 0.4);
  ctx.setLineDash([]);
  ctx.restore();

  if (hand.motionType === 'dash') {
    // Straight dash — drawn with the era's jittered pen drag.
    ctx.save();
    ctx.strokeStyle = color;
    ctx.lineWidth = 2.2;
    ctx.lineCap = 'round';
    lineVar(s.x, s.y, e.x, e.y, 20, 0.6);
    ctx.restore();

    const len = Math.hypot(e.x - s.x, e.y - s.y) || 1;
    const dx = (e.x - s.x) / len, dy = (e.y - s.y) / len;
    drawArrowhead(e.x, e.y, dx, dy, 9, color, 2.0);
    return;
  }

  // Arc motion (pro / anti / float). Draw as jittered polyline along the arc
  // so it reads like a careful compass stroke with hand-drawn weight variation.
  const dir = G.handDirection(hand) || 'cw';
  const angles = G.arcAngles(handLoc(hand), handEndLoc(hand), dir);
  if (!angles) return;

  ctx.save();
  ctx.strokeStyle = color;
  ctx.lineWidth = 2.2;
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  const segs = 36;
  ctx.beginPath();
  for (let i = 0; i <= segs; i++) {
    const t = i / segs;
    const a = angles.startA + (angles.endA - angles.startA) * t;
    const r = GRID_R + (Math.random() - 0.5) * 0.8;
    const x = CX + r * Math.cos(a);
    const y = CY + r * Math.sin(a);
    i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
  }
  ctx.stroke();

  // Small arc tick marks across the sweep — Renaissance surveying mark style.
  const tickStep = (angles.endA - angles.startA) / 6;
  for (let i = 1; i < 6; i++) {
    const ta = angles.startA + tickStep * i;
    const p1 = { x: CX + (GRID_R - 5) * Math.cos(ta), y: CY + (GRID_R - 5) * Math.sin(ta) };
    const p2 = { x: CX + (GRID_R + 5) * Math.cos(ta), y: CY + (GRID_R + 5) * Math.sin(ta) };
    ctx.strokeStyle = INK_GHOST;
    ctx.lineWidth = 0.4;
    lineVar(p1.x, p1.y, p2.x, p2.y, 2, 0.2);
  }
  ctx.restore();

  // Arrowhead tangent to arc at end. For an arc traced by increasing `a`,
  // the tangent is (-sin a, cos a); reverse sign when we're sweeping the
  // other way (endA < startA, i.e. the ccw path in canvas space).
  const arrivalA = angles.endA;
  const sign = (angles.endA >= angles.startA) ? 1 : -1;
  const tx = -Math.sin(arrivalA) * sign;
  const ty =  Math.cos(arrivalA) * sign;
  drawArrowhead(e.x, e.y, tx, ty, 9, color, 2.0);
}

function drawStaffForHand(hand, color) {
  if (!hand || !window.PictographGeometry) return;
  const G = window.PictographGeometry;
  const center = G.locationPoint(handEndLoc(hand), CX, CY, GRID_R);
  const axis = G.staffAxisAngle(handEndLoc(hand), hand.orientation || 'in');
  if (center == null || axis == null) return;
  const length = 36; // match the original Letter-A stave length (±18 from center)
  const { a, b } = G.staffEndpoints(center, axis, length);

  // Main shaft — thick precise technical line, preserved from the original
  // drawStaves() look.
  ctx.save();
  ctx.strokeStyle = color;
  ctx.lineWidth = 2.8;
  ctx.lineCap = 'round';
  lineVar(a.x, a.y, b.x, b.y, 18, 0.5);

  // Parallel shadow line offset perpendicular to the axis — gives the
  // cylinder illusion.
  const nx = -Math.sin(axis), ny = Math.cos(axis);
  const shadowOffset = 1.5;
  ctx.strokeStyle = INK_LIGHT;
  ctx.lineWidth = 0.7;
  lineVar(a.x + nx * shadowOffset, a.y + ny * shadowOffset,
          b.x + nx * shadowOffset, b.y + ny * shadowOffset, 10, 0.3);

  // End caps — small perpendicular tick marks at each end of the shaft.
  ctx.strokeStyle = color;
  ctx.lineWidth = 1.6;
  const capHalf = 8;
  lineVar(a.x - nx * capHalf, a.y - ny * capHalf,
          a.x + nx * capHalf, a.y + ny * capHalf, 4, 0.4);
  lineVar(b.x - nx * capHalf, b.y - ny * capHalf,
          b.x + nx * capHalf, b.y + ny * capHalf, 4, 0.4);
  ctx.restore();
}

// ─── 1. Aged paper background ─────────────────────────────────────────────────
function drawPaper() {
  // Base cream fill
  ctx.fillStyle = PAPER_BASE;
  ctx.fillRect(0, 0, 500, 500);

  // Aged patches — subtle radial gradient variations
  const patches = [
    { x: 60,  y: 60,  r: 80,  c: 'rgba(180,140,80,0.12)' },
    { x: 440, y: 80,  r: 70,  c: 'rgba(160,120,60,0.10)' },
    { x: 80,  y: 420, r: 90,  c: 'rgba(170,130,70,0.13)' },
    { x: 430, y: 440, r: 75,  c: 'rgba(180,140,80,0.09)' },
    { x: 250, y: 250, r: 140, c: 'rgba(200,170,110,0.06)' },
  ];
  patches.forEach(p => {
    const g = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.r);
    g.addColorStop(0, p.c);
    g.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, 500, 500);
  });

  // Edge yellowing — vignette burn
  const edgeGrad = ctx.createRadialGradient(250, 250, 160, 250, 250, 360);
  edgeGrad.addColorStop(0, 'rgba(0,0,0,0)');
  edgeGrad.addColorStop(1, 'rgba(90,55,10,0.28)');
  ctx.fillStyle = edgeGrad;
  ctx.fillRect(0, 0, 500, 500);

  // Foxing spots — small rust-brown specks scattered across the page
  const foxPositions = [
    {x:42, y:38, r:3.5}, {x:88, y:55, r:2}, {x:132, y:22, r:2.8},
    {x:195, y:41, r:1.8}, {x:318, y:28, r:3}, {x:410, y:45, r:2.2},
    {x:467, y:33, r:3.8}, {x:22,  y:120, r:2.4}, {x:478, y:155, r:2},
    {x:15,  y:280, r:3.2}, {x:488, y:320, r:2.6}, {x:28,  y:430, r:2},
    {x:460, y:460, r:3.5}, {x:390, y:480, r:2.2}, {x:105, y:475, r:2.8},
    {x:220, y:490, r:1.9}, {x:55,  y:350, r:1.5}, {x:475, y:220, r:2.3},
    {x:340, y:490, r:1.7}, {x:162, y:488, r:3.1},
    // smaller mid-page specks
    {x:155, y:85,  r:1.2}, {x:380, y:110, r:1.4}, {x:420, y:370, r:1.1},
    {x:75,  y:340, r:1.3}, {x:330, y:155, r:0.9},
  ];
  foxPositions.forEach(f => {
    ctx.beginPath();
    ctx.arc(f.x, f.y, f.r, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(160,100,40,${0.12 + Math.random() * 0.18})`;
    ctx.fill();
    // Inner darker core
    ctx.beginPath();
    ctx.arc(f.x, f.y, f.r * 0.5, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(120,70,20,${0.18 + Math.random() * 0.15})`;
    ctx.fill();
  });

  // Subtle paper grain — very faint noise texture via tiny dots
  ctx.save();
  ctx.globalAlpha = 0.025;
  for (let i = 0; i < 2400; i++) {
    const x = Math.random() * 500;
    const y = Math.random() * 500;
    ctx.fillStyle = Math.random() > 0.5 ? '#5A3810' : '#F5DEB3';
    ctx.fillRect(x, y, 1, 1);
  }
  ctx.restore();
}

// ─── 2. Ruled border ──────────────────────────────────────────────────────────
function drawBorder() {
  const margin = 18;

  // Outer frame — heavier weight
  ctx.strokeStyle = INK_MED;
  ctx.lineWidth = 1.8;
  ctx.lineJoin = 'round';
  // Draw with slight hand-wobble
  ctx.beginPath();
  ctx.moveTo(jitter(margin), jitter(margin));
  ctx.lineTo(jitter(500 - margin), jitter(margin));
  ctx.lineTo(jitter(500 - margin), jitter(500 - margin));
  ctx.lineTo(jitter(margin), jitter(500 - margin));
  ctx.closePath();
  ctx.stroke();

  // Inner rule — thinner, offset inward
  const m2 = margin + 5;
  ctx.strokeStyle = INK_LIGHT;
  ctx.lineWidth = 0.7;
  ctx.beginPath();
  ctx.moveTo(jitter(m2), jitter(m2));
  ctx.lineTo(jitter(500 - m2), jitter(m2));
  ctx.lineTo(jitter(500 - m2), jitter(500 - m2));
  ctx.lineTo(jitter(m2), jitter(500 - m2));
  ctx.closePath();
  ctx.stroke();

  // Corner ornament ticks
  const corners = [
    [margin, margin], [500-margin, margin],
    [500-margin, 500-margin], [margin, 500-margin]
  ];
  ctx.strokeStyle = INK_MED;
  ctx.lineWidth = 1.2;
  corners.forEach(([cx, cy]) => {
    const sgx = cx < 250 ? 1 : -1;
    const sgy = cy < 250 ? 1 : -1;
    ctx.beginPath();
    ctx.moveTo(cx + sgx * 8, cy);
    ctx.lineTo(cx, cy);
    ctx.lineTo(cx, cy + sgy * 8);
    ctx.stroke();
  });
}

// ─── 3. Title header (mirror-written + normal) ────────────────────────────────
function drawTitle(letter) {
  const glyph = String(letter || 'A');
  // Normal italic title at top centre
  ctx.save();
  ctx.font = 'italic 13px Georgia, serif';
  ctx.fillStyle = INK_DARK;
  ctx.textAlign = 'center';
  ctx.fillText(`Litera  ${glyph}  ·  Studio di Moto Circolare`, 250, 46);
  ctx.restore();

  // Mirror-written subtitle (da Vinci style) — transform for horizontal flip
  ctx.save();
  ctx.translate(250, 65);
  ctx.scale(-1, 1); // Mirror
  ctx.font = 'italic 9px Georgia, serif';
  ctx.fillStyle = INK_GHOST;
  ctx.textAlign = 'center';
  ctx.fillText('de instrumentis motus progressivi artis kinestheticae', 0, 0);
  ctx.restore();

  // Bottom caption — normal, small
  ctx.save();
  ctx.font = 'italic 10px Georgia, serif';
  ctx.fillStyle = INK_LIGHT;
  ctx.textAlign = 'center';
  ctx.fillText('Codex Motuum Manuum  ·  Anno Domini MDI', 250, 479);
  ctx.restore();
}

// ─── 4. Eight-point grid with surveying marks ─────────────────────────────────
function drawGrid() {
  // Faint radial lines from centre to all 8 cardinal/intercardinal points
  ctx.strokeStyle = INK_GHOST;
  ctx.lineWidth = 0.5;
  for (let a = 0; a < 360; a += 45) {
    const p = pt(a, GRID_R + 20);
    lineVar(CX, CY, p.x, p.y, 8, 0.4);
  }

  // Dashed concentric reference circle at GRID_R
  ctx.strokeStyle = INK_GHOST;
  ctx.lineWidth = 0.6;
  ctx.setLineDash([4, 6]);
  circleVar(CX, CY, GRID_R, 80, 0.4);
  ctx.setLineDash([]);

  // Outer tick ring — subtle measurement ring at GRID_R + 18
  ctx.strokeStyle = INK_GHOST;
  ctx.lineWidth = 0.5;
  for (let a = 0; a < 360; a += 22.5) {
    const inner = pt(a, GRID_R + 12);
    const outer = pt(a, GRID_R + 20);
    lineVar(inner.x, inner.y, outer.x, outer.y, 3, 0.3);
  }

  // Eight grid-point marks — small precise circles with crosshairs
  const gridAngles = [0, 45, 90, 135, 180, 225, 270, 315];
  const labels = ['N', 'NE', 'E', 'SE', 'S', 'SW', 'W', 'NW'];
  gridAngles.forEach((a, i) => {
    const p = pt(a);
    ctx.strokeStyle = INK_MED;
    ctx.lineWidth = 0.9;
    circleVar(p.x, p.y, 5, 16, 0.3);

    // Crosshair inside the circle
    ctx.strokeStyle = INK_MED;
    ctx.lineWidth = 0.6;
    lineVar(p.x - 3.5, p.y, p.x + 3.5, p.y, 3, 0.2);
    lineVar(p.x, p.y - 3.5, p.x, p.y + 3.5, 3, 0.2);

    // Cardinal labels just outside circle
    const labelPt = pt(a, GRID_R + 30);
    ctx.save();
    ctx.font = '8px Georgia, serif';
    ctx.fillStyle = INK_LIGHT;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(labels[i], labelPt.x, labelPt.y);
    ctx.restore();
  });

  // Centre mark — small double circle
  ctx.strokeStyle = INK_MED;
  ctx.lineWidth = 0.8;
  circleVar(CX, CY, 6, 20, 0.3);
  circleVar(CX, CY, 2, 10, 0.2);
  ctx.beginPath();
  ctx.arc(CX, CY, 1.2, 0, Math.PI * 2);
  ctx.fillStyle = INK_MED;
  ctx.fill();
}

// ─── Compass-pivot centre mark — "centrum" annotation at the grid origin ─────
// Rendered as a generic studio annotation (unchanged regardless of the
// pictograph) since every arc in the Renaissance diagram swings from CX,CY.
function drawCompassCentre() {
  ctx.save();
  ctx.strokeStyle = INK_GHOST;
  ctx.lineWidth = 0.5;
  circleVar(CX, CY, 10, 20, 0.3);
  ctx.font = '6.5px Georgia, serif';
  ctx.fillStyle = INK_GHOST;
  ctx.textAlign = 'left';
  ctx.fillText('centrum', CX + 12, CY - 4);
  ctx.restore();
}

// Helper: draw a small triangular arrowhead at (tx, ty) pointing in direction (dx, dy)
function drawArrowhead(tipX, tipY, dx, dy, size, color, lw) {
  const len = Math.sqrt(dx * dx + dy * dy);
  const ux = dx / len;
  const uy = dy / len;
  const px = -uy; // perpendicular
  const py =  ux;

  ctx.save();
  ctx.strokeStyle = color;
  ctx.fillStyle = color;
  ctx.lineWidth = lw;
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';

  ctx.beginPath();
  ctx.moveTo(tipX, tipY);
  ctx.lineTo(tipX - ux * size + px * (size * 0.38), tipY - uy * size + py * (size * 0.38));
  ctx.lineTo(tipX - ux * (size * 0.55), tipY - uy * (size * 0.55)); // slight concavity
  ctx.lineTo(tipX - ux * size - px * (size * 0.38), tipY - uy * size - py * (size * 0.38));
  ctx.closePath();
  ctx.fill();
  ctx.restore();
}

// ─── 7. Large italic letter — elegant hand lettering in centre margin ─────────
function drawLetterGlyph(letter) {
  const glyph = String(letter || 'A');
  // Big ornamental letter in top-left corner (notebook heading style)
  ctx.save();
  ctx.font = 'bold italic 64px Georgia, serif';
  ctx.fillStyle = 'rgba(59,42,26,0.18)';  // very faint ghost letter behind
  ctx.textAlign = 'left';
  ctx.textBaseline = 'top';
  ctx.fillText(glyph, 30, 70);

  ctx.font = 'bold italic 42px Georgia, serif';
  ctx.fillStyle = INK_DARK;
  ctx.fillText(glyph, 32, 72);
  ctx.restore();

  // Mirror-written annotation beside the A
  ctx.save();
  ctx.translate(38, 122);
  ctx.scale(-1, 1);
  ctx.font = 'italic 7.5px Georgia, serif';
  ctx.fillStyle = INK_GHOST;
  ctx.textAlign = 'left';
  ctx.fillText('forma prima — litera progreditur', 0, 0);
  ctx.restore();

  // Pro motion indicator note
  ctx.save();
  ctx.font = 'italic 8px Georgia, serif';
  ctx.fillStyle = INK_LIGHT;
  ctx.textAlign = 'right';
  ctx.fillText('Manus dextera · Pro motu', 468, 90);
  ctx.fillText('Manus sinistra · Pro motu', 468, 103);
  ctx.restore();
}

// ─── 8. Margin annotations — measurement notes, Latin labels ──────────────────
function drawAnnotations() {
  ctx.save();
  ctx.font = 'italic 7px Georgia, serif';
  ctx.fillStyle = INK_GHOST;
  ctx.textAlign = 'left';

  // Left margin notes (mirror-written)
  const leftNotes = [
    { x: 28, y: 190, text: 'radius: r', mirror: true },
    { x: 28, y: 210, text: 'arcus: ¼π', mirror: true },
    { x: 28, y: 230, text: 'angulus: 90°', mirror: true },
  ];
  leftNotes.forEach(n => {
    if (n.mirror) {
      ctx.save();
      const tw = ctx.measureText(n.text).width;
      ctx.translate(n.x + tw, n.y);
      ctx.scale(-1, 1);
      ctx.fillText(n.text, 0, 0);
      ctx.restore();
    } else {
      ctx.fillText(n.text, n.x, n.y);
    }
  });

  // Right margin notes — normal
  ctx.textAlign = 'right';
  const rightNotes = [
    { x: 472, y: 190, text: 'positio: alpha' },
    { x: 472, y: 205, text: 'manus sinistera: N' },
    { x: 472, y: 220, text: 'manus dextera: S' },
    { x: 472, y: 240, text: 'motus: progressivus' },
  ];
  rightNotes.forEach(n => ctx.fillText(n.text, n.x, n.y));

  // Bottom margin measurement note
  ctx.textAlign = 'left';
  ctx.fillText('viii · puncti · in · circulo · inscripto', 36, 462);

  ctx.restore();

  // Small tick-marks along left border as measurement scale
  ctx.strokeStyle = INK_GHOST;
  ctx.lineWidth = 0.4;
  for (let y = 80; y <= 440; y += 20) {
    const isMajor = ((y - 80) % 60 === 0);
    const len = isMajor ? 8 : 5;
    lineVar(28, y, 28 + len, y, 2, 0.2);
    if (isMajor) {
      ctx.save();
      ctx.font = '6px Georgia, serif';
      ctx.fillStyle = INK_GHOST;
      ctx.textAlign = 'left';
      ctx.fillText(String(Math.round((y - 80) / 3)), 38, y + 3);
      ctx.restore();
    }
  }
}

// ─── 9. Small compass rose decoration in bottom-right corner ─────────────────
function drawCompassRose() {
  const rx = 450, ry = 442, rr = 18;

  ctx.strokeStyle = INK_LIGHT;
  ctx.lineWidth = 0.7;
  circleVar(rx, ry, rr, 32, 0.3);

  // 4 main compass arms
  const dirs = [{a:0,l:'S'},{a:90,l:'E'},{a:180,l:'N'},{a:270,l:'O'}]; // O=Occidente (West)
  dirs.forEach(d => {
    const inner = pt_local(d.a, 4, rx, ry);
    const outer = pt_local(d.a, rr - 3, rx, ry);
    const tip   = pt_local(d.a, rr + 4, rx, ry);
    ctx.strokeStyle = INK_DARK;
    ctx.lineWidth = 1.0;
    lineVar(inner.x, inner.y, outer.x, outer.y, 4, 0.3);
    // Small arrowhead
    ctx.fillStyle = INK_MED;
    ctx.beginPath();
    ctx.arc(tip.x, tip.y, 1.5, 0, Math.PI * 2);
    ctx.fill();
    // Label
    ctx.save();
    const lp = pt_local(d.a, rr + 10, rx, ry);
    ctx.font = '6px Georgia, serif';
    ctx.fillStyle = INK_MED;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(d.l, lp.x, lp.y);
    ctx.restore();
  });

  // 4 diagonal light arms
  [45, 135, 225, 315].forEach(a => {
    const inner = pt_local(a, 3, rx, ry);
    const outer = pt_local(a, rr - 6, rx, ry);
    ctx.strokeStyle = INK_GHOST;
    ctx.lineWidth = 0.5;
    lineVar(inner.x, inner.y, outer.x, outer.y, 3, 0.2);
  });

  // Centre dot
  ctx.beginPath();
  ctx.arc(rx, ry, 2, 0, Math.PI * 2);
  ctx.fillStyle = INK_DARK;
  ctx.fill();
}

function pt_local(angleDeg, r, cx, cy) {
  const a = (angleDeg - 90) * Math.PI / 180;
  return { x: cx + r * Math.cos(a), y: cy + r * Math.sin(a) };
}

// ─── 10. Final ink-bleed vignette overlay ─────────────────────────────────────
function drawFinalOverlay() {
  // Subtle ink-stain around the central diagram area
  const stain = ctx.createRadialGradient(CX, CY, 60, CX, CY, 200);
  stain.addColorStop(0, 'rgba(0,0,0,0)');
  stain.addColorStop(1, 'rgba(50,30,10,0.04)');
  ctx.fillStyle = stain;
  ctx.fillRect(0, 0, 500, 500);
}

// ─── Render pipeline ──────────────────────────────────────────────────────────
// We override Math.random with a seeded pseudo-random before each render so
// the jitter, foxing, and paper grain stay stable between frames for a given
// pictograph. Without this the page would "shimmer" every redraw.
const origRandom = Math.random;
function seededRandom(seed) {
  let s = seed;
  return function () {
    s = (s * 9301 + 49297) % 233280;
    return s / 233280;
  };
}

// Blue/red hands at opposite points with pro motion — what the page showed
// before the data-driven refactor, and also the fallback when this HTML is
// opened directly without a parent posting pictograph data.
const DEFAULT_PICTOGRAPH = {
  letter: 'A',
  gridMode: 'diamond',
  blueHand: {
    color: 'blue',
    location: 'w', endLocation: 'n',
    motionType: 'pro', rotationDirection: 'cw',
    orientation: 'in', turns: 0,
  },
  redHand: {
    color: 'red',
    location: 'e', endLocation: 's',
    motionType: 'pro', rotationDirection: 'cw',
    orientation: 'in', turns: 0,
  },
};

// Mulberry32 — dedicated deterministic RNG passed to PictographStylize so the
// sepia edge treatment reproduces identically for the same pictograph.
function mulberry32(seed) {
  return function () {
    seed |= 0; seed = seed + 0x6D2B79F5 | 0;
    let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

function seedFor(data) {
  const b = data.blueHand || {}, r = data.redHand || {};
  const s = `${data.letter}|${b.location}|${b.endLocation}|${b.motionType}|${r.location}|${r.endLocation}|${r.motionType}`;
  let h = 0xDEADBEEF;
  for (let i = 0; i < s.length; i++) {
    h = (h ^ s.charCodeAt(i)) * 16777619 >>> 0;
  }
  return h;
}

// ─── Render — two paths, same era chrome ─────────────────────────────────────
// Path 1 (canonical bitmap available): pixelate + recolor + sepia edge
// treatment + single-pass composite at 0.88 alpha. Inherits all correct
// motion semantics (pro vs anti, turns, dashes, floats) from the canonical
// renderer without reimplementing them here.
//
// Path 2 (no canonical): fall back to the original data-driven jittered
// sketch so the page still produces a meaningful image when opened directly.
//
// Era chrome (aged paper, foxing, border, title, construction lines, letter
// glyph, annotations, compass rose, vignette) is drawn identically in either
// path — that's where the Renaissance studio voice lives.
function render(data, canonical, meta) {
  const pictograph = data || DEFAULT_PICTOGRAPH;
  Math.random = seededRandom(42);
  const rng = mulberry32(seedFor(pictograph));
  try {
    // Background + chrome — drawn first in both paths
    drawPaper();
    drawBorder();
    drawTitle(pictograph.letter);
    drawGrid();

    if (canonical && window.PictographStylize) {
      // Path 1: canonical-compose
      const chunky = window.PictographStylize.pixelate(canonical, W, 200);
      const styled = window.PictographStylize.recolor(chunky, RENAISSANCE_PALETTE, W);
      window.PictographStylize.edgeTreatment(styled, 'sepia', rng);
      ctx.save();
      ctx.globalAlpha = 0.88;
      ctx.drawImage(styled, 0, 0, W, H);
      ctx.restore();
    } else {
      // Fallback: original jittered pen-and-ink sketch
      drawStaffForHand(pictograph.blueHand, BLUE_COLOR);
      drawStaffForHand(pictograph.redHand,  RED_COLOR);
      drawArrowForHand(pictograph.blueHand, BLUE_COLOR);
      drawArrowForHand(pictograph.redHand,  RED_COLOR);
      drawCompassCentre();
    }

    // Foreground chrome — always drawn on top
    drawLetterGlyph(pictograph.letter);
    drawAnnotations();
    drawCompassRose();
    drawFinalOverlay();
  } finally {
    Math.random = origRandom;
  }
}

render(DEFAULT_PICTOGRAPH, null, null);
if (window.PictographBridge) {
  window.PictographBridge.onPictograph(function (data, canonical, meta) {
    render(data, canonical, meta);
  });
}
</script>
<script>if(location.search.includes("embed"))document.body.classList.add("embed")</script>
