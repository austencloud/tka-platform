<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TKA Blueprint</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #001a33;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-family: 'Courier New', Courier, monospace;
    }
    canvas {
      display: block;
      image-rendering: crisp-edges;
    }
      body.embed { min-height: 0; padding: 0; margin: 0; display: block; }
    body.embed canvas { width: 100%; height: auto; }
    body.embed .caption, body.embed .controls, body.embed .scene > :not(canvas) { display: none; }
  </style>
  <script src="./_shared/pictograph-geometry.js"></script>
  <script src="./_shared/pictograph-bridge.js"></script>
  <script src="./_shared/pictograph-stylize.js"></script>
</head>
<body>
<canvas id="blueprint" width="500" height="500"></canvas>

<script>
(function () {
  const canvas = document.getElementById('blueprint');
  const ctx = canvas.getContext('2d');
  const W = 500, H = 500;

  // ─── Palette ───────────────────────────────────────────────────────────────
  const BG          = '#0A1929';       // cyanotype deep blue
  const GRID_LINE   = 'rgba(30,100,180,0.35)';   // faint blueprint grid
  const INK         = 'rgba(220,240,255,0.95)';  // white-cyan ink
  const INK_DIM     = 'rgba(180,210,240,0.55)';  // dimmer annotations
  const INK_FAINT   = 'rgba(130,180,230,0.30)';  // very faint
  const BLUE_HAND   = 'rgba(160,220,255,0.90)';  // hand tint - blue
  const RED_HAND    = 'rgba(255,180,160,0.90)';  // hand tint - red (warm)
  const TITLE_BG    = 'rgba(0,30,70,0.85)';

  // Blueprint is special - we unify every pictograph class to the same bright
  // cyan so the canonical recolor simply normalizes everything, and the
  // 'blueprint' edge treatment then produces the two-tone cyanotype look.
  const BLUEPRINT_PALETTE = {
    blue:       '#C8E4FF',
    red:        '#C8E4FF',
    structural: '#C8E4FF',
    bg:         null,
  };

  // ─── Layout ────────────────────────────────────────────────────────────────
  const CX = 250, CY = 230;   // shifted up slightly so title block fits
  const UNIT = 80;            // half-grid unit: distance from center to each grid point

  // Grid points (diamond layout).  UPPERCASE keys are this file's internal
  // convention - our helpers map the lowercase TKA domain compass names
  // (n, ne, e, ...) into these keys via ptsKey().
  //        N
  //   W         E
  //        S
  const pts = {
    N: { x: CX,          y: CY - UNIT },
    S: { x: CX,          y: CY + UNIT },
    E: { x: CX + UNIT,   y: CY },
    W: { x: CX - UNIT,   y: CY },
    NE:{ x: CX + UNIT,   y: CY - UNIT },
    NW:{ x: CX - UNIT,   y: CY - UNIT },
    SE:{ x: CX + UNIT,   y: CY + UNIT },
    SW:{ x: CX - UNIT,   y: CY + UNIT },
    C: { x: CX,          y: CY },
  };

  // ─── Helpers ───────────────────────────────────────────────────────────────

  function crosshair(x, y, size, color, lineWidth) {
    ctx.save();
    ctx.strokeStyle = color || INK;
    ctx.lineWidth = lineWidth || 0.8;
    ctx.beginPath();
    ctx.moveTo(x - size, y); ctx.lineTo(x + size, y);
    ctx.moveTo(x, y - size); ctx.lineTo(x, y + size);
    ctx.stroke();
    ctx.restore();
  }

  function circle(x, y, r, color, lw) {
    ctx.save();
    ctx.strokeStyle = color || INK;
    ctx.lineWidth = lw || 0.8;
    ctx.beginPath();
    ctx.arc(x, y, r, 0, Math.PI * 2);
    ctx.stroke();
    ctx.restore();
  }

  function dimLine(x1, y1, x2, y2, label, color, offsetX, offsetY) {
    // Arrow-tipped dimension line
    const c = color || INK_DIM;
    const lw = 0.7;
    const arrowLen = 5;

    const dx = x2 - x1, dy = y2 - y1;
    const len = Math.sqrt(dx*dx + dy*dy);
    const ux = dx/len, uy = dy/len;
    const nx = -uy, ny = ux; // normal

    // Offset the line perpendicularly
    const ox = (offsetX || 0), oy = (offsetY || 0);
    const ax = x1 + ox, ay = y1 + oy;
    const bx = x2 + ox, by = y2 + oy;

    ctx.save();
    ctx.strokeStyle = c;
    ctx.lineWidth = lw;
    ctx.setLineDash([3, 3]);

    // Extension lines
    ctx.beginPath();
    ctx.moveTo(x1, y1); ctx.lineTo(ax, ay);
    ctx.moveTo(x2, y2); ctx.lineTo(bx, by);
    ctx.stroke();

    ctx.setLineDash([]);

    // Main dim line
    ctx.beginPath();
    ctx.moveTo(ax, ay); ctx.lineTo(bx, by);
    ctx.stroke();

    // Arrowheads
    function arrowhead(px, py, dirX, dirY) {
      ctx.beginPath();
      ctx.moveTo(px, py);
      ctx.lineTo(px - dirX*arrowLen + nx*2, py - dirY*arrowLen + ny*2);
      ctx.moveTo(px, py);
      ctx.lineTo(px - dirX*arrowLen - nx*2, py - dirY*arrowLen - ny*2);
      ctx.stroke();
    }
    arrowhead(ax, ay, -ux, -uy);
    arrowhead(bx, by,  ux,  uy);

    // Label
    if (label) {
      ctx.fillStyle = c;
      ctx.font = '7px "Courier New", monospace';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      const mx = (ax+bx)/2, my = (ay+by)/2;
      // Small bg for legibility
      const tw = ctx.measureText(label).width + 4;
      ctx.fillStyle = BG;
      ctx.fillRect(mx - tw/2, my - 5, tw, 10);
      ctx.fillStyle = c;
      ctx.fillText(label, mx, my);
    }
    ctx.restore();
  }

  // ─── Background + blueprint chrome (era-voice pieces) ──────────────────────
  function drawBlueprintBackground() {
    ctx.fillStyle = BG;
    ctx.fillRect(0, 0, W, H);
  }

  function drawGraphPaper() {
    const GRID_STEP = 10;
    ctx.save();
    ctx.strokeStyle = GRID_LINE;
    ctx.lineWidth = 0.4;
    for (let x = 0; x <= W; x += GRID_STEP) {
      ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke();
    }
    for (let y = 0; y <= H; y += GRID_STEP) {
      ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke();
    }
    ctx.restore();
  }

  function drawBorder() {
    // Outer border
    ctx.save();
    ctx.strokeStyle = INK;
    ctx.lineWidth = 1.5;
    ctx.strokeRect(10, 10, W - 20, H - 20);
    ctx.restore();

    // Inner border (double-border effect)
    ctx.save();
    ctx.strokeStyle = INK_DIM;
    ctx.lineWidth = 0.6;
    ctx.strokeRect(15, 15, W - 30, H - 30);
    ctx.restore();

    // Center origin crosshair + concentric rings
    for (const r of [4, 12, 25, UNIT/2]) {
      circle(CX, CY, r, INK_FAINT, 0.5);
    }
    crosshair(CX, CY, 18, INK_DIM, 0.8);

    // Grid point crosshairs + cardinal labels
    const gridLabels = { N:'N', S:'S', E:'E', W:'W' };
    const labelOffsets = {
      N: {dx:  6, dy: -14},
      S: {dx:  6, dy:   4},
      E: {dx:  6, dy:  -6},
      W: {dx:-22, dy:  -6},
    };

    for (const [name, pt] of Object.entries(pts)) {
      if (name === 'C') continue;
      const isCardinal = name in gridLabels;
      crosshair(pt.x, pt.y, isCardinal ? 7 : 4, isCardinal ? INK_DIM : INK_FAINT, 0.7);
      if (isCardinal) {
        circle(pt.x, pt.y, 3.5, INK_DIM, 0.6);
        const off = labelOffsets[name];
        ctx.save();
        ctx.fillStyle = INK_DIM;
        ctx.font = '8px "Courier New", monospace';
        ctx.textAlign = 'left';
        ctx.textBaseline = 'middle';
        ctx.fillText(name, pt.x + off.dx, pt.y + off.dy + 5);
        ctx.restore();
      }
    }
  }

  function drawDiagonals() {
    ctx.save();
    ctx.strokeStyle = INK_FAINT;
    ctx.lineWidth = 0.5;
    ctx.setLineDash([4, 4]);
    ctx.beginPath(); ctx.moveTo(pts.N.x, pts.N.y); ctx.lineTo(pts.E.x, pts.E.y); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(pts.E.x, pts.E.y); ctx.lineTo(pts.S.x, pts.S.y); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(pts.S.x, pts.S.y); ctx.lineTo(pts.W.x, pts.W.y); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(pts.W.x, pts.W.y); ctx.lineTo(pts.N.x, pts.N.y); ctx.stroke();
    ctx.restore();
  }

  function drawUnitDimensions() {
    dimLine(CX, CY, pts.N.x, pts.N.y,  'UNIT=80px', INK_DIM, -28, 0);
    dimLine(CX, CY, pts.S.x, pts.S.y,  'UNIT=80px', INK_DIM,  28, 0);
  }

  // ─── Fallback-only: dimension-annotated "staff" (hand-position marker) ─────
  // In other eras the staff is a line. Here it's a technical annotation at
  // a single point - a short diagonal rule with dimension ticks and a label.
  // We pass the hand's endLocation point in.
  function drawStaff(px, py, color, label, labelSide) {
    const len = 52;
    // Diamond axis: 45-degree angle NW–SE
    const dx = Math.cos(Math.PI / 4);  // 0.707
    const dy = Math.sin(Math.PI / 4);  // 0.707 (NW to SE: y increases SE)

    const x1 = px - dx * len, y1 = py - dy * len;  // NW end
    const x2 = px + dx * len, y2 = py + dy * len;  // SE end

    // Main staff line
    ctx.save();
    ctx.strokeStyle = color;
    ctx.lineWidth = 1.8;
    ctx.beginPath();
    ctx.moveTo(x1, y1); ctx.lineTo(x2, y2);
    ctx.stroke();
    ctx.restore();

    // Tick marks (dimension-style perpendicular ticks every ~13px along staff)
    ctx.save();
    ctx.strokeStyle = color;
    ctx.lineWidth = 0.8;
    const perpX = -dy, perpY = dx;  // perpendicular
    const numTicks = 7;
    for (let i = 0; i <= numTicks; i++) {
      const t = i / numTicks;
      const tx = x1 + (x2 - x1) * t;
      const ty = y1 + (y2 - y1) * t;
      const tickSize = (i === 0 || i === numTicks) ? 6 : 3;
      ctx.beginPath();
      ctx.moveTo(tx - perpX * tickSize, ty - perpY * tickSize);
      ctx.lineTo(tx + perpX * tickSize, ty + perpY * tickSize);
      ctx.stroke();
    }
    ctx.restore();

    // Endpoint circles (prop ends)
    ctx.save();
    ctx.strokeStyle = color;
    ctx.lineWidth = 1;
    ctx.beginPath(); ctx.arc(x1, y1, 4, 0, Math.PI * 2); ctx.stroke();
    ctx.beginPath(); ctx.arc(x2, y2, 4, 0, Math.PI * 2); ctx.stroke();
    // Filled small center dot
    ctx.fillStyle = color;
    ctx.beginPath(); ctx.arc(x1, y1, 1.5, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(x2, y2, 1.5, 0, Math.PI * 2); ctx.fill();
    ctx.restore();

    // Label
    ctx.save();
    ctx.fillStyle = color;
    ctx.font = '7px "Courier New", monospace';
    ctx.textAlign = labelSide === 'right' ? 'left' : 'right';
    ctx.textBaseline = 'middle';
    const lx = labelSide === 'right' ? px + 10 : px - 10;
    ctx.fillText(label, lx, py - 14);
    ctx.restore();
  }

  // ─── Fallback-only data-driven helpers ─────────────────────────────────────
  //
  // Each hand's motion annotation and staff marker are drawn from motion data
  // via PictographGeometry (loaded in the head) instead of hardcoded Letter A
  // geometry. Only used when no canonical bitmap is available.

  function handLoc(h)    { return String(h && (h.location    || h.startLocation) || '').toLowerCase(); }
  function handEndLoc(h) { return String(h && h.endLocation || '').toLowerCase(); }

  // Map lowercase TKA domain compass names (n, ne, e, ...) to the uppercase
  // keys used in this file's `pts` lookup object.
  function ptsKey(loc) { return String(loc || '').toUpperCase(); }

  function drawStaffForHand(hand, color, labelSide) {
    if (!hand) return;
    const key = ptsKey(handEndLoc(hand));
    const pt = pts[key];
    if (!pt) return;
    // Use the TKA color name + the endpoint location as the annotation label.
    const colorLabel = String(hand.color || '').toUpperCase() || (color === BLUE_HAND ? 'BLUE' : 'RED');
    const label = `${colorLabel} HAND @ ${key}`;
    drawStaff(pt.x, pt.y, color, label, labelSide);
  }

  function drawArrowForHand(hand, color) {
    if (!hand || hand.motionType === 'static' || !window.PictographGeometry) return;
    const G = window.PictographGeometry;
    const startKey = ptsKey(handLoc(hand));
    const endKey   = ptsKey(handEndLoc(hand));
    const s = pts[startKey];
    const e = pts[endKey];
    if (!s || !e) return;

    // Dash motion: straight dimension line with a technical tick arrowhead.
    if (hand.motionType === 'dash') {
      ctx.save();
      ctx.strokeStyle = color;
      ctx.lineWidth = 2;
      ctx.setLineDash([6, 3]);
      ctx.beginPath();
      ctx.moveTo(s.x, s.y);
      ctx.lineTo(e.x, e.y);
      ctx.stroke();
      ctx.setLineDash([]);
      ctx.restore();

      // Technical tick arrowhead at endpoint
      const len = Math.hypot(e.x - s.x, e.y - s.y) || 1;
      const tx = (e.x - s.x) / len, ty = (e.y - s.y) / len;
      const nx = -ty, ny = tx;
      ctx.save();
      ctx.strokeStyle = color;
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.moveTo(e.x - tx * 8 + nx * 6, e.y - ty * 8 + ny * 6);
      ctx.lineTo(e.x, e.y);
      ctx.lineTo(e.x - tx * 8 - nx * 6, e.y - ty * 8 - ny * 6);
      ctx.stroke();
      ctx.restore();

      // Dimension label along the line
      const mx = (s.x + e.x) / 2, my = (s.y + e.y) / 2;
      const nOff = 10;
      ctx.save();
      ctx.fillStyle = color;
      ctx.font = '7px "Courier New", monospace';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      const lblX = mx + nx * nOff, lblY = my + ny * nOff;
      const dashLabel = `${startKey}→${endKey} DASH`;
      const tw = ctx.measureText(dashLabel).width + 4;
      ctx.fillStyle = BG;
      ctx.fillRect(lblX - tw/2, lblY - 5, tw, 10);
      ctx.fillStyle = color;
      ctx.fillText(dashLabel, lblX, lblY);
      ctx.restore();
      return;
    }

    // Arc motion (pro / anti / float): quarter-arc centered on the diagonal
    // corner between the start and end grid points.
    const dir = G.handDirection(hand) || 'cw';
    const startA = G.locationAngle(handLoc(hand));
    const endA   = G.locationAngle(handEndLoc(hand));
    if (startA == null || endA == null) return;
    const anticlockwise = (dir === 'ccw');

    // Radius = distance from canvas center to grid point.
    const R = Math.hypot(s.x - CX, s.y - CY);

    // Dashed radius lines from center to arc endpoints (dimension construction
    // lines - this is a technical drawing, not a motion illustration).
    ctx.save();
    ctx.strokeStyle = color;
    ctx.lineWidth = 0.7;
    ctx.setLineDash([4, 4]);
    ctx.beginPath();
    ctx.moveTo(CX, CY);
    ctx.lineTo(CX + Math.cos(startA) * R, CY + Math.sin(startA) * R);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(CX, CY);
    ctx.lineTo(CX + Math.cos(endA) * R, CY + Math.sin(endA) * R);
    ctx.stroke();
    ctx.restore();

    // The arc itself
    ctx.save();
    ctx.strokeStyle = color;
    ctx.lineWidth = 1.8;
    ctx.lineJoin = 'round';
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.arc(CX, CY, R, startA, endA, anticlockwise);
    ctx.stroke();
    ctx.restore();

    // Technical tick arrowhead at arc endpoint.  Tangent direction follows
    // the arc's travel direction (opposite sign for anticlockwise).
    let tx, ty;
    if (anticlockwise) { tx =  Math.sin(endA); ty = -Math.cos(endA); }
    else               { tx = -Math.sin(endA); ty =  Math.cos(endA); }
    const nx = -ty, ny = tx;
    ctx.save();
    ctx.strokeStyle = color;
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(e.x - tx * 8 + nx * 6, e.y - ty * 8 + ny * 6);
    ctx.lineTo(e.x, e.y);
    ctx.lineTo(e.x - tx * 8 - nx * 6, e.y - ty * 8 - ny * 6);
    ctx.stroke();
    ctx.restore();

    // Radius dimension label along the arc midpoint radius
    // We pick an angle halfway through the arc's travel in the actual direction.
    let midA;
    if (anticlockwise) {
      // Canvas anticlockwise means angle decreases. Walk backwards from startA.
      let delta = startA - endA;
      while (delta < 0) delta += Math.PI * 2;
      midA = startA - delta / 2;
    } else {
      let delta = endA - startA;
      while (delta < 0) delta += Math.PI * 2;
      midA = startA + delta / 2;
    }
    const midR = R * 0.55;
    ctx.save();
    ctx.fillStyle = color;
    ctx.font = '6px "Courier New", monospace';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('R=' + Math.round(R), CX + Math.cos(midA) * midR, CY + Math.sin(midA) * midR - 6);
    ctx.restore();

    // Arc label (start→end + direction) placed just outside the arc midpoint
    ctx.save();
    ctx.fillStyle = color;
    ctx.font = '7px "Courier New", monospace';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    const labelR = R + 14;
    const lx = CX + Math.cos(midA) * labelR;
    const ly = CY + Math.sin(midA) * labelR;
    const arcLabel = `${startKey}→${endKey} ${dir.toUpperCase()}`;
    const tw = ctx.measureText(arcLabel).width + 4;
    ctx.fillStyle = BG;
    ctx.fillRect(lx - tw/2, ly - 5, tw, 10);
    ctx.fillStyle = color;
    ctx.fillText(arcLabel, lx, ly);
    ctx.restore();
  }

  // ─── Annotation badge (corner callout box) ─────────────────────────────────
  function annotationBadge(x, y, lines, color) {
    ctx.save();
    const lineH = 10;
    const pad = 5;
    ctx.font = '7px "Courier New", monospace';
    const maxW = Math.max(...lines.map(l => ctx.measureText(l).width));
    const bw = maxW + pad * 2;
    const bh = lines.length * lineH + pad * 2;

    ctx.fillStyle = 'rgba(0,20,50,0.82)';
    ctx.strokeStyle = color;
    ctx.lineWidth = 0.8;
    ctx.fillRect(x, y, bw, bh);
    ctx.strokeRect(x, y, bw, bh);

    ctx.fillStyle = color;
    ctx.font = '7px "Courier New", monospace';
    ctx.textAlign = 'left';
    ctx.textBaseline = 'top';
    lines.forEach((line, i) => {
      ctx.fillText(line, x + pad, y + pad + i * lineH);
    });
    ctx.restore();
    return { w: bw, h: bh };
  }

  function handBadgeLines(hand, fallbackColorName) {
    if (!hand) return [];
    const colorName = (hand.color || fallbackColorName || '').toString().toUpperCase();
    const motion = (hand.motionType || '').toString().toUpperCase() || '-';
    const start  = ptsKey(handLoc(hand))    || '-';
    const end    = ptsKey(handEndLoc(hand)) || '-';
    const motionFamily = motion === 'DASH' ? 'DASH'
                       : motion === 'STATIC' ? 'STATIC'
                       : 'SHIFT';
    return [
      `${colorName} HAND - ${motion}`,
      `START: ${start}`,
      `END:   ${end}`,
      `MOTION: ${motionFamily}`,
      `TURNS: ${hand.turns != null ? hand.turns : 0}`,
    ];
  }

  function drawHandBadges(data) {
    const blueLines = handBadgeLines(data.blueHand, 'blue');
    const redLines  = handBadgeLines(data.redHand,  'red');

    if (blueLines.length) annotationBadge(20, 25, blueLines, BLUE_HAND);

    if (redLines.length) {
      ctx.save();
      ctx.font = '7px "Courier New", monospace';
      const redMaxW = Math.max(...redLines.map(l => ctx.measureText(l).width)) + 10;
      ctx.restore();
      annotationBadge(W - 20 - redMaxW, 25, redLines, RED_HAND);
    }
  }

  function drawGhostLetter(letter) {
    const l = String(letter || '?');
    ctx.save();
    ctx.font = 'bold 48px "Courier New", monospace';
    ctx.fillStyle = INK;
    ctx.globalAlpha = 0.08;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(l, CX, CY);
    ctx.globalAlpha = 1;
    ctx.restore();
  }

  function drawGridModeLabel(gridMode) {
    const mode = String(gridMode || 'diamond').toUpperCase();
    ctx.save();
    ctx.font = '8px "Courier New", monospace';
    ctx.fillStyle = INK_DIM;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'top';
    ctx.fillText(`GRID: ${mode} MODE`, CX, 17);
    ctx.restore();
  }

  function drawTitleBlock(letter) {
    const l = String(letter || '?');
    const TB_X = W - 185, TB_Y = H - 78, TB_W = 170, TB_H = 62;

    ctx.save();
    ctx.fillStyle = TITLE_BG;
    ctx.fillRect(TB_X, TB_Y, TB_W, TB_H);
    ctx.strokeStyle = INK;
    ctx.lineWidth = 1;
    ctx.strokeRect(TB_X, TB_Y, TB_W, TB_H);
    ctx.restore();

    // Horizontal dividers inside title block
    ctx.save();
    ctx.strokeStyle = INK_DIM;
    ctx.lineWidth = 0.5;
    ctx.beginPath();
    ctx.moveTo(TB_X, TB_Y + 20); ctx.lineTo(TB_X + TB_W, TB_Y + 20);
    ctx.moveTo(TB_X, TB_Y + 40); ctx.lineTo(TB_X + TB_W, TB_Y + 40);
    ctx.stroke();
    // Vertical divider in lower two rows
    ctx.beginPath();
    ctx.moveTo(TB_X + 85, TB_Y + 20); ctx.lineTo(TB_X + 85, TB_Y + TB_H);
    ctx.stroke();
    ctx.restore();

    // Title block text
    ctx.save();
    ctx.fillStyle = INK;
    ctx.font = 'bold 8px "Courier New", monospace';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(`TKA PICTOGRAPH - LETTER ${l}`, TB_X + TB_W/2, TB_Y + 10);

    ctx.font = '7px "Courier New", monospace';
    ctx.fillStyle = INK_DIM;
    ctx.textAlign = 'left';
    ctx.fillText('SCALE: 1:1', TB_X + 5, TB_Y + 30);
    ctx.fillText('DWG NO: 001', TB_X + 5, TB_Y + 50);
    ctx.fillText('DATE: 1852', TB_X + 90, TB_Y + 30);
    ctx.fillText('REV: A', TB_X + 90, TB_Y + 50);
    ctx.restore();
  }

  function drawDrawnByBlock(data) {
    const SB_X = 15, SB_Y = H - 78, SB_W = 160, SB_H = 62;
    const gridMode = String((data && data.gridMode) || 'diamond').toUpperCase();
    const blueMotion = (data && data.blueHand && data.blueHand.motionType || '-').toString().toUpperCase();
    const redMotion  = (data && data.redHand  && data.redHand.motionType  || '-').toString().toUpperCase();

    ctx.save();
    ctx.fillStyle = TITLE_BG;
    ctx.fillRect(SB_X, SB_Y, SB_W, SB_H);
    ctx.strokeStyle = INK;
    ctx.lineWidth = 1;
    ctx.strokeRect(SB_X, SB_Y, SB_W, SB_H);
    ctx.restore();

    ctx.save();
    ctx.strokeStyle = INK_DIM;
    ctx.lineWidth = 0.5;
    ctx.beginPath();
    ctx.moveTo(SB_X, SB_Y + 20); ctx.lineTo(SB_X + SB_W, SB_Y + 20);
    ctx.stroke();
    ctx.restore();

    ctx.save();
    ctx.fillStyle = INK;
    ctx.font = 'bold 8px "Courier New", monospace';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('KINETIC ANNOTATION SYSTEM', SB_X + SB_W/2, SB_Y + 10);

    ctx.fillStyle = INK_DIM;
    ctx.font = '7px "Courier New", monospace';
    ctx.textAlign = 'left';
    ctx.fillText(`CLASS: KINETIC PICTOGRAPH`, SB_X + 5, SB_Y + 32);
    ctx.fillText(`MOTION: ${blueMotion} / ${redMotion}`, SB_X + 5, SB_Y + 44);
    ctx.fillText(`GRID: ${gridMode}`, SB_X + 5, SB_Y + 56);
    ctx.restore();
  }

  function drawFoldMarks() {
    const foldLen = 10;
    ctx.save();
    ctx.strokeStyle = INK;
    ctx.lineWidth = 1;
    // Top-left
    ctx.beginPath();
    ctx.moveTo(10, 10); ctx.lineTo(10 + foldLen, 10);
    ctx.moveTo(10, 10); ctx.lineTo(10, 10 + foldLen);
    ctx.stroke();
    // Top-right
    ctx.beginPath();
    ctx.moveTo(W - 10, 10); ctx.lineTo(W - 10 - foldLen, 10);
    ctx.moveTo(W - 10, 10); ctx.lineTo(W - 10, 10 + foldLen);
    ctx.stroke();
    // Bottom-left
    ctx.beginPath();
    ctx.moveTo(10, H - 10); ctx.lineTo(10 + foldLen, H - 10);
    ctx.moveTo(10, H - 10); ctx.lineTo(10, H - 10 - foldLen);
    ctx.stroke();
    // Bottom-right
    ctx.beginPath();
    ctx.moveTo(W - 10, H - 10); ctx.lineTo(W - 10 - foldLen, H - 10);
    ctx.moveTo(W - 10, H - 10); ctx.lineTo(W - 10, H - 10 - foldLen);
    ctx.stroke();
    ctx.restore();
  }

  function drawSheetNumber() {
    ctx.save();
    ctx.fillStyle = INK_DIM;
    ctx.font = '7px "Courier New", monospace';
    ctx.textAlign = 'right';
    ctx.textBaseline = 'top';
    ctx.fillText('SHEET 1 OF 1', W - 20, 20);
    ctx.restore();
  }

  function drawWatermark() {
    ctx.save();
    ctx.fillStyle = INK_FAINT;
    ctx.font = '6px "Courier New", monospace';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'bottom';
    ctx.fillText('PREPARED BY: DEPARTMENT OF KINETIC STUDIES  ·  ANNO DOMINI MDCCCLII', W/2, H - 17);
    ctx.restore();
  }

  // ─────────────────────────────────────────────────────────────────────────
  // Render - called on every pictograph update
  //
  // Two paths:
  //   1. Canonical bitmap available (parent rendered via Canvas2DDirectRenderer):
  //      recolor into a unified cyan palette, apply the 'blueprint' edge
  //      treatment so every drawn pixel becomes bright cyan and everything
  //      else transparent, composite onto the cyanotype background. This
  //      path inherits all correct motion semantics - pro vs anti, turns
  //      indicators, dashes, floats - from the canonical renderer without
  //      reimplementing them here. No pixelation - blueprints are crisp.
  //
  //   2. No canonical (standalone page open, or canonical render failed):
  //      fall back to the original dimension-annotated markers + dashed
  //      construction lines so the page still produces a meaningful image.
  //
  // Era chrome (background, graph paper, border, diagonals, title blocks,
  // badges, watermark) is drawn identically either way - that's where this
  // era's voice lives.
  // ─────────────────────────────────────────────────────────────────────────
  function render(data, canonical, meta) {
    // ── Background + blueprint chrome ──
    drawBlueprintBackground();     // dark cyan background fill
    drawGraphPaper();              // faint grid pattern
    drawBorder();                  // double border, crosshairs
    drawDiagonals();               // reference diagonals
    drawUnitDimensions();          // 80-unit dimLines

    // ── Pictograph core ──
    if (canonical && window.PictographStylize) {
      // No pixelate for blueprint - crisp technical linework
      const styled = window.PictographStylize.recolor(canonical, BLUEPRINT_PALETTE, W);
      window.PictographStylize.edgeTreatment(styled, 'blueprint');
      ctx.drawImage(styled, 0, 0, W, H);
    } else {
      drawStaffForHand(data.blueHand, BLUE_HAND, 'left');
      drawStaffForHand(data.redHand,  RED_HAND,  'right');
      drawArrowForHand(data.blueHand, BLUE_HAND);
      drawArrowForHand(data.redHand,  RED_HAND);
    }

    // ── Title blocks + annotations on top ──
    drawHandBadges(data);           // top-left/right data badges
    drawGhostLetter(data.letter);   // large watermark letter
    drawGridModeLabel(data.gridMode);
    drawTitleBlock(data.letter);    // bottom-right title block
    drawDrawnByBlock(data);         // bottom-left
    drawFoldMarks();                // registration ticks
    drawSheetNumber();
    drawWatermark();
  }

  // ─── Default pictograph - Letter A (what the page rendered before the
  //     data-driven refactor). Also used when this HTML is opened directly
  //     without a parent posting pictograph data.
  const DEFAULT_PICTOGRAPH = {
    letter: 'A', gridMode: 'diamond',
    blueHand: { color:'blue', location:'w', endLocation:'n', motionType:'pro', rotationDirection:'cw', orientation:'in', turns:0 },
    redHand:  { color:'red',  location:'e', endLocation:'s', motionType:'pro', rotationDirection:'cw', orientation:'in', turns:0 },
  };

  render(DEFAULT_PICTOGRAPH, null, null);
  if (window.PictographBridge) {
    window.PictographBridge.onPictograph(function(data, canonical, meta) {
      render(data, canonical, meta);
    });
  }
})();
</script>
<script>if(location.search.includes("embed"))document.body.classList.add("embed")</script>
</body>
