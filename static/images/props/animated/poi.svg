<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 258.67 150">
  <!-- Mirror reserve (invisible): keeps the geometric bbox symmetric about the
       viewBox center, matching the unilateral-prop convention. -->
  <rect x="60" y="73" width="69.34" height="4" rx="2" fill="none"/>
  <circle cx="30" cy="75" r="30" fill="none"/>
  <!-- cord: starts at the grip (viewBox center, no offset). -->
  <rect x="129.33" y="73" width="69.34" height="4" rx="2" fill="#2E3192"/>
  <!-- knob (grip) at the viewBox center (129.33,75) - the handpoint. -->
  <circle cx="129.33" cy="75" r="8" fill="#2E3192"/>
  <!-- weighted ball: far edge at 258.67, so the whole unit (grip to tip) spans
       exactly the club's reach (129.33 units, club viewBox 258.67). -->
  <circle cx="228.67" cy="75" r="30" fill="#2E3192"/>
</svg>
