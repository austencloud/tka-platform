<?xml version="1.0" encoding="utf-8"?>
<!-- Buugeng "Glow": parametric double-crescent tuned for the dark tunnel — a bright
     white core down the centerline over a soft halo reads as a glowing LED ribbon.
     Body recolors to hand color; halo + core strokes survive recolor. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 155.26">
<defs>
	<filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
		<feGaussianBlur stdDeviation="3"/>
	</filter>
</defs>
<path d="M7 77.63 A77 77 0 0 0 161 77.63 L139 77.63 A55 55 0 0 1 29 77.63 Z M139 77.63 A77 77 0 0 1 293 77.63 L271 77.63 A55 55 0 0 0 161 77.63 Z" fill="#2e3191" stroke="#0a0b16" stroke-width="2"/>
<!-- outer halo -->
<path d="M18 77.63 A66 66 0 0 0 150 77.63 A66 66 0 0 1 282 77.63" fill="none" stroke="#ffffff" stroke-opacity="0.28" stroke-width="12" stroke-linecap="round" filter="url(#soft)"/>
<!-- bright core -->
<path d="M18 77.63 A66 66 0 0 0 150 77.63 A66 66 0 0 1 282 77.63" fill="none" stroke="#ffffff" stroke-opacity="0.95" stroke-width="3.5" stroke-linecap="round"/>
</svg>
