<?xml version="1.0" encoding="utf-8"?>
<!-- Buugeng "Chrome": parametric double-crescent with a specular centerline spine
     that reads as polished rounded metal. Body recolors to hand color; the dark rim
     + white spine survive recolor. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 155.26">
<path d="M7 77.63 A77 77 0 0 0 161 77.63 L139 77.63 A55 55 0 0 1 29 77.63 Z M139 77.63 A77 77 0 0 1 293 77.63 L271 77.63 A55 55 0 0 0 161 77.63 Z" fill="#2e3191" stroke="#0d0f1f" stroke-width="2.2"/>
<!-- broad soft sheen band -->
<path d="M18 77.63 A66 66 0 0 0 150 77.63 A66 66 0 0 1 282 77.63" fill="none" stroke="#ffffff" stroke-opacity="0.18" stroke-width="20" stroke-linecap="round"/>
<!-- tight specular highlight -->
<path d="M18 77.63 A66 66 0 0 0 150 77.63 A66 66 0 0 1 282 77.63" fill="none" stroke="#ffffff" stroke-opacity="0.6" stroke-width="6" stroke-linecap="round"/>
</svg>
