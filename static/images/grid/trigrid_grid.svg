<?xml version="1.0" encoding="utf-8"?>
<svg version="1.1"
    id="Trigrid_Layer"
    xmlns="http://www.w3.org/2000/svg"
    x="0"
    y="0"
    viewBox="0 0 950 950"
    xml:space="preserve">
  <style>
    .trigrid-invisible{fill:none}
    .normal-hand-point{fill:currentColor}

    /* Upright mode (default): filled outer points, outlined hidden */
    .upright-outer-point{fill:currentColor}
    .inverted-outer-point{fill:none}

    /* Inverted mode: outlined outer points, filled hidden */
    .inverted-mode .upright-outer-point{fill:none}
    .inverted-mode .inverted-outer-point{fill:none;stroke:currentColor;stroke-width:7}
  </style>

  <!-- Outer points: filled (upright mode) -->
  <circle id="n_trigrid_outer_point" class="upright-outer-point" cx="475" cy="175" r="25"/>
  <circle id="se_trigrid_outer_point" class="upright-outer-point" cx="734.8" cy="625" r="25"/>
  <circle id="sw_trigrid_outer_point" class="upright-outer-point" cx="215.2" cy="625" r="25"/>

  <!-- Outer points: outlined (inverted mode) -->
  <circle id="n_trigrid_outer_point_inv" class="inverted-outer-point" cx="475" cy="175" r="25"/>
  <circle id="se_trigrid_outer_point_inv" class="inverted-outer-point" cx="734.8" cy="625" r="25"/>
  <circle id="sw_trigrid_outer_point_inv" class="inverted-outer-point" cx="215.2" cy="625" r="25"/>

  <!-- Hand points -->
  <circle id="n_trigrid_hand_point" class="normal-hand-point" cx="475" cy="332" r="4.7"/>
  <circle id="se_trigrid_hand_point" class="normal-hand-point" cx="598.8" cy="546.5" r="4.7"/>
  <circle id="sw_trigrid_hand_point" class="normal-hand-point" cx="351.2" cy="546.5" r="4.7"/>

  <!-- Center point -->
  <circle id="center_point" cx="475" cy="475" r="12"/>
</svg>
