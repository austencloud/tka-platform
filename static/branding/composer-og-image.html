<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Flow Arts Composer social image</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        width: 1200px;
        height: 630px;
        background:
          radial-gradient(
            ellipse 80% 80% at 15% 50%,
            rgba(88, 28, 135, 0.5) 0%,
            transparent 50%
          ),
          radial-gradient(
            ellipse 60% 60% at 85% 25%,
            rgba(67, 56, 202, 0.35) 0%,
            transparent 50%
          ),
          radial-gradient(
            ellipse 50% 50% at 75% 85%,
            rgba(147, 51, 234, 0.25) 0%,
            transparent 50%
          ),
          linear-gradient(
            160deg,
            #0c0515 0%,
            #1a0a2e 30%,
            #0f172a 70%,
            #0c0515 100%
          );
        font-family:
          system-ui,
          -apple-system,
          sans-serif;
        overflow: hidden;
        position: relative;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 0 96px;
      }

      body::before {
        content: "";
        position: absolute;
        inset: 0;
        background: radial-gradient(
          ellipse 55% 60% at 50% 45%,
          rgba(139, 92, 246, 0.14) 0%,
          transparent 62%
        );
        pointer-events: none;
      }

      .branding {
        z-index: 10;
        max-width: 900px;
      }

      .app-name {
        font-family:
          "Palatino Linotype", "Book Antiqua", Palatino, Georgia, serif;
        font-size: 92px;
        font-style: italic;
        color: #ffffff;
        text-shadow: 0 0 60px rgba(99, 102, 241, 0.6);
        margin-bottom: 18px;
        line-height: 1;
      }

      .tagline {
        font-size: 34px;
        color: rgba(255, 255, 255, 0.9);
        margin-bottom: 24px;
        font-weight: 300;
      }

      .subtitle {
        font-size: 21px;
        color: rgba(255, 255, 255, 0.62);
        line-height: 1.5;
        margin: 0 auto 36px;
        max-width: 720px;
      }

      .features {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        justify-content: center;
      }

      .feature-tag {
        padding: 11px 18px;
        background: linear-gradient(
          135deg,
          rgba(99, 102, 241, 0.35) 0%,
          rgba(99, 102, 241, 0.15) 100%
        );
        border: 1px solid rgba(99, 102, 241, 0.5);
        border-radius: 8px;
        font-size: 15px;
        color: #ffffff;
        text-transform: uppercase;
        letter-spacing: 1px;
      }

      .url {
        position: absolute;
        bottom: 34px;
        left: 0;
        right: 0;
        text-align: center;
        font-size: 20px;
        color: rgba(255, 255, 255, 0.5);
        letter-spacing: 1px;
      }

      .badge {
        position: absolute;
        top: 34px;
        right: 48px;
        padding: 8px 16px;
        background: linear-gradient(135deg, #22c55e 0%, #16a34a 100%);
        border-radius: 20px;
        font-size: 14px;
        font-weight: 600;
        color: white;
        text-transform: uppercase;
        letter-spacing: 1px;
      }
    </style>
  </head>
  <body>
    <div class="badge">Free</div>

    <div class="branding">
      <h1 class="app-name">Flow Arts Composer</h1>
      <p class="tagline">Flow Arts Software for Choreography</p>
      <p class="subtitle">
        Build and animate sequences with The Kinetic Alphabet. 
        Save the work, export it, or share a link.
      </p>
      <div class="features">
        <span class="feature-tag">Build</span>
        <span class="feature-tag">Animate</span>
        <span class="feature-tag">Save</span>
        <span class="feature-tag">Export</span>
        <span class="feature-tag">Share</span>
      </div>
    </div>

    <div class="url">tkaflowarts.com</div>
  </body>
</html>
