<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Feature Graphic - Flow Arts Composer (1024x500)</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        width: 1024px;
        height: 500px;
        background: linear-gradient(180deg, #050510 0%, #0a0e1a 40%, #0d1225 70%, #080c18 100%);
        font-family:
          system-ui,
          -apple-system,
          sans-serif;
        overflow: hidden;
        position: relative;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 60px;
      }

      /* Star field */
      body::before {
        content: "";
        position: absolute;
        inset: 0;
        background-image:
          radial-gradient(circle, rgba(255,255,255,0.4) 0.5px, transparent 0.5px),
          radial-gradient(circle, rgba(255,255,255,0.2) 0.5px, transparent 0.5px);
        background-size: 80px 60px, 120px 90px;
        background-position: 0 0, 40px 30px;
        pointer-events: none;
      }

      /* Subtle glow behind medallion */
      body::after {
        content: "";
        position: absolute;
        right: 80px;
        top: 50%;
        transform: translateY(-50%);
        width: 400px;
        height: 400px;
        border-radius: 50%;
        background: radial-gradient(
          circle,
          rgba(99, 102, 241, 0.08) 0%,
          transparent 60%
        );
        pointer-events: none;
      }

      .branding {
        z-index: 10;
        max-width: 440px;
      }

      .app-name {
        font-family:
          "Palatino Linotype", "Book Antiqua", Palatino, Georgia, serif;
        font-size: 64px;
        font-style: italic;
        color: #ffffff;
        text-shadow: 0 0 40px rgba(99, 102, 241, 0.25);
        margin-bottom: 8px;
        line-height: 1;
      }

      .tagline {
        font-size: 22px;
        color: rgba(255, 255, 255, 0.85);
        margin-bottom: 20px;
        font-weight: 300;
        letter-spacing: 0.3px;
      }

      .subtitle {
        font-size: 15px;
        color: rgba(255, 255, 255, 0.5);
        line-height: 1.5;
        margin-bottom: 28px;
      }

      .features {
        display: flex;
        flex-wrap: nowrap;
        gap: 6px;
      }

      .feature-tag {
        padding: 7px 11px;
        background: rgba(255, 255, 255, 0.06);
        border: 1px solid rgba(255, 255, 255, 0.15);
        border-radius: 6px;
        font-size: 12px;
        color: rgba(255, 255, 255, 0.9);
        text-transform: uppercase;
        letter-spacing: 1.2px;
        font-weight: 500;
      }

      /* Pictograph ring medallion */
      .medallion {
        position: relative;
        z-index: 10;
        flex-shrink: 0;
      }

      .medallion-frame {
        width: 360px;
        height: 360px;
        border-radius: 50%;
        overflow: hidden;
        border: 2px solid rgba(255, 255, 255, 0.12);
        box-shadow: 0 0 50px rgba(99, 102, 241, 0.08);
        position: relative;
        background: #fff;
      }

      .medallion-frame img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: center;
      }

      /* Thin ring accent outside the medallion */
      .medallion-frame::after {
        content: "";
        position: absolute;
        inset: -6px;
        border-radius: 50%;
        border: 1px solid rgba(255, 255, 255, 0.08);
        pointer-events: none;
      }

      .url {
        position: absolute;
        bottom: 20px;
        left: 60px;
        font-size: 16px;
        color: rgba(255, 255, 255, 0.35);
        letter-spacing: 1px;
        z-index: 10;
      }

    </style>
  </head>
  <body>
    <div class="branding">
      <h1 class="app-name">Flow Arts Composer</h1>
      <p class="tagline">A Flow Arts Choreography Toolbox</p>
      <p class="subtitle">
        Create, animate, and share flow arts sequences
        with a comprehensive notation system.
      </p>
      <div class="features">
        <span class="feature-tag">Create</span>
        <span class="feature-tag">Discover</span>
        <span class="feature-tag">Learn</span>
        <span class="feature-tag">Connect</span>
        <span class="feature-tag">Train</span>
      </div>
    </div>

    <div class="medallion">
      <div class="medallion-frame">
        <img src="guide-cover.png" alt="The Kinetic Alphabet pictograph ring" />
      </div>
    </div>

    <div class="url">tkaflowarts.com</div>
  </body>
</html>
