<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rail UI Playground</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --panel-bg: #0a0a14;
    --accent: #6366f1;
    --stroke: rgba(255, 255, 255, 0.12);
    --text: #ffffff;
    --text-dim: rgba(255, 255, 255, 0.4);
    --text-dimmer: rgba(255, 255, 255, 0.2);
    --canvas-2d: #0a0a0f;
    --canvas-3d: #1a1a2e;
    --card-bg: #08080e;
  }

  body {
    background: #060610;
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    height: 100vh;
    display: grid;
    grid-template-columns: 280px 1fr;
    overflow: hidden;
  }

  /* === CONTROLS PANEL === */
  .controls {
    background: var(--panel-bg);
    border-right: 1px solid var(--stroke);
    padding: 20px 16px;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 20px;
  }

  .controls h1 {
    font-size: 14px;
    font-weight: 600;
    letter-spacing: 0.04em;
    color: var(--text);
  }

  .control-group {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .control-group-label {
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--text-dimmer);
  }

  .toggle-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
  }

  .toggle-label {
    font-size: 12px;
    color: var(--text-dim);
  }

  .toggle-btn {
    width: 40px;
    height: 22px;
    border-radius: 11px;
    border: none;
    cursor: pointer;
    position: relative;
    transition: background 150ms ease;
    flex-shrink: 0;
  }

  .toggle-btn[aria-pressed="false"] {
    background: rgba(255,255,255,0.12);
  }

  .toggle-btn[aria-pressed="true"] {
    background: var(--accent);
  }

  .toggle-btn::after {
    content: '';
    position: absolute;
    top: 3px;
    left: 3px;
    width: 16px;
    height: 16px;
    border-radius: 50%;
    background: white;
    transition: transform 150ms ease;
  }

  .toggle-btn[aria-pressed="true"]::after {
    transform: translateX(18px);
  }

  .preset-row {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
  }

  .preset-btn {
    padding: 6px 12px;
    border-radius: 6px;
    border: 1px solid var(--stroke);
    background: none;
    color: var(--text-dim);
    font-size: 11px;
    font-weight: 500;
    cursor: pointer;
    transition: all 120ms ease;
    font-family: inherit;
  }

  .preset-btn:hover {
    background: rgba(255,255,255,0.06);
    color: var(--text);
  }

  .preset-btn.active {
    background: color-mix(in srgb, var(--accent) 20%, transparent);
    border-color: var(--accent);
    color: var(--text);
  }

  .slider-row {
    display: flex;
    flex-direction: column;
    gap: 4px;
  }

  .slider-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .slider-value {
    font-size: 11px;
    color: var(--accent);
    font-weight: 600;
    font-variant-numeric: tabular-nums;
  }

  input[type="range"] {
    -webkit-appearance: none;
    width: 100%;
    height: 4px;
    border-radius: 2px;
    background: rgba(255,255,255,0.1);
    outline: none;
  }

  input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 14px;
    height: 14px;
    border-radius: 50%;
    background: var(--accent);
    cursor: pointer;
  }

  /* === PREVIEW AREA === */
  .preview-area {
    display: flex;
    flex-direction: column;
    min-height: 0;
  }

  .preview-main {
    flex: 1;
    display: grid;
    grid-template-columns: auto 1fr;
    min-height: 0;
  }

  /* === RAIL === */
  .content-rail {
    display: flex;
    flex-direction: column;
    background: var(--panel-bg);
    border-right: 1px solid var(--stroke);
    overflow: hidden;
    transition: width 180ms cubic-bezier(0.2, 0, 0, 1);
  }

  .rail-modes {
    flex: 1;
    display: flex;
    flex-direction: column;
  }

  .rail-mode-btn {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 6px;
    background: none;
    border: none;
    border-left: 3px solid transparent;
    color: var(--text-dim);
    cursor: pointer;
    position: relative;
    font-family: inherit;
    transition: background 120ms cubic-bezier(0.2, 0, 0, 1),
                color 120ms cubic-bezier(0.2, 0, 0, 1),
                border-color 120ms cubic-bezier(0.2, 0, 0, 1);
  }

  .rail-mode-btn:hover:not(.active) {
    background: rgba(255, 255, 255, 0.04);
    color: rgba(255, 255, 255, 0.8);
  }

  .rail-mode-btn.active {
    background: color-mix(in srgb, var(--accent) 12%, transparent);
    border-left-color: var(--accent);
    color: var(--text);
  }

  .rail-mode-btn i { font-size: 20px; }

  .rail-mode-label {
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 0.02em;
  }

  .rail-divider {
    height: 1px;
    background: var(--stroke);
    margin: 0 12px;
    flex-shrink: 0;
  }

  .rail-section-label {
    padding: 8px 0 4px;
    text-align: center;
    font-size: 9px;
    font-weight: 600;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--text-dimmer);
    flex-shrink: 0;
  }

  .rail-divider, .rail-section-label {
    display: none;
  }

  .sectioned .rail-divider,
  .sectioned .rail-section-label {
    display: block;
  }

  /* Make Side-by-Side not flex-grow with the rest when sectioned */
  .sectioned .rail-mode-btn.split-btn {
    flex: 0 0 auto;
    padding: 16px 8px;
  }

  /* === CONTENT AREA === */
  .content-area {
    min-width: 0;
    min-height: 0;
    position: relative;
    overflow: hidden;
  }

  .focus-border {
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 2px;
    background: var(--accent);
    z-index: 2;
    opacity: 0;
    transition: opacity 200ms ease;
  }

  .focus-border.visible {
    opacity: 0.7;
  }

  /* Split view */
  .split-view {
    display: grid;
    grid-template-columns: 1fr 1fr;
    height: 100%;
    width: 100%;
    transition: grid-template-columns 250ms cubic-bezier(0.2, 0, 0, 1);
  }

  .split-view.focused-left {
    grid-template-columns: 1fr 0fr;
  }

  .split-pane {
    position: relative;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 8px;
    min-width: 0;
    transition: opacity 250ms cubic-bezier(0.2, 0, 0, 1);
  }

  .split-view.focused-left .split-pane.right-pane {
    opacity: 0;
    pointer-events: none;
  }

  .split-pane.left-pane {
    border-right: 1px solid rgba(255,255,255,0.08);
  }

  .split-view.focused-left .split-pane.left-pane {
    border-right: none;
  }

  .split-pane i {
    font-size: 36px;
    opacity: 0.12;
  }

  .split-pane .pane-label {
    font-size: 12px;
    opacity: 0.18;
    letter-spacing: 0.03em;
  }

  .pane-anim { background: var(--canvas-2d); }
  .pane-3d { background: var(--canvas-3d); }
  .pane-card { background: var(--card-bg); }

  /* Right rail mock (settings icons) */
  .right-rail-mock {
    position: absolute;
    top: 10px; right: 10px;
    display: flex;
    flex-direction: column;
    gap: 4px;
    opacity: 0;
    transition: opacity 200ms ease;
  }

  .right-rail-mock.visible { opacity: 1; }

  .right-rail-dot {
    width: 30px; height: 30px;
    border-radius: 6px;
    background: rgba(255,255,255,0.06);
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .right-rail-dot i {
    font-size: 12px !important;
    opacity: 0.3 !important;
  }

  /* === PROMPT OUTPUT === */
  .prompt-output {
    background: rgba(255,255,255,0.03);
    border-top: 1px solid var(--stroke);
    padding: 14px 20px;
    display: flex;
    align-items: flex-start;
    gap: 12px;
  }

  .prompt-text {
    flex: 1;
    font-size: 12px;
    line-height: 1.5;
    color: var(--text-dim);
    font-family: 'SF Mono', 'Cascadia Code', 'Consolas', monospace;
  }

  .copy-btn {
    padding: 6px 14px;
    border-radius: 6px;
    border: 1px solid var(--stroke);
    background: none;
    color: var(--text-dim);
    font-size: 11px;
    font-weight: 500;
    cursor: pointer;
    white-space: nowrap;
    font-family: inherit;
    transition: all 120ms ease;
    flex-shrink: 0;
  }

  .copy-btn:hover {
    background: rgba(255,255,255,0.06);
    color: var(--text);
  }
</style>
</head>
<body>

<!-- CONTROLS -->
<div class="controls">
  <h1>Rail UI Explorer</h1>

  <div class="control-group">
    <div class="control-group-label">Presets</div>
    <div class="preset-row">
      <button class="preset-btn active" onclick="applyPreset('flat')">Flat List</button>
      <button class="preset-btn" onclick="applyPreset('sectioned')">Sectioned</button>
      <button class="preset-btn" onclick="applyPreset('sectioned-focus')">Sectioned + Focus Border</button>
    </div>
  </div>

  <div class="control-group">
    <div class="control-group-label">Rail Layout</div>
    <div class="toggle-row">
      <span class="toggle-label">Section grouping</span>
      <button class="toggle-btn" id="tog-section" aria-pressed="false" onclick="toggleState('sectioned')"></button>
    </div>
    <div class="toggle-row">
      <span class="toggle-label">Focus top border</span>
      <button class="toggle-btn" id="tog-border" aria-pressed="false" onclick="toggleState('focusBorder')"></button>
    </div>
  </div>

  <div class="control-group">
    <div class="slider-row">
      <div class="slider-header">
        <span class="toggle-label">Rail width</span>
        <span class="slider-value" id="rail-width-val">140px</span>
      </div>
      <input type="range" min="72" max="220" value="140" id="rail-width" oninput="updateRailWidth(this.value)">
    </div>
  </div>

  <div class="control-group">
    <div class="control-group-label">Active Mode</div>
    <div class="preset-row">
      <button class="preset-btn active" onclick="setMode('split')">Side by Side</button>
      <button class="preset-btn" onclick="setMode('animation')">2D</button>
      <button class="preset-btn" onclick="setMode('animation-3d')">3D</button>
      <button class="preset-btn" onclick="setMode('card')">Card</button>
    </div>
  </div>

  <div class="control-group">
    <div class="control-group-label">Section Label Text</div>
    <div class="preset-row">
      <button class="preset-btn active" onclick="setSectionLabel('FOCUS')">Focus</button>
      <button class="preset-btn" onclick="setSectionLabel('VIEW')">View</button>
      <button class="preset-btn" onclick="setSectionLabel('')">None</button>
    </div>
  </div>
</div>

<!-- PREVIEW -->
<div class="preview-area">
  <div class="preview-main">
    <!-- Rail -->
    <nav class="content-rail" id="rail">
      <div class="rail-modes">
        <button class="rail-mode-btn split-btn active" onclick="setMode('split')">
          <i class="fas fa-columns"></i>
          <span class="rail-mode-label">Side by Side</span>
        </button>
        <div class="rail-divider"></div>
        <div class="rail-section-label" id="section-label-el">FOCUS</div>
        <button class="rail-mode-btn" onclick="setMode('animation')">
          <i class="fas fa-play"></i>
          <span class="rail-mode-label">2D Animation</span>
        </button>
        <button class="rail-mode-btn" onclick="setMode('animation-3d')">
          <i class="fas fa-cube"></i>
          <span class="rail-mode-label">3D Animation</span>
        </button>
        <button class="rail-mode-btn" onclick="setMode('card')">
          <i class="fas fa-grip"></i>
          <span class="rail-mode-label">Card</span>
        </button>
        <button class="rail-mode-btn" onclick="setMode('videos')">
          <i class="fas fa-video"></i>
          <span class="rail-mode-label">Videos</span>
        </button>
      </div>
    </nav>

    <!-- Content -->
    <div class="content-area">
      <div class="focus-border" id="focus-border"></div>
      <div class="split-view" id="split-view">
        <div class="split-pane left-pane pane-anim" id="left-pane">
          <i class="fas fa-play" id="left-icon"></i>
          <span class="pane-label" id="left-label">2D Animation</span>
        </div>
        <div class="split-pane right-pane pane-card">
          <i class="fas fa-grip"></i>
          <span class="pane-label">Choreo Card</span>
        </div>
      </div>
      <div class="right-rail-mock" id="right-rail">
        <div class="right-rail-dot"><i class="fas fa-gear"></i></div>
        <div class="right-rail-dot"><i class="fas fa-sliders"></i></div>
        <div class="right-rail-dot"><i class="fas fa-download"></i></div>
      </div>
    </div>
  </div>

  <!-- Prompt output -->
  <div class="prompt-output">
    <div class="prompt-text" id="prompt-text"></div>
    <button class="copy-btn" onclick="copyPrompt()">Copy</button>
  </div>
</div>

<script>
  const MODES = {
    'split':        { icon: 'fa-columns', label: 'Side by Side', bg: '' },
    'animation':    { icon: 'fa-play',    label: '2D Animation', bg: 'pane-anim' },
    'animation-3d': { icon: 'fa-cube',    label: '3D Animation', bg: 'pane-3d' },
    'card':         { icon: 'fa-grip',    label: 'Card',         bg: 'pane-card' },
    'videos':       { icon: 'fa-video',   label: 'Videos',       bg: 'pane-anim' },
  };

  const state = {
    activeMode: 'split',
    sectioned: false,
    focusBorder: false,
    railWidth: 140,
    sectionLabel: 'FOCUS',
  };

  function updateAll() {
    // Rail section class
    const rail = document.getElementById('rail');
    rail.classList.toggle('sectioned', state.sectioned);
    rail.style.width = state.railWidth + 'px';

    // Section label
    document.getElementById('section-label-el').textContent = state.sectionLabel;

    // Rail labels visibility
    const collapsed = state.railWidth < 100;
    rail.querySelectorAll('.rail-mode-label').forEach(l => l.style.display = collapsed ? 'none' : '');

    // Active button
    const btns = rail.querySelectorAll('.rail-mode-btn');
    const modeKeys = ['split','animation','animation-3d','card','videos'];
    btns.forEach((btn, i) => {
      btn.classList.toggle('active', modeKeys[i] === state.activeMode);
    });

    // Content area
    const isFocused = state.activeMode !== 'split';
    const sv = document.getElementById('split-view');
    sv.classList.toggle('focused-left', isFocused);

    // Left pane content
    const leftPane = document.getElementById('left-pane');
    const leftIcon = document.getElementById('left-icon');
    const leftLabel = document.getElementById('left-label');

    leftPane.className = 'split-pane left-pane';
    if (isFocused) {
      const m = MODES[state.activeMode];
      leftIcon.className = 'fas ' + m.icon;
      leftLabel.textContent = m.label;
      if (m.bg) leftPane.classList.add(m.bg);
    } else {
      leftIcon.className = 'fas fa-play';
      leftLabel.textContent = '2D Animation';
      leftPane.classList.add('pane-anim');
    }

    // Focus border
    const fb = document.getElementById('focus-border');
    fb.classList.toggle('visible', state.focusBorder && isFocused);

    // Right rail (settings icons) - show when focused
    document.getElementById('right-rail').classList.toggle('visible', isFocused);

    // Update controls UI
    document.getElementById('tog-section').setAttribute('aria-pressed', state.sectioned);
    document.getElementById('tog-border').setAttribute('aria-pressed', state.focusBorder);
    document.getElementById('rail-width').value = state.railWidth;
    document.getElementById('rail-width-val').textContent = state.railWidth + 'px';

    // Preset buttons
    document.querySelectorAll('.control-group').forEach(g => {
      g.querySelectorAll('.preset-btn').forEach(b => b.classList.remove('active'));
    });

    // Mode preset buttons
    const modePresets = document.querySelectorAll('.control-group:nth-child(4) .preset-btn');
    const modeMap = ['split','animation','animation-3d','card'];
    modePresets.forEach((b, i) => {
      if (modeMap[i] === state.activeMode) b.classList.add('active');
    });

    // Section label preset buttons
    const labelPresets = document.querySelectorAll('.control-group:nth-child(5) .preset-btn');
    const labelMap = ['FOCUS','VIEW',''];
    labelPresets.forEach((b, i) => {
      if (labelMap[i] === state.sectionLabel) b.classList.add('active');
    });

    // Top presets
    const topPresets = document.querySelectorAll('.control-group:first-child .preset-btn');
    if (!state.sectioned && !state.focusBorder) topPresets[0].classList.add('active');
    else if (state.sectioned && !state.focusBorder) topPresets[1].classList.add('active');
    else if (state.sectioned && state.focusBorder) topPresets[2].classList.add('active');

    updatePrompt();
  }

  function toggleState(key) {
    state[key] = !state[key];
    updateAll();
  }

  function setMode(mode) {
    state.activeMode = mode;
    updateAll();
  }

  function updateRailWidth(val) {
    state.railWidth = parseInt(val);
    updateAll();
  }

  function setSectionLabel(label) {
    state.sectionLabel = label;
    updateAll();
  }

  function applyPreset(name) {
    if (name === 'flat') {
      state.sectioned = false;
      state.focusBorder = false;
      state.activeMode = 'split';
    } else if (name === 'sectioned') {
      state.sectioned = true;
      state.focusBorder = false;
      state.activeMode = 'split';
    } else if (name === 'sectioned-focus') {
      state.sectioned = true;
      state.focusBorder = true;
      state.activeMode = 'animation-3d';
    }
    updateAll();
  }

  function updatePrompt() {
    const parts = [];

    if (state.sectioned) {
      parts.push('section grouping with a divider separating "Side by Side" from the focused content modes');
      if (state.sectionLabel) parts.push(`a "${state.sectionLabel}" micro-label above the content modes`);
    } else {
      parts.push('a flat list of all 5 modes with no visual grouping');
    }

    if (state.focusBorder) {
      parts.push('a subtle purple top border on the content area when in focused mode');
    }

    if (state.railWidth !== 140) {
      parts.push(`rail width of ${state.railWidth}px`);
    }

    const prompt = `Update the viewer content rail to use ${parts.join(', ')}.`;
    document.getElementById('prompt-text').textContent = prompt;
  }

  function copyPrompt() {
    const text = document.getElementById('prompt-text').textContent;
    navigator.clipboard.writeText(text).then(() => {
      const btn = document.querySelector('.copy-btn');
      btn.textContent = 'Copied!';
      setTimeout(() => btn.textContent = 'Copy', 1500);
    });
  }

  updateAll();
</script>

</body>
</html>
