<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Support — Tip Jar (v4)</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400..700;1,9..144,400..700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  :root{
    --bg:#0c0c1d; --card:rgba(255,255,255,.05);
    --stroke:rgba(255,255,255,.10); --text:#eceaf6; --muted:#a7a3c4;
    --indigo:#6d5cff; --cyan:#39d0ff; --pink:#ff7ab8;
    --paypal:#0070e0; --venmo:#008cff; --cashapp:#00d54b;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;}
  body{background:var(--bg); color:var(--text);
    font-family:"Inter",system-ui,sans-serif; -webkit-font-smoothing:antialiased; overflow-x:hidden;}
  .aurora{position:fixed; inset:-25% -20% auto -20%; height:90vh; z-index:0; filter:blur(72px); opacity:.6;
    background:
      radial-gradient(40% 40% at 22% 28%, var(--indigo) 0%, transparent 60%),
      radial-gradient(38% 38% at 80% 22%, var(--cyan) 0%, transparent 60%),
      radial-gradient(46% 46% at 60% 72%, var(--pink) 0%, transparent 60%);
    animation:drift 20s ease-in-out infinite alternate;}
  @keyframes drift{0%{transform:translate3d(-4%,-3%,0) scale(1);}100%{transform:translate3d(5%,4%,0) scale(1.12);}}
  .grain{position:fixed; inset:0; z-index:1; pointer-events:none; opacity:.04;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");}

  .wrap{position:relative; z-index:2; max-width:560px; margin:0 auto;
    min-height:100dvh; display:flex; flex-direction:column; justify-content:center;
    padding:96px 22px 64px; text-align:center;}

  .eyebrow{display:inline-flex; gap:.5rem; align-items:center; align-self:center; font-size:.78rem; font-weight:600;
    letter-spacing:.18em; text-transform:uppercase; color:var(--muted);
    background:var(--card); border:1px solid var(--stroke); padding:.5rem 1rem; border-radius:999px;}
  h1{font-family:"Fraunces",serif; font-weight:600; font-size:clamp(2.8rem,9vw,4.4rem);
    line-height:1.03; margin:1.2rem 0 .6rem;
    background:linear-gradient(180deg,#fff 0%, #cfc9ff 100%);
    -webkit-background-clip:text; background-clip:text; color:transparent;}
  .blurb{max-width:30rem; margin:0 auto 2.6rem; font-size:1.18rem; color:var(--muted); line-height:1.7;}
  .blurb b{color:var(--text); font-weight:600;}

  .jar{display:grid; grid-template-columns:repeat(3,1fr); gap:14px;}
  .pay{position:relative; display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:12px; min-height:124px; padding:20px 12px; border-radius:18px; text-decoration:none; color:#fff;
    overflow:hidden; isolation:isolate;
    box-shadow:0 14px 34px rgba(0,0,0,.45); transition:transform .16s ease, box-shadow .16s ease, filter .16s ease;}
  .pay::before{content:""; position:absolute; inset:0; z-index:-1; opacity:1; transition:opacity .16s;
    background:linear-gradient(150deg, var(--c1), var(--c2));}
  .pay::after{content:""; position:absolute; inset:0; z-index:-1; opacity:0; transition:opacity .16s;
    background:radial-gradient(130% 150% at 50% -10%, rgba(255,255,255,.4), transparent 55%);}
  .pay:hover{transform:translateY(-4px) scale(1.02);
    box-shadow:0 24px 54px rgba(0,0,0,.55), 0 0 0 2px rgba(255,255,255,.22) inset; filter:saturate(1.08);}
  .pay:hover::after{opacity:1;}
  .pay:active{transform:translateY(-1px) scale(.99);}
  .pay .logo{height:30px; width:auto; display:block; fill:#fff;}
  .pay .logo.tall{height:34px;}
  .pay .handle{font-weight:600; color:rgba(255,255,255,.92); font-size:.95rem; letter-spacing:.01em;}
  .paypal{--c1:#009cde; --c2:#003087;}
  .venmo{--c1:#3d95ce; --c2:#0074d9;}
  .cashapp{--c1:#00d54b; --c2:#00a838;}

  .sign{margin-top:34px; color:var(--muted); font-size:1.02rem;}
  .sign .name{font-family:"Fraunces",serif; font-style:italic; color:var(--text); font-size:1.4rem; margin:.2rem 0;}
  .sign a{color:var(--cyan); text-decoration:none; letter-spacing:.03em; font-size:.9rem;}
  .note{margin-top:18px; font-size:.78rem; color:#6f6b8a;}
</style>
</head>
<body>
  <div class="aurora"></div>
  <div class="grain"></div>
  <div class="wrap">
    <span class="eyebrow">✦ The Kinetic Alphabet</span>
    <h1>Buy me a coffee</h1>
    <p class="blurb">The Kinetic Alphabet is built, mostly, by <b>one person</b>. If it's given you something, you can give a little back. A coffee, a lunch, or whatever feels right.</p>

    <div class="jar">
      <a class="pay paypal" href="#" aria-label="Support via PayPal, @austencloud">
        <svg class="logo" role="img" viewBox="0 0 24 24" aria-hidden="true"><path d="M15.607 4.653H8.941L6.645 19.251H1.82L4.862 0h7.995c3.754 0 6.375 2.294 6.473 5.513-.648-.478-2.105-.86-3.722-.86m6.57 5.546c0 3.41-3.01 6.853-6.958 6.853h-2.493L11.595 24H6.74l1.845-11.538h3.592c4.208 0 7.346-3.634 7.153-6.949a5.24 5.24 0 0 1 2.848 4.686M9.653 5.546h6.408c.907 0 1.942.222 2.363.541-.195 2.741-2.655 5.483-6.441 5.483H8.714Z"/></svg>
        <span class="handle">@austencloud</span>

        <span class="handle">@austencloud</span>
      </a>
      <a class="pay cashapp" href="#" aria-label="Support via Cash App, $austencloud">
        <svg class="logo" role="img" viewBox="0 0 24 24" aria-hidden="true"><path d="M23.59 3.475a5.1 5.1 0 00-3.05-3.05c-1.31-.42-2.5-.42-4.92-.42H8.36c-2.4 0-3.61 0-4.9.4a5.1 5.1 0 00-3.05 3.06C0 4.765 0 5.965 0 8.365v7.27c0 2.41 0 3.6.4 4.9a5.1 5.1 0 003.05 3.05c1.3.41 2.5.41 4.9.41h7.28c2.41 0 3.61 0 4.9-.4a5.1 5.1 0 003.06-3.06c.41-1.3.41-2.5.41-4.9v-7.25c0-2.41 0-3.61-.41-4.91zm-6.17 4.63l-.93.93a.5.5 0 01-.67.01 5 5 0 00-3.22-1.18c-.97 0-1.94.32-1.94 1.21 0 .9 1.04 1.2 2.24 1.65 2.1.7 3.84 1.58 3.84 3.64 0 2.24-1.74 3.78-4.58 3.95l-.26 1.2a.49.49 0 01-.48.39H9.63l-.09-.01a.5.5 0 01-.38-.59l.28-1.27a6.54 6.54 0 01-2.88-1.57v-.01a.48.48 0 010-.68l1-.97a.49.49 0 01.67 0c.91.86 2.13 1.34 3.39 1.32 1.3 0 2.17-.55 2.17-1.42 0-.87-.88-1.1-2.54-1.72-1.76-.63-3.43-1.52-3.43-3.6 0-2.42 2.01-3.6 4.39-3.71l.25-1.23a.48.48 0 01.48-.38h1.78l.1.01c.26.06.43.31.37.57l-.27 1.37c.9.3 1.75.77 2.48 1.39l.02.02c.19.2.19.5 0 .68z"/></svg>
        <span class="handle">$austencloud</span>
      </a>
    </div>

    <div class="sign">
      Thank you, truly.
      <div class="name">Austen Cloud</div>
      <a href="#">tkaflowarts.com</a>
    </div>
  </div>
</body>
</html>
