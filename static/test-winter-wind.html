<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Living Winter Wind Preview</title>
    <style>
      :root {
        color-scheme: dark;
        font-family:
          Inter,
          ui-sans-serif,
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: #0a0e1a;
      }

      canvas {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
      }

      .preview-label {
        position: fixed;
        top: 18px;
        left: 18px;
        z-index: 1;
        padding: 10px 13px;
        border: 1px solid rgb(255 255 255 / 14%);
        border-radius: 12px;
        background: rgb(4 11 27 / 62%);
        box-shadow: 0 10px 30px rgb(0 0 0 / 22%);
        color: rgb(245 249 255 / 88%);
        font-size: 13px;
        line-height: 1.35;
        pointer-events: none;
        backdrop-filter: blur(12px);
      }

      .preview-label strong {
        display: block;
        margin-bottom: 2px;
        color: white;
        font-size: 14px;
        font-weight: 650;
      }

      .controls {
        position: fixed;
        right: 18px;
        bottom: 18px;
        z-index: 2;
        display: flex;
        gap: 8px;
      }

      button {
        min-height: 40px;
        padding: 0 15px;
        border: 1px solid rgb(255 255 255 / 18%);
        border-radius: 999px;
        background: rgb(12 25 55 / 78%);
        box-shadow: 0 8px 24px rgb(0 0 0 / 24%);
        color: white;
        font: inherit;
        font-size: 13px;
        font-weight: 650;
        cursor: pointer;
        backdrop-filter: blur(12px);
      }

      button:hover {
        background: rgb(26 48 94 / 88%);
      }

      button:focus-visible {
        outline: 2px solid #bfdbfe;
        outline-offset: 3px;
      }

      @media (max-width: 480px) {
        .preview-label {
          top: 10px;
          left: 10px;
          max-width: calc(100vw - 20px);
        }

        .controls {
          right: 10px;
          bottom: 10px;
        }
      }
    </style>
  </head>
  <body>
    <canvas aria-hidden="true"></canvas>
    <div class="preview-label">
      <strong>Living Winter Wind</strong>
      <span id="status">Loading the local package build…</span>
    </div>
    <div class="controls">
      <button id="gust-left" type="button">Gust left</button>
      <button id="gust-right" type="button">Gust right</button>
    </div>

    <script type="module">
      import { WinterBackgroundSystem } from "/@fs/E:/shared-packages/packages/backgrounds/dist/index.js";

      const canvas = document.querySelector("canvas");
      const context = canvas.getContext("2d");
      const status = document.querySelector("#status");
      const system = new WinterBackgroundSystem();
      const reducedMotion = window.matchMedia(
        "(prefers-reduced-motion: reduce)"
      );
      let dimensions = { width: 1, height: 1 };
      let initialized = false;
      let lastFrameAt = performance.now();
      let frameCount = 0;
      let updateTotalMs = 0;

      function applyAccessibility() {
        system.setAccessibility({
          reducedMotion: reducedMotion.matches,
          highContrast: false,
        });
      }

      function resize() {
        const previous = dimensions;
        dimensions = {
          width: Math.max(1, Math.floor(window.innerWidth)),
          height: Math.max(1, Math.floor(window.innerHeight)),
        };
        canvas.width = dimensions.width;
        canvas.height = dimensions.height;

        if (initialized) {
          system.handleResize(previous, dimensions);
        } else {
          system.initialize(dimensions, "high");
          initialized = true;
        }
      }

      function animate(now) {
        const frameMultiplier = Math.min(4, (now - lastFrameAt) / 16.67);
        lastFrameAt = now;

        const updateStartedAt = performance.now();
        system.update(dimensions, frameMultiplier);
        updateTotalMs += performance.now() - updateStartedAt;
        frameCount += 1;

        context.clearRect(0, 0, dimensions.width, dimensions.height);
        system.draw(context, dimensions);
        requestAnimationFrame(animate);
      }

      window.addEventListener("resize", resize);
      window.addEventListener(
        "pointermove",
        (event) =>
          system.setPointer(
            event.clientX,
            event.clientY,
            true,
            event.pointerType
          ),
        { passive: true }
      );
      window.addEventListener("pointerleave", () =>
        system.setPointer(0, 0, false)
      );
      reducedMotion.addEventListener("change", applyAccessibility);
      document
        .querySelector("#gust-left")
        .addEventListener("click", () => system.triggerGust(-1));
      document
        .querySelector("#gust-right")
        .addEventListener("click", () => system.triggerGust(1));

      resize();
      applyAccessibility();
      status.textContent =
        "Move the pointer to stir and light the snow, or send a gust.";
      requestAnimationFrame(animate);

      window.__winterWindPreview = {
        system,
        triggerGust: (direction = 1) => system.triggerGust(direction),
        getMetrics: () => ({
          ...system.getStats(),
          dimensions,
          frameCount,
          averageUpdateMs: frameCount === 0 ? 0 : updateTotalMs / frameCount,
        }),
      };
    </script>
  </body>
</html>
