  <g id="REFERENCE__notes">
    <rect x="0" y="-155" width="950" height="155" fill="#f5f3ff"/>
    <text x="12" y="-132" font-family="system-ui, sans-serif" font-size="24" fill="#111" font-weight="700">dash_half_2.5.svg — halved dash, 2.5 turns</text>
    <text x="12" y="-106" font-family="system-ui, sans-serif" font-size="17" fill="#555">Seed motion: South → North, prop counter-clockwise · halfway pose shown (staff + grid)</text>
    <text x="12" y="-80" font-family="system-ui, sans-serif" font-size="17" fill="#555">Draw the halfway arrow at the ghost's weight. Ghost (35% opacity) = wrong-turns fallback art: correct anchor + stroke weight, wrong arc.</text>
    <text x="12" y="-54" font-family="system-ui, sans-serif" font-size="17" fill="#555">Use FILLED shapes (Object &gt; Path &gt; Outline Stroke before saving). Keep everything else — ingest ignores REFERENCE groups.</text>
    <text x="12" y="-28" font-family="system-ui, sans-serif" font-size="17" fill="#555">Then: npx tsx scripts/ingest-half-arrows.mjs</text>
  </g>
