    <!-- CACHE MANAGEMENT - Clear stale cache on startup (non-blocking) -->
    <script>
      // ⚡ PERFORMANCE: Run cache cleanup asynchronously to not block page load
      setTimeout(function () {
        try {
          // Clear specific cache keys to prevent quota issues
          // IMPORTANT: Be specific! Broad patterns like "options" will break user preferences
          const cacheKeyPatterns = [
            "preloaded_options", // Pictograph preload cache
            "all_preloaded_options", // Full preload cache
            "preloaded_options_meta", // Preload metadata
            "_cache", // Keys ending in _cache
            "-cache", // Keys with -cache
          ];

          const keysToRemove = [];
          for (let i = 0; i < localStorage.length; i++) {
            const key = localStorage.key(i);
            if (key) {
              // Only clear if key matches a specific cache pattern
              const isCache = cacheKeyPatterns.some(
                (pattern) =>
                  key === pattern ||
                  key.endsWith(pattern) ||
                  key.includes("_cache_") ||
                  key.includes("-cache-")
              );
              if (isCache) {
                keysToRemove.push(key);
              }
            }
          }

          keysToRemove.forEach((key) => {
            localStorage.removeItem(key);
          });
        } catch (error) {
          console.warn("Failed to check/clear cache on startup:", error);
        }
      }, 0);

      // Development Storage Cleanup Utilities
      if (
        window.location.hostname === "localhost" ||
        window.location.hostname === "127.0.0.1"
      ) {
        window.clearTKAStorage = function () {
          const keys = [];
          for (let i = 0; i < localStorage.length; i++) {
            const key = localStorage.key(i);
            if (key && key.startsWith("tka-")) {
              keys.push(key);
            }
          }
          keys.forEach((key) => {
            localStorage.removeItem(key);
          });

          // Clear other TKA-related keys
          const otherKeys = [
            "optionPickerSortMethod",
            "lastSelectedTab",
            "preloaded_options",
            "all_preloaded_options",
            "tka-modern-web-settings",
          ];
          otherKeys.forEach((key) => {
            if (localStorage.getItem(key)) {
              localStorage.removeItem(key);
            }
          });
        };

        window.clearSequences = function () {
          const keys = [];
          for (let i = 0; i < localStorage.length; i++) {
            const key = localStorage.key(i);
            if (
              key &&
              (key.includes("-sequence") || key.includes("-sequences"))
            ) {
              keys.push(key);
            }
          }
          keys.forEach((key) => {
            localStorage.removeItem(key);
          });
        };
      }
    </script>

    <!-- SMART CONSOLE FORWARDER - DEVELOPMENT ONLY -->
    <script>
      (function () {
        // Only enable in development
        const isDev =
          window.location.hostname === "localhost" ||
          window.location.hostname === "127.0.0.1";
        if (!isDev) return;

        // Store original console methods
        const originalConsole = {
          log: console.log,
          error: console.error,
          warn: console.warn,
          info: console.info,
        };

        // Filter out noisy logs
        function shouldForwardLog(args) {
          const message = args.join(" ");

          // Skip empty or whitespace-only messages
          if (!message.trim()) return false;

          // Skip single numbers without context
          if (args.length === 1 && typeof args[0] === "number") return false;

          // Skip very short messages that are likely debug noise
          if (message.length < 3) return false;

          // Skip repetitive debug messages
          const skipPatterns = [
            /^[0-9]+$/, // Just numbers
            /^\s*$/, // Just whitespace
            /^undefined$/,
            /^null$/,
          ];

          return !skipPatterns.some((pattern) => pattern.test(message));
        }

        // Send to server (throttled)
        let lastLogTime = 0;
        const LOG_THROTTLE_MS = 100; // Minimum time between logs

        function sendToServer(level, args) {
          const now = Date.now();
          if (now - lastLogTime < LOG_THROTTLE_MS) return;
          lastLogTime = now;

          if (!shouldForwardLog(args)) return;

          // ULTRA SIMPLE: Just convert everything to string and capture what the browser actually shows
          let message = "";
          try {
            // Capture the exact same output that would appear in browser console
            const parts = [];
            for (let i = 0; i < args.length; i++) {
              const arg = args[i];
              if (arg && typeof arg === "object" && arg.message) {
                // This looks like an Error object - get the actual error message
                parts.push(`${arg.name || "Error"}: ${arg.message}`);
                if (arg.stack) {
                  parts.push(`\nStack: ${arg.stack}`);
                }
              } else {
                // For everything else, just use String() which is what console does
                parts.push(String(arg));
              }
            }
            message = parts.join(" ");
          } catch (e) {
            message = `[Console forwarding error: ${e.message}] Raw args: ${args.length} items`;
          }

          fetch("/api/console-log", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              level,
              message,
              timestamp: new Date().toISOString(),
            }),
          }).catch(() => {}); // Ignore fetch errors
        }

        // Override console methods with smart filtering
        console.log = function (...args) {
          originalConsole.log.apply(console, args);
          sendToServer("LOG", args);
        };

        console.error = function (...args) {
          originalConsole.error.apply(console, args);
          sendToServer("ERROR", args);
        };

        console.warn = function (...args) {
          originalConsole.warn.apply(console, args);
          sendToServer("WARN", args);
        };

        console.info = function (...args) {
          originalConsole.info.apply(console, args);
          sendToServer("INFO", args);
        };

        // Capture global errors (always forward these)
        window.addEventListener("error", function (event) {
          // Suppress benign ResizeObserver errors (common with container queries)
          // These occur when ResizeObserver callbacks trigger more resizes in the same frame
          // This is expected behavior with CSS container queries and doesn't indicate a problem
          if (event.message && event.message.includes("ResizeObserver loop")) {
            event.preventDefault();
            event.stopPropagation();
            event.stopImmediatePropagation();
            return false; // Silently ignore this benign error
          }

          console.error("🚨 GLOBAL ERROR:", {
            message: event.message,
            filename: event.filename,
            line: event.lineno,
            column: event.colno,
            stack: event.error?.stack,
          });
        });

        // Capture unhandled promise rejections (always forward these)
        window.addEventListener("unhandledrejection", function (event) {
          console.error("🚨 UNHANDLED PROMISE REJECTION:", event.reason);
        });
      })();
    </script>

    <!-- BACKGROUND PRELOADER - Load saved background immediately to prevent FART (Flash of inAccurate coloR Theme) -->
    <!-- This script is render-blocking and runs BEFORE any Svelte/JS code -->
    <script>
      (function () {
        try {
          // Load saved settings
          var settingsKey = "tka-modern-web-settings";
          var stored = localStorage.getItem(settingsKey);
          var root = document.documentElement;

          // Theme colors for each background type - MUST match BACKGROUND_THEME_COLORS
          var BACKGROUND_THEME_COLORS = {
            pride: ["#8b1c1c", "#6b6b00", "#f43f5e", "#fda4af"],
            snowfall: ["#1e3a5f", "#3b82f6", "#93c5fd"],
            nightSky: ["#1e1b4b", "#4338ca", "#818cf8"],
            deepOcean: ["#0c4a6e", "#0891b2", "#22d3ee"],
            emberGlow: ["#7c2d12", "#ea580c", "#fb923c"],
            sakuraDrift: ["#831843", "#db2777", "#f9a8d4"],
            fireflyForest: ["#0d3320", "#166534", "#22c55e", "#bef264"],
            autumnDrift: ["#92400e", "#d97706", "#dc2626", "#78350f"],
            solidColor: ["#18181b", "#6366f1", "#818cf8"],
            linearGradient: ["#0d1117", "#6366f1", "#a78bfa"],
          };

          // Calculate relative luminance (WCAG formula)
          function calculateLuminance(hex) {
            var color = hex.replace("#", "");
            var r = parseInt(color.substring(0, 2), 16) / 255;
            var g = parseInt(color.substring(2, 4), 16) / 255;
            var b = parseInt(color.substring(4, 6), 16) / 255;
            var rL = r <= 0.03928 ? r / 12.92 : Math.pow((r + 0.055) / 1.055, 2.4);
            var gL = g <= 0.03928 ? g / 12.92 : Math.pow((g + 0.055) / 1.055, 2.4);
            var bL = b <= 0.03928 ? b / 12.92 : Math.pow((b + 0.055) / 1.055, 2.4);
            return 0.2126 * rL + 0.7152 * gL + 0.0722 * bL;
          }

          // Calculate gradient luminance (weighted average)
          function calculateGradientLuminance(colors) {
            if (!colors || colors.length === 0) return 0;
            if (colors.length === 1) return calculateLuminance(colors[0]);
            var first = calculateLuminance(colors[0]) * 0.5;
            var last = calculateLuminance(colors[colors.length - 1]) * 0.2;
            var middle = 0;
            if (colors.length > 2) {
              var middleColors = colors.slice(1, -1);
              for (var i = 0; i < middleColors.length; i++) {
                middle += calculateLuminance(middleColors[i]);
              }
              middle *= (0.3 / middleColors.length);
            }
            return first + middle + last;
          }

          // Extract accent color from gradient
          function extractAccent(colors) {
            if (!colors || colors.length === 0) return "#38bdf8";
            if (colors.length === 1) return colors[0];
            if (colors.length === 3) return colors[1];
            return colors[1] || colors[0];
          }

          // Detect mobile viewport
          function isMobile() {
            return window.innerWidth < 768;
          }

          // Apply ALL theme CSS variables
          function applyTheme(bgType, settings) {
            var themeColors = BACKGROUND_THEME_COLORS[bgType] || BACKGROUND_THEME_COLORS.solidColor;
            var luminance = calculateGradientLuminance(themeColors);
            var mode = luminance > 0.4 ? "light" : "dark";
            var accent = extractAccent(themeColors);
            var mobile = isMobile();

            // Set data attributes (survive HMR)
            root.dataset.backgroundType = bgType;
            root.dataset.themeLuminance = mode === "light" ? "bright" : "dim";

            // Generate matte theme values
            var panelBg, panelElevatedBg, cardBg, cardHoverBg, stroke, strokeStrong, text, textDim, shadow, panelShadow;

            if (mode === "light") {
              panelBg = "#d0d0ca";
              panelElevatedBg = "#d8d8d2";
              cardBg = "#d8d8d2";
              cardHoverBg = "#c8c8c2";
              stroke = "rgba(15, 23, 42, 0.15)";
              strokeStrong = "rgba(15, 23, 42, 0.22)";
              text = "#0f172a";
              textDim = "rgba(15, 23, 42, 0.75)";
              shadow = "0 12px 28px rgba(15, 23, 42, 0.18)";
              panelShadow = "0 12px 28px rgba(15, 23, 42, 0.18)";
            } else {
              panelBg = mobile ? "rgba(0, 0, 0, 0.88)" : "rgba(0, 0, 0, 0.75)";
              panelElevatedBg = mobile ? "rgba(0, 0, 0, 0.7)" : "rgba(0, 0, 0, 0.5)";
              cardBg = mobile ? "rgba(0, 0, 0, 0.88)" : "rgba(0, 0, 0, 0.75)";
              cardHoverBg = mobile ? "rgba(0, 0, 0, 0.7)" : "rgba(0, 0, 0, 0.55)";
              stroke = "rgba(255, 255, 255, 0.08)";
              strokeStrong = "rgba(255, 255, 255, 0.14)";
              text = "#ffffff";
              textDim = "rgba(255, 255, 255, 0.75)";
              shadow = "0 14px 36px rgba(0, 0, 0, 0.4)";
              panelShadow = "0 12px 28px rgba(0, 0, 0, 0.35)";
            }

            // Apply --theme-* variables
            root.style.setProperty("--theme-panel-bg", panelBg);
            root.style.setProperty("--theme-panel-elevated-bg", panelElevatedBg);
            root.style.setProperty("--theme-card-bg", cardBg);
            root.style.setProperty("--theme-card-hover-bg", cardHoverBg);
            root.style.setProperty("--theme-accent", accent);
            root.style.setProperty("--theme-accent-strong", accent);
            root.style.setProperty("--theme-stroke", stroke);
            root.style.setProperty("--theme-stroke-strong", strokeStrong);
            root.style.setProperty("--theme-text", text);
            root.style.setProperty("--theme-text-dim", textDim);
            root.style.setProperty("--theme-shadow", shadow);
            root.style.setProperty("--theme-panel-shadow", panelShadow);

            // Scrollbar variables
            root.style.setProperty("--scrollbar-thumb", mode === "light" ? "rgba(15, 23, 42, 0.25)" : "rgba(255, 255, 255, 0.2)");
            root.style.setProperty("--scrollbar-thumb-hover", mode === "light" ? "rgba(15, 23, 42, 0.4)" : "rgba(255, 255, 255, 0.35)");
            root.style.setProperty("--scrollbar-track", mode === "light" ? "rgba(15, 23, 42, 0.05)" : "transparent");

            // Semantic colors (constant)
            root.style.setProperty("--semantic-error", "#ef4444");
            root.style.setProperty("--semantic-success", "#22c55e");
            root.style.setProperty("--semantic-warning", "#f59e0b");
            root.style.setProperty("--semantic-info", "#3b82f6");
          }

          // Background gradients mapping - MUST match BackgroundGradients.ts
          var backgroundGradients = {
            solidColor: "#000000",
            linearGradient: "linear-gradient(135deg, #0d1117, #161b22, #21262d)",
            pride: "linear-gradient(180deg, #0a0a15 0%, #12121f 50%, #0d0d18 100%)",
            snowfall: "linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%)",
            nightSky: "linear-gradient(135deg, #0a0e2c 0%, #1a2040 50%, #2a3060 100%)",
            deepOcean: "linear-gradient(135deg, #001122 0%, #000c1e 50%, #000511 100%)",
            emberGlow: "linear-gradient(135deg, #1a0a0a 0%, #2d1410 30%, #4a1f1a 60%, #3d1814 100%)",
            sakuraDrift: "linear-gradient(135deg, #2a1f2e 0%, #3d2f42 30%, #4a3d52 60%, #362d40 100%)",
            fireflyForest: "linear-gradient(180deg, #0a0e18 0%, #0a1612 60%, #0c1a14 85%, #0a1810 100%)",
            autumnDrift: "linear-gradient(180deg, #1a1520 0%, #2d1f28 30%, #3d2a1f 60%, #2a1810 100%)",
          };

          // Background animation mapping
          var backgroundAnimations = {
            solidColor: "",
            linearGradient: "",
            pride: "rainbow-flow",
            snowfall: "snow-fall",
            nightSky: "star-twinkle",
            deepOcean: "deep-ocean-flow",
            emberGlow: "ember-glow",
            sakuraDrift: "cherry-blossom",
            fireflyForest: "firefly-forest",
            autumnDrift: "autumn-drift",
          };

          // Apply settings or defaults
          var backgroundType = "solidColor";
          if (stored) {
            var settings = JSON.parse(stored);
            backgroundType = settings.backgroundType || "solidColor";
          }

          // Apply theme CSS variables IMMEDIATELY (before paint)
          applyTheme(backgroundType, stored ? JSON.parse(stored) : {});

          // Apply gradient CSS variable
          var selectedGradient = backgroundGradients[backgroundType] || backgroundGradients.solidColor;
          root.style.setProperty("--gradient-cosmic", selectedGradient);

          // Apply animation class to body when ready
          var selectedAnimation = backgroundAnimations[backgroundType] || "";
          function applyBackgroundAnimation() {
            var body = document.body;
            if (body) {
              body.classList.remove(
                "rainbow-flow", "snow-fall", "star-twinkle", "deep-ocean-flow",
                "ember-glow", "cherry-blossom", "firefly-forest", "autumn-drift"
              );
              if (selectedAnimation) {
                body.classList.add(selectedAnimation);
              }
            } else {
              setTimeout(applyBackgroundAnimation, 10);
            }
          }

          if (document.body) {
            applyBackgroundAnimation();
          } else {
            document.addEventListener("DOMContentLoaded", applyBackgroundAnimation);
          }
        } catch (error) {
          console.warn("Failed to preload background:", error);
        }
      })();
    </script>

    <!-- PWA Manifest -->
    <link rel="manifest" href="%sveltekit.assets%/pwa/manifest.webmanifest" />

    <!-- Font Awesome CSS -->
    <!-- Note: Preload removed - SPA initialization delays icon rendering,
         causing "preloaded but not used" warnings. CSS handles font loading. -->
    <!-- crossorigin="anonymous" is REQUIRED for PostHog session replay to capture styles -->
    <link rel="stylesheet" href="/fonts/css/all.min.css" crossorigin="anonymous" />

    <!-- Google Identity Services -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>

    <!-- Critical styles (inline for instant render, no external CSS dependency) -->
    <style>
      /* Prevent white flash on PWA launch - app.css loads with JS bundle,
         so body has default white background until JS executes.
         These inline rules ensure dark background from first paint. */
      html, body {
        margin: 0;
        padding: 0;
        background-color: #0a0a0a;
        background: var(--gradient-cosmic, #0a0a0a);
      }

      #app-loading {
        position: fixed;
        inset: 0;
        z-index: 99999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 24px;
        background: var(--gradient-cosmic, #0a0a0a);
        opacity: 1;
        transition: opacity 400ms ease-out;
      }

      #app-loading.loaded {
        opacity: 0;
        pointer-events: none;
      }

      #app-loading img {
        width: 96px;
        height: 96px;
        animation: logo-breathe 3s ease-in-out infinite;
      }

      @keyframes logo-breathe {
        0%, 100% { opacity: 0.85; transform: scale(1); }
        50% { opacity: 1; transform: scale(1.03); }
      }

      .loading-bar-track {
        width: 240px;
        height: 6px;
        background: rgba(255, 255, 255, 0.08);
        border-radius: 3px;
        overflow: hidden;
      }

      .loading-bar-fill {
        width: 5%;
        height: 100%;
        background: linear-gradient(90deg, #38bdf8, #818cf8);
        border-radius: 3px;
        transition: width 500ms cubic-bezier(0.4, 0, 0.2, 1);
        box-shadow: 0 0 8px rgba(56, 189, 248, 0.4);
        animation: bar-pulse 2s ease-in-out infinite;
      }

      @keyframes bar-pulse {
        0%, 100% { box-shadow: 0 0 8px rgba(56, 189, 248, 0.4); }
        50% { box-shadow: 0 0 14px rgba(56, 189, 248, 0.7); }
      }

      #app-loading p {
        margin: 0;
        font-family: system-ui, -apple-system, sans-serif;
        font-size: 13px;
        color: rgba(255, 255, 255, 0.5);
        letter-spacing: 0.02em;
        transition: opacity 200ms ease;
      }

      @media (prefers-reduced-motion: reduce) {
        .loading-bar-fill {
          transition: none;
          animation: none;
        }
        #app-loading img {
          animation: none;
          opacity: 1;
        }
      }
    </style>

    %sveltekit.head%
  </head>
  <body
    data-sveltekit-preload-data="hover"
    class="bg-background text-foreground"
  >
    <div id="app-loading" aria-label="Loading TKA Scribe" role="progressbar" aria-valuenow="5" aria-valuemin="0" aria-valuemax="100">
      <img src="%sveltekit.assets%/pwa/icons/icon-192x192.png" alt="" width="96" height="96" />
      <div class="loading-bar-track">
        <div class="loading-bar-fill" id="loading-bar-fill"></div>
      </div>
      <p id="loading-text"></p>
    </div>
    <script>
      // Sims-style flavor text — shuffled each load for variety
      var __tkaFlavorMessages = [
        "Calibrating spin direction...",
        "Consulting the ancient glyphs...",
        "Warming up wrists...",
        "Polishing the diamond grid...",
        "Reticulating flower patterns...",
        "Shuffling the alphabet...",
        "Winding up the props...",
        "Aligning the cardinal points...",
        "Counting antispin rotations...",
        "Negotiating with gravity...",
        "Debating prospin vs inspin...",
        "Stretching the time signature...",
        "Tuning the isolation engine...",
        "Rehearsing the entrance...",
        "Checking staff balance...",
        "Convincing electrons to flow...",
        "Mapping the kinetic field...",
        "Syncing the downbeat...",
        "Charging the glow sticks...",
        "Meditating on beta position...",
        "Asking permission from physics...",
        "Dusting off the notation...",
        "Summoning the flow state..."
      ];

      // Fisher-Yates shuffle
      for (var i = __tkaFlavorMessages.length - 1; i > 0; i--) {
        var j = Math.floor(Math.random() * (i + 1));
        var tmp = __tkaFlavorMessages[i];
        __tkaFlavorMessages[i] = __tkaFlavorMessages[j];
        __tkaFlavorMessages[j] = tmp;
      }

      var __tkaReadyMessages = [
        "Let's spin.",
        "Props loaded. You're up.",
        "Ready to flow.",
        "All systems go."
      ];

      // Trickle state
      var __tkaTrickleIndex = 0;
      var __tkaTricklePercent = 5;
      var __tkaTrickleInterval = null;
      var __tkaTrickleStopped = false;

      // Show first flavor message immediately — no generic "Loading..."
      var _initText = document.getElementById('loading-text');
      if (_initText && __tkaFlavorMessages.length > 0) {
        _initText.textContent = __tkaFlavorMessages[__tkaTrickleIndex];
        __tkaTrickleIndex++;
      }

      // Trickle — advances 1% every 1.5s up to 18% with rotating messages
      __tkaTrickleInterval = setInterval(function() {
        if (__tkaTrickleStopped) return;
        var bar = document.getElementById('loading-bar-fill');
        var text = document.getElementById('loading-text');
        var screen = document.getElementById('app-loading');
        if (!bar || !text) return;

        __tkaTricklePercent = Math.min(__tkaTricklePercent + 1, 18);
        bar.style.width = __tkaTricklePercent + '%';
        if (screen) screen.setAttribute('aria-valuenow', String(__tkaTricklePercent));

        // Rotate through flavor messages (direct swap — 800ms spacing means no flicker)
        if (__tkaTrickleIndex < __tkaFlavorMessages.length) {
          text.textContent = __tkaFlavorMessages[__tkaTrickleIndex];
          __tkaTrickleIndex++;
        }

        // Cap reached — stop ticking but keep last message visible
        if (__tkaTricklePercent >= 18) {
          clearInterval(__tkaTrickleInterval);
        }
      }, 1500);

      // Progress state — monotonic (never goes backwards, ignores calls after 100%)
      var __tkaCurrentPercent = 5;
      var __tkaFinished = false;
      var __tkaLastTextTime = 0;
      var __tkaMinTextGap = 500; // minimum ms between text changes — suppress rapid flickers

      // Real progress function — called by SvelteKit as initialization proceeds.
      // The BAR always advances smoothly (CSS transition handles interpolation).
      // The TEXT only updates if enough time has passed — rapid bursts are collapsed
      // so the user reads the first message, the bar slides, then sees "Ready".
      window.__tkaLoadProgress = function(percent, message) {
        // Monotonic: ignore out-of-order or duplicate calls
        if (percent <= __tkaCurrentPercent || __tkaFinished) return;
        __tkaCurrentPercent = percent;

        // Stop trickle on first real checkpoint
        if (!__tkaTrickleStopped) {
          __tkaTrickleStopped = true;
          clearInterval(__tkaTrickleInterval);
        }

        var bar = document.getElementById('loading-bar-fill');
        var text = document.getElementById('loading-text');
        var screen = document.getElementById('app-loading');

        // Bar ALWAYS updates — CSS transition makes it smooth regardless of timing
        if (bar) bar.style.width = percent + '%';
        if (screen) screen.setAttribute('aria-valuenow', String(percent));

        var now = Date.now();

        if (percent >= 100) {
          __tkaFinished = true;
          var readyMsg = __tkaReadyMessages[Math.floor(Math.random() * __tkaReadyMessages.length)];
          if (text) { text.style.opacity = '1'; text.textContent = readyMsg; }
          clearTimeout(window.__tkaLoadTimeout);
          setTimeout(function() {

              screen.addEventListener('transitionend', function() { screen.remove(); });
            }
          }, 1000);
        } else if (now - __tkaLastTextTime >= __tkaMinTextGap) {
          // Enough time since last text change — update the message
          if (text) { text.style.opacity = '1'; text.textContent = message; }
          __tkaLastTextTime = now;
        }
        // else: suppress text update (too soon), bar still advances silently
      };

      // Safety net: if progress never reaches 100%, force-dismiss after 15s
      window.__tkaLoadTimeout = setTimeout(function() {
        var screen = document.getElementById('app-loading');
        if (screen && !screen.classList.contains('loaded')) {
          screen.classList.add('loaded');
          screen.addEventListener('transitionend', function() { screen.remove(); });
        }
      }, 15000);
    </script>
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
