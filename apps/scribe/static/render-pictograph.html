<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Pictograph Renderer</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      padding: 40px;
      background: #1a1a2e;
      color: white;
    }
    #status {
      font-size: 18px;
      margin-bottom: 20px;
      padding: 12px;
      background: rgba(255,255,255,0.05);
      border-radius: 8px;
    }
    canvas {
      border: 1px solid #444;
      max-width: 100%;
      margin-top: 20px;
    }
  </style>
</head>
<body>
  <h1>Pictograph Renderer</h1>
  <div id="status">Loading...</div>
  <div id="canvas-container"></div>

  <script type="module">
    const urlParams = new URLSearchParams(window.location.search);
    const letter = urlParams.get('letter');
    const status = document.getElementById('status');
    const container = document.getElementById('canvas-container');

    if (!letter) {
      status.textContent = 'Error: No letter specified. Use ?letter=A';
    } else {
      renderPictograph(letter);
    }

    async function renderPictograph(letter) {
      try {
        status.textContent = `Rendering ${letter}...`;

        // Dynamically import from the actual Svelte app
        const { container: diContainer } = await import('/src/lib/shared/inversify/di.ts');
        const { TYPES } = await import('/src/lib/shared/inversify/types/core.types.ts');

        const renderer = diContainer.get(TYPES.IDirectRenderer);
        await renderer.initialize();

        // Load CSV
        const response = await fetch('/data/pictographs/DiamondPictographDataframe.csv');
        const csvData = await response.text();
        const lines = csvData.split('\n');
        const headers = lines[0].split(',');

        let row = null;
        for (let i = 1; i < lines.length; i++) {
          const r = lines[i].split(',');
          if (r[0] === letter) {
            row = r;
            break;
          }
        }

        if (!row) {
          status.textContent = `Error: No data for letter ${letter}`;
          return;
        }

        // Create pictograph data
        const pictographData = {
          id: `pictograph-${letter}`,
          letter: letter,
          motions: {
            blue: {
              motionType: row[headers.indexOf('blueMotionType')],
              rotationDirection: row[headers.indexOf('blueRotationDirection')],
              startLocation: row[headers.indexOf('blueStartLocation')],
              endLocation: row[headers.indexOf('blueEndLocation')],
              startOrientation: 'in',
              endOrientation: 'in',
              turns: 1,
              propType: 'staff',
              propPlacementData: { propType: 'staff' }
            },
            red: {
              motionType: row[headers.indexOf('redMotionType')],
              rotationDirection: row[headers.indexOf('redRotationDirection')],
              startLocation: row[headers.indexOf('redStartLocation')],
              endLocation: row[headers.indexOf('redEndLocation')],
              startOrientation: 'in',
              endOrientation: 'in',
              turns: 1,
              propType: 'staff',
              propPlacementData: { propType: 'staff' }
            }
          }
        };

        // Render
        const canvas = await renderer.renderPictograph(pictographData, {
          size: 950,
          showGrid: true,
          showTKA: true,
          showVTG: false,
          showElemental: false,
          showPositions: false,
          showReversals: false,
          showNonRadialPoints: false,
          darkMode: false,
          handPointVisibility: 'active',
        });

        container.appendChild(canvas);
        status.textContent = `✅ Rendered pictograph ${letter}`;

        // Also add it to window for script access
        window.pictographCanvas = canvas;

      } catch (error) {
        status.textContent = `Error: ${error.message}`;
        console.error(error);
      }
    }
  </script>
</body>
</html>
