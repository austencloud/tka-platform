<!DOCTYPE html>
<html>
<head>
  <title>SVG vs Canvas 2D Render Comparison</title>
  <style>
    body { font-family: sans-serif; background: #1a1a2e; color: white; padding: 20px; }
    .container { display: flex; gap: 40px; flex-wrap: wrap; }
    .render-box {
      border: 2px solid #333;
      padding: 20px;
      border-radius: 8px;
      background: #0a0a0f;
    }
    .render-box h2 { margin-top: 0; }
    .render-box canvas, .render-box img {
      border: 1px solid #444;
      display: block;
      margin-bottom: 10px;
    }
    .info { font-size: 12px; color: #888; margin-top: 10px; }
    .error { color: #ff6b6b; }
    .success { color: #51cf66; }
    button {
      padding: 10px 20px;
      margin: 10px 5px 10px 0;
      cursor: pointer;
      background: #4c6ef5;
      color: white;
      border: none;
      border-radius: 4px;
    }
    button:hover { background: #364fc7; }
    #status { margin: 20px 0; padding: 10px; background: #1e1e3f; border-radius: 4px; min-height: 20px; }
    .comparison-result {
      margin-top: 20px;
      padding: 15px;
      background: #1e1e3f;
      border-radius: 8px;
    }
    .match { color: #51cf66; font-weight: bold; }
    .mismatch { color: #ff6b6b; font-weight: bold; }
  </style>
</head>
<body>
  <h1>SVG vs Canvas 2D Render Comparison</h1>

  <div id="status">Ready to render. Click a button to start.</div>

  <div>
    <button onclick="renderComparison()">Render Both Methods</button>
    <button onclick="downloadImages()">Download Both Images</button>
  </div>

  <div class="container">
    <div class="render-box">
      <h2>SVG Render (Reference)</h2>
      <div id="svg-output"></div>
      <div id="svg-info" class="info"></div>
    </div>

    <div class="render-box">
      <h2>Canvas 2D Render</h2>
      <canvas id="canvas2d-output" width="300" height="300"></canvas>
      <div id="canvas2d-info" class="info"></div>
    </div>
  </div>

  <div id="comparison-result" class="comparison-result" style="display: none;"></div>

  <script type="module">
    // Import the rendering utilities - assumes dev server is running

    window.renderComparison = async function() {
      const status = document.getElementById('status');
      status.innerHTML = 'Rendering...';

      try {
        // Create a test pictograph data object
        const testPictograph = {
          id: 'test-1',
          letter: 'A',
          motions: {
            blue: {
              motionType: 'pro',
              startLocation: 'n',
              endLocation: 'e',
              turns: 1,
              rotationDirection: 'cw',
              startOrientation: 'in',
              endOrientation: 'in',
              propType: 'staff',
              color: 'blue',
              propPlacementData: {
                propType: 'staff'
              }
            },
            red: {
              motionType: 'pro',
              startLocation: 's',
              endLocation: 'w',
              turns: 1,
              rotationDirection: 'cw',
              startOrientation: 'in',
              endOrientation: 'in',
              propType: 'staff',
              color: 'red',
              propPlacementData: {
                propType: 'staff'
              }
            }
          }
        };

        const size = 300;

        // Import the SVG renderer
        status.innerHTML = 'Rendering SVG...';
        const { renderPictographToSVG } = await import('/src/lib/shared/render/utils/pictograph-to-svg.ts');

        const startSvg = performance.now();
        const svgString = await renderPictographToSVG(testPictograph, size, undefined, {
          showTKA: true,
          darkMode: true
        });
        const svgTime = performance.now() - startSvg;

        // Display SVG result
        const svgImg = new Image();
        svgImg.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svgString);
        svgImg.onload = () => {
          document.getElementById('svg-output').innerHTML = '';
          document.getElementById('svg-output').appendChild(svgImg);
          document.getElementById('svg-info').innerHTML =
            'Time: ' + svgTime.toFixed(1) + 'ms<br>Size: ' + size + 'x' + size;
        };

        window.svgImage = svgImg;
        window.svgString = svgString;

        // Now render with Canvas 2D
        status.innerHTML = 'Rendering Canvas 2D...';

        const { Canvas2DDirectRenderer } = await import('/src/lib/shared/render/services/implementations/Canvas2DDirectRenderer.ts');
        const renderer = new Canvas2DDirectRenderer();
        await renderer.initialize();

        const startCanvas = performance.now();
        const { canvas, timing } = await renderer.renderPictographWithTiming(testPictograph, {
          size: size,
          visibility: {
            showTKA: true,
            showReversals: true,
            showNonRadialPoints: false,
            darkMode: true
          }
        });
        const canvasTime = performance.now() - startCanvas;

        // Display Canvas 2D result
        const outputCanvas = document.getElementById('canvas2d-output');
        const ctx = outputCanvas.getContext('2d');
        ctx.clearRect(0, 0, size, size);
        ctx.drawImage(canvas, 0, 0);

        document.getElementById('canvas2d-info').innerHTML =
          'Time: ' + canvasTime.toFixed(1) + 'ms (setup: ' + timing.setupMs.toFixed(1) + ', draw: ' + timing.drawMs.toFixed(1) + ')<br>Size: ' + size + 'x' + size;

        window.canvas2dOutput = canvas;

        // Show success
        const speedup = (svgTime / canvasTime).toFixed(1);
        status.innerHTML = '<span class="success">Rendered! SVG: ' + svgTime.toFixed(1) + 'ms, Canvas: ' + canvasTime.toFixed(1) + 'ms (' + speedup + 'x faster)</span>';

        // Show comparison result
        showComparisonResult();

      } catch (error) {
        status.innerHTML = '<span class="error">Error: ' + error.message + '</span>';
        console.error('Render error:', error);
      }
    };

    function showComparisonResult() {
      const resultDiv = document.getElementById('comparison-result');
      resultDiv.style.display = 'block';
      resultDiv.innerHTML = `
        <h3>Visual Comparison</h3>
        <p>Compare the two renders above. The Canvas 2D render should match the SVG reference.</p>
        <p>Check for:</p>
        <ul>
          <li>Grid position and rotation</li>
          <li>Arrow positions and orientations</li>
          <li>Prop positions and orientations</li>
          <li>TKA letter position and size</li>
          <li>Turn numbers: should be to the RIGHT of the letter (not left/right sides of pictograph)</li>
          <li>Direction dot: above (same) or below (opp) the letter</li>
          <li>Beat number: top-left corner</li>
        </ul>
      `;
    }

    window.downloadImages = function() {
      if (window.svgString) {
        // Download SVG as file
        const blob = new Blob([window.svgString], {type: 'image/svg+xml'});
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'svg-render.svg';
        a.click();
        URL.revokeObjectURL(url);
      }

      if (window.canvas2dOutput) {
        // Download Canvas as PNG
        const url = window.canvas2dOutput.toDataURL('image/png');
        const a = document.createElement('a');
        a.href = url;
        a.download = 'canvas2d-render.png';
        a.click();
      }
    };
  </script>
</body>
</html>
