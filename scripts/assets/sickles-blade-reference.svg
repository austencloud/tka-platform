  <path fill="#d9dde3" fill-rule="evenodd" d="
    M 2 6
    C 56 3, 124 23, 188 94
    Q 190 97, 186 101
    C 132 76, 76 59, 16 55
    L 16 69
    L 2 69 Z

    M 20 16
    C 44 17, 64 21, 82 28
    L 73 45
    C 57 39, 40 35, 24 34 Z

    M 116 41
    C 136 51, 153 63, 169 78
    L 156 88
    C 142 75, 127 65, 110 57 Z

    M 113 51
    A 18 18 0 1 1 77 51
    A 18 18 0 1 1 113 51 Z
  "/>
</svg>
