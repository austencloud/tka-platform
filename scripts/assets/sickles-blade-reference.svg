<!--
  Symmetry-clean production trace for one competition kama blade.

  The 190 x 120 envelope comes from the published 36 x 19 x 4 cm prop size.
  Its silhouette follows the Century Fire & Ice competition kama reference:
  a broad rounded heel, a continuous crescent spine, a swept cutting edge, two
  elongated weight-reduction windows, and the central yin-yang window. The trace is authored without camera skew so
  both hands receive the same manufactured geometry.
-->
