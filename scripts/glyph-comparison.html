<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Glyph Comparison — Original vs Fused</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #1a1a2e; color: #fff; font-family: system-ui, sans-serif; padding: 40px; }
  h1 { text-align: center; margin-bottom: 8px; font-size: 24px; font-weight: 500; }
  .subtitle { text-align: center; color: #888; margin-bottom: 40px; font-size: 14px; }
  .grid {
    display: grid;
    grid-template-columns: repeat(6, 1fr);
    gap: 24px;
    max-width: 1200px;
    margin: 0 auto;
  }
  .cell {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
  }
  .label {
    font-size: 13px;
    color: #aaa;
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }
  .icon-box {
    width: 130px;
    height: 130px;
    display: flex;
    align-items: center;
    justify-content: center;
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 12px;
    background: rgba(255,255,255,0.03);
  }
  .icon-box img {
    max-width: 110px;
    max-height: 110px;
    object-fit: contain;
  }
  .vtg-text {
    font-family: 'Inter', 'SF Pro Display', system-ui, sans-serif;
    font-size: 48px;
    font-weight: 600;
    color: rgba(255,255,255,0.85);
    letter-spacing: 0.02em;
  }
  .divider {
    grid-column: 1 / -1;
    height: 1px;
    background: rgba(255,255,255,0.1);
    margin: 8px 0;
  }
  .row-label {
    grid-column: 1 / -1;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: #666;
    padding-left: 4px;
  }
  /* Dark and light comparison */
  .light-section {
    background: #f0f0f0;
    border-radius: 16px;
    padding: 32px 24px;
    margin-top: 40px;
    max-width: 1200px;
    margin-left: auto;
    margin-right: auto;
  }
  .light-section h2 { color: #333; text-align: center; margin-bottom: 24px; font-size: 18px; font-weight: 500; }
  .light-section .icon-box {
    border-color: rgba(0,0,0,0.08);
    background: rgba(0,0,0,0.03);
  }
  .light-section .vtg-text { color: rgba(0,0,0,0.7); }
  .light-section .label { color: #666; }

  .size-note {
    text-align: center;
    color: #555;
    font-size: 12px;
    margin-top: 12px;
  }
</style>
</head>
<body>

<h1>Elemental VTG Glyph Comparison</h1>
<p class="subtitle">Original (separate elemental + VTG text) vs Fused (single combined glyph)</p>

<div class="grid">
  <div class="row-label">Original Elemental Icons</div>

  <div class="cell">
    <div class="label">Water / SS</div>
    <div class="icon-box"><img src="../static/images/elements/water.svg" alt="Water"></div>
  </div>
  <div class="cell">
    <div class="label">Fire / SO</div>
    <div class="icon-box"><img src="../static/images/elements/fire.svg" alt="Fire"></div>
  </div>
  <div class="cell">
    <div class="label">Earth / TS</div>
    <div class="icon-box"><img src="../static/images/elements/earth.svg" alt="Earth"></div>
  </div>
  <div class="cell">
    <div class="label">Air / TO</div>
    <div class="icon-box"><img src="../static/images/elements/air.svg" alt="Air"></div>
  </div>
  <div class="cell">
    <div class="label">Sun / QS</div>
    <div class="icon-box"><img src="../static/images/elements/sun.svg" alt="Sun"></div>
  </div>
  <div class="cell">
    <div class="label">Moon / QO</div>
    <div class="icon-box"><img src="../static/images/elements/moon.svg" alt="Moon"></div>
  </div>

  <div class="row-label">Original VTG Text</div>

  <div class="cell"><div class="icon-box"><span class="vtg-text">SS</span></div></div>
  <div class="cell"><div class="icon-box"><span class="vtg-text">SO</span></div></div>
  <div class="cell"><div class="icon-box"><span class="vtg-text">TS</span></div></div>
  <div class="cell"><div class="icon-box"><span class="vtg-text">TO</span></div></div>
  <div class="cell"><div class="icon-box"><span class="vtg-text">QS</span></div></div>
  <div class="cell"><div class="icon-box"><span class="vtg-text">QO</span></div></div>

  <div class="divider"></div>
  <div class="row-label">Fused Glyphs (vectorized SVG)</div>

  <div class="cell">
    <div class="icon-box"><img src="../../Downloads/split-glyphs/svg/optimized/SS-water.svg" alt="SS Water Fused"></div>
  </div>
  <div class="cell">
    <div class="icon-box"><img src="../../Downloads/split-glyphs/svg/optimized/SO-fire.svg" alt="SO Fire Fused"></div>
  </div>
  <div class="cell">
    <div class="icon-box"><img src="../../Downloads/split-glyphs/svg/optimized/TS-earth.svg" alt="TS Earth Fused"></div>
  </div>
  <div class="cell">
    <div class="icon-box"><img src="../../Downloads/split-glyphs/svg/optimized/TO-air.svg" alt="TO Air Fused"></div>
  </div>
  <div class="cell">
    <div class="icon-box"><img src="../../Downloads/split-glyphs/svg/optimized/QS-sun.svg" alt="QS Sun Fused"></div>
  </div>
  <div class="cell">
    <div class="icon-box"><img src="../../Downloads/split-glyphs/svg/optimized/QO-moon.svg" alt="QO Moon Fused"></div>
  </div>
</div>

<div class="light-section">
  <h2>Light Background Preview</h2>
  <div class="grid">
    <div class="row-label" style="color:#999;">Original</div>

    <div class="cell">
      <div class="icon-box"><img src="../static/images/elements/water.svg" alt="Water"></div>
    </div>
    <div class="cell">
      <div class="icon-box"><img src="../static/images/elements/fire.svg" alt="Fire"></div>
    </div>
    <div class="cell">
      <div class="icon-box"><img src="../static/images/elements/earth.svg" alt="Earth"></div>
    </div>
    <div class="cell">
      <div class="icon-box"><img src="../static/images/elements/air.svg" alt="Air"></div>
    </div>
    <div class="cell">
      <div class="icon-box"><img src="../static/images/elements/sun.svg" alt="Sun"></div>
    </div>
    <div class="cell">
      <div class="icon-box"><img src="../static/images/elements/moon.svg" alt="Moon"></div>
    </div>

    <div class="row-label" style="color:#999;">Fused</div>

    <div class="cell">
      <div class="icon-box"><img src="../../Downloads/split-glyphs/svg/optimized/SS-water.svg" alt="SS Water"></div>
    </div>
    <div class="cell">
      <div class="icon-box"><img src="../../Downloads/split-glyphs/svg/optimized/SO-fire.svg" alt="SO Fire"></div>
    </div>
    <div class="cell">
      <div class="icon-box"><img src="../../Downloads/split-glyphs/svg/optimized/TS-earth.svg" alt="TS Earth"></div>
    </div>
    <div class="cell">
      <div class="icon-box"><img src="../../Downloads/split-glyphs/svg/optimized/TO-air.svg" alt="TO Air"></div>
    </div>
    <div class="cell">
      <div class="icon-box"><img src="../../Downloads/split-glyphs/svg/optimized/QS-sun.svg" alt="QS Sun"></div>
    </div>
    <div class="cell">
      <div class="icon-box"><img src="../../Downloads/split-glyphs/svg/optimized/QO-moon.svg" alt="QO Moon"></div>
    </div>
  </div>
</div>

</body>
</html>
